<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Walking Memory · Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  :root {
    --petrol: #186078; --petrol-deep: #0E3F50; --sky-soft: #E7F4FA; --amber-text: #9A5413;
    --ink: #12303B; --muted: #4B6470; --line: #D3E3EA; --line-strong: #6F8D99; --mist: #F2F7F9; --danger: #B3261E;
    /* chart roles (validated categorical slot 1 of the reference palette, light mode) */
    --surface-1: #ffffff; --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --grid: #e6ecef; --text-primary: #12303B; --text-secondary: #4B6470;
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--mist); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
  button, input, select { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; border: 0; border-radius: 999px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid #249CCC; outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 24px; background: var(--petrol); color: #fff; }
  header h1 { margin: 0; font-size: 22px; font-style: italic; flex: 1 1 auto; }
  header select, header button { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 0; font-weight: 700; color: var(--petrol); background: #fff; }
  header label { font-size: 14px; font-weight: 600; }
  #userName { font-weight: 600; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; }
  .login { max-width: 420px; margin: 40px auto; }
  .login label { display: block; font-weight: 600; color: var(--petrol); margin: 10px 0 4px; }
  .login input { width: 100%; padding: 10px 12px; border: 2px solid var(--line-strong); border-radius: 10px; }
  .btn { background: var(--petrol); color: #fff; font-weight: 700; padding: 10px 20px; min-height: 44px; margin-top: 14px; }
  .btn-sm { background: var(--mist); color: var(--petrol); border: 1px solid var(--line-strong); font-weight: 700; padding: 4px 12px; min-height: 32px; font-size: 13px; }
  .err { color: var(--danger); font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; }
  code { background: var(--mist); padding: 1px 5px; border-radius: 4px; }

  h2 { margin: 0 0 4px; color: var(--petrol); font-size: 22px; font-style: italic; }
  h3 { margin: 18px 0 8px; color: var(--petrol); font-size: 17px; }
  .lead { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .kpi { background: var(--mist); border-radius: 12px; padding: 10px 14px; }
  .kpi .v { font-size: 30px; font-weight: 700; color: var(--text-primary); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
  .kpi .s { font-size: 12px; color: var(--text-secondary); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; }
  .chart .tick { font-size: 11px; fill: var(--text-secondary); }
  .chart .gl { stroke: var(--grid); stroke-width: 1; }
  .chart .bar { fill: var(--series-1); }
  .chart .hit { fill: transparent; }
  .chart .hit:hover + .bar, .chart .bar.on { fill: #1c5cab; }
  .tip { position: absolute; pointer-events: none; background: #fff; color: var(--text-primary); border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 8px; font-size: 13px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12); transform: translate(-50%, -110%); }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; }
  details.tbl > summary { cursor: pointer; color: var(--petrol); font-size: 13px; font-weight: 600; margin-top: 4px; }

  /* horizontal bars (HTML): label · bar · value */
  .hchart { position: relative; }
  .hrow { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 64px; align-items: center; gap: 10px; padding: 3px 0; }
  .hrow .hl { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .track { display: flex; height: 18px; align-items: stretch; }
  .hrow .seg { height: 100%; margin-right: 2px; min-width: 2px; }
  .hrow .seg:last-child { border-radius: 0 4px 4px 0; margin-right: 0; }
  .hrow .hv { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .hrow:hover .hl { font-weight: 700; }
  .hmore { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-secondary); margin: 0 0 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  details.tbl-wrap { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.tbl-wrap > summary { cursor: pointer; color: var(--petrol); font-weight: 700; font-size: 15px; }
  details.tbl-wrap .tbar { margin: 8px 0; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; background: var(--mist); color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 7px 10px; white-space: nowrap; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th[aria-sort="descending"]::after { content: ' ▾'; } th[aria-sort="ascending"]::after { content: ' ▴'; }
  td { padding: 6px 10px; border-top: 1px solid var(--line); }
  td.muted { color: var(--muted); }
  .chip { font-size: 12px; font-weight: 700; } .chip.draft { color: var(--amber-text); } .chip.pub { color: var(--petrol); }
  .tbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }
  .tbar h3 { margin: 0; }
  #tVisitors { max-height: 440px; overflow: auto; }
  #tVisitors th { position: sticky; top: 0; }
</style>
</head>
<body>
<header>
  <h1 data-i="title"></h1>
  <label><span data-i="range"></span>
    <select id="range"><option value="7"></option><option value="30" selected></option><option value="90"></option><option value="all"></option></select></label>
  <select id="lang" aria-label="Language"><option value="el">EL</option><option value="en">EN</option></select>
  <button id="refresh" type="button" hidden data-i="refresh"></button>
  <span id="userName"></span>
  <button id="logout" type="button" hidden data-i="logout"></button>
</header>

<main>
  <section id="loginView" class="card login" hidden>
    <h2 data-i="login"></h2>
    <p class="note" data-i="loginHint"></p>
    <form id="loginForm" novalidate>
      <label for="email" data-i="email"></label><input id="email" type="email" autocomplete="email" required>
      <label for="pass" data-i="password"></label><input id="pass" type="password" autocomplete="current-password" required>
      <p id="loginErr" class="err" role="alert"></p>
      <button class="btn" type="submit" data-i="login"></button>
    </form>
  </section>

  <section id="noAccess" class="card login" hidden>
    <p class="err" data-i="noAccess"></p>
    <p class="note"><span data-i="noAccessHow"></span><br><code>update public.profiles set is_admin = true where user_id = (select id from auth.users where email = '…');</code></p>
  </section>

  <div id="dash" hidden>
    <p id="loadStatus" class="note" role="status"></p>

    <section class="card" aria-labelledby="h-use">
      <h2 id="h-use" data-i="useTitle"></h2>
      <p class="lead" data-i="useLead"></p>
      <div class="kpis" id="useKpis"></div>
      <div class="grid2">
        <div><h3 data-i="opensPerDay"></h3><div class="chart" id="chOpens"></div></div>
        <div><h3 data-i="storiesPerVisitor"></h3><div class="chart" id="chPerVisitor"></div></div>
      </div>
      <div class="grid2">
        <div><h3 data-i="topStories"></h3><div class="hchart" id="chTopStories"></div></div>
        <div>
          <h3 data-i="fromWhere"></h3><div class="hchart" id="chVia"></div>
          <h3 data-i="funnel"></h3><div class="hchart" id="chFunnel"></div>
        </div>
      </div>
      <details class="tbl-wrap"><summary data-i="tblStories"></summary>
        <div class="tbar"><span></span><button class="btn-sm" type="button" data-csv="tStories" data-i="csv"></button></div>
        <div class="tablewrap" id="tStories"></div>
      </details>
      <details class="tbl-wrap"><summary data-i="tblVisitors"></summary>
        <p class="lead" data-i="perVisitorLead"></p>
        <div class="tbar"><span></span><button class="btn-sm" type="button" data-csv="tVisitors" data-i="csv"></button></div>
        <div class="tablewrap" id="tVisitors"></div>
      </details>
    </section>

    <section class="card" aria-labelledby="h-ann">
      <h2 id="h-ann" data-i="annTitle"></h2>
      <p class="lead" data-i="annLead"></p>
      <div class="kpis" id="annKpis"></div>
      <h3 data-i="corrPerDay"></h3>
      <div class="chart" id="chCorr"></div>
      <div class="grid2">
        <div><h3 data-i="workPerAnnotator"></h3><div class="hchart" id="chWork"></div></div>
        <div><h3 data-i="wordsPerAnnotator"></h3><div class="hchart" id="chWords"></div>
             <h3 data-i="reviewPerAnnotator"></h3><div class="hchart" id="chReview"></div></div>
      </div>
      <h3 data-i="workPerStory"></h3><div class="hchart" id="chStoryWork"></div>
      <details class="tbl-wrap"><summary data-i="tblAnnotators"></summary>
        <div class="tbar"><span></span><button class="btn-sm" type="button" data-csv="tAnnotators" data-i="csv"></button></div>
        <div class="tablewrap" id="tAnnotators"></div>
      </details>
      <details class="tbl-wrap"><summary data-i="tblAnnStories"></summary>
        <div class="tbar"><span></span><button class="btn-sm" type="button" data-csv="tAnnStories" data-i="csv"></button></div>
        <div class="tablewrap" id="tAnnStories"></div>
      </details>
    </section>
  </div>
</main>

      { k: 'edited', h: t('cEdited'), num: true }, { k: 'deleted', h: t('cDeleted'), num: true }, { k: 'notes', h: t('cNotes'), num: true }];
    var aRows = group(function (a) { return a.user_id; }, function (a) { return a.user_name || (a.user_id || '').slice(0, 8); });
    var WORK = [{ k: 'approved', name: t('sApproved'), color: 'var(--series-1)' }, { k: 'rejected', name: t('sRejected'), color: 'var(--series-2)' },
      { k: 'added', name: t('sAdded'), color: 'var(--series-3)' }, { k: 'edited', name: t('sEdited'), color: 'var(--series-4)' }, { k: 'deleted', name: t('sDeleted'), color: 'var(--series-5)' }];
    hbarChart($('chWork'), aRows.map(function (r) { return Object.assign({ l: r.name }, r); }), { label: t('workPerAnnotator'), series: WORK });
    hbarChart($('chWords'), aRows.map(function (r) { return { l: r.name, v: r.words }; }), { label: t('wordsPerAnnotator') });
    hbarChart($('chReview'), aRows.map(function (r) { return { l: r.name, approved: r.approved, rejected: r.rejected }; }), { label: t('reviewPerAnnotator'), series: WORK.slice(0, 2),
      fmt: function (r) { return r.approved + r.rejected ? Math.round(r.approved / (r.approved + r.rejected) * 100) + '% ✓' : ''; } });
    putTable('tAnnotators', [{ k: 'name', h: t('cAnnotator') }].concat(cols, [{ k: 'last', h: t('cLastAct') }]), aRows, 'corr');
    var sRows = group(function (a) { return a.story_id; }, function (a) { return byId[a.story_id] ? byId[a.story_id].title : t('deleted'); });
    hbarChart($('chStoryWork'), sRows.map(function (r) { return { l: r.name, rejected: r.rejected, added: r.added, edited: r.edited, deleted: r.deleted, lines: r.lines }; }),
      { label: t('workPerStory'), series: [{ k: 'lines', name: t('sLines'), color: 'var(--series-1)' }].concat(WORK.slice(1)) });   // ίδια σειρά χρωμάτων με το επικυρωμένο παλέτο
    putTable('tAnnStories', [{ k: 'name', h: t('cStory'), render: function (td, r) { storyCell(byId)(td, r); } }].concat(cols), sRows, 'corr');
  }

  // ---------------- login / access ----------------
  async function showState() {
    $('loginView').hidden = !!user; $('logout').hidden = !user; $('userName').textContent = user ? (user.email || '') : '';
    $('noAccess').hidden = true; $('dash').hidden = true; $('refresh').hidden = true;
    if (!user) return;
    var ok = false;
    try { var r = await sb.rpc('is_admin'); ok = !r.error && r.data === true; } catch (e) { ok = false; }
    $('noAccess').hidden = ok; $('dash').hidden = !ok; $('refresh').hidden = !ok;
    if (ok) load();
  }
  $('loginForm').addEventListener('submit', async function (ev) {
    ev.preventDefault(); $('loginErr').textContent = '';
    try { var r = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value }); if (r.error) throw r.error; }
    catch (e) { $('loginErr').textContent = t('loginFail', { e: e.message || e }); }
  });
  $('logout').onclick = function () { sb.auth.signOut(); };
  $('refresh').onclick = load;
  $('range').onchange = function () { if (!$('dash').hidden) load(); };
  $('lang').onchange = function () { LANG = this.value; try { localStorage.setItem('dm_lang', LANG); } catch (e) {} applyLang(); if (!$('dash').hidden) renderAll(); };
  var resizeT; window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(function () { if (!$('dash').hidden) renderAll(); }, 300); });

  applyLang();
  if (!sb) { $('loginView').hidden = false; $('loginErr').textContent = 'Supabase is not configured (config.js).'; return; }
  sb.auth.onAuthStateChange(function (_e, session) { user = session ? session.user : null; showState(); });
})();
</script>
</body>
</html>
