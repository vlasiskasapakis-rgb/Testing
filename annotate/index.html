<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="theme-color" content="#186078" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Walking Memory · Annotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  :root {
    /* Χρώματα από το logo Walking Memory */
    --petrol: #186078;       /* κύριο: κείμενο, κουμπιά */
    --petrol-deep: #0E3F50;  /* σκούρες επιφάνειες */
    --sky: #249CCC;          /* γραμμές, περιγράμματα, εστίαση */
    --sky-soft: #E7F4FA;
    --sky-light: #7CCAEB;    /* κείμενο πάνω σε σκούρο */
    --amber: #E0904F;        /* το «μονοπάτι» — έμφαση */
    --amber-text: #9A5413;   /* πορτοκαλί για μικρό κείμενο σε λευκό */
    --ink: #12303B;
    --paper: #FFFFFF;
    --mist: #F2F7F9;
    --line: #D3E3EA;
    --line-strong: #6F8D99;  /* όρια πεδίων (≥3:1) */
    --danger: #B3261E;
    --muted: #4B6470;
    --brand-path: linear-gradient(90deg, #E0904F 0%, #249CCC 55%, #186078 100%);
    /* ψευδώνυμα για inline styles */
    --chalk: var(--amber); --bone: #fff; --sea-dark: var(--petrol); --sea-light: var(--sky-light);
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
    --pad: 16px;
    --handle: calc(56px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: var(--petrol-deep); color: var(--ink);
    font-family: var(--font); font-size: 17px; line-height: 1.5;
  }
  button, input, select { font-family: inherit; }
  button { font-size: inherit; cursor: pointer; border: 0; border-radius: 999px; }
  h1, h2 { font-style: italic; font-weight: 700; color: var(--petrol); letter-spacing: -0.01em; line-height: 1.15; }

  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(255,255,255,.85); }

  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  a-scene, a-scene .a-canvas { position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important; z-index: 0; }
  body.editing a-scene, body.editing a-scene .a-canvas { visibility: hidden !important; }

  /* ---------- Ετικέτες AR ---------- */
  #ar-overlay-container { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .ar-html-marker {
    position: absolute; transform: translate(-50%, -50%);
    background: rgba(255,255,255,.96); color: var(--ink);
    border-left: 4px solid var(--sky); border-radius: 12px;
    padding: 8px 12px; width: 184px; min-height: 44px; text-align: left;
    box-shadow: 0 6px 18px rgba(14,63,80,.35);
    pointer-events: auto;
    transition: left .15s ease-out, top .15s ease-out, transform .2s ease-out, box-shadow .2s ease-out;
  }
  .ar-html-marker.locked { opacity: .85; filter: grayscale(.7); border-left-color: var(--line-strong) !important; }
  .ar-html-marker.closest { z-index: 100 !important; border-left-color: var(--amber); transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 10px 24px rgba(14,63,80,.45); }
  .closest-badge {
    position: absolute; top: -12px; right: -8px; display: none; pointer-events: none;
    background: var(--amber); color: var(--ink); font-size: 12px; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .ar-html-marker.closest .closest-badge { display: block; }
  .ar-html-marker .m-title { display: block; font-size: 15px; font-weight: 700; font-style: italic; color: var(--petrol); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-html-marker .m-sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-html-marker .m-dist { display: block; font-size: 12px; font-weight: 600; color: var(--amber-text); }

  /* ---------- Αρχική οθόνη ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 40; overflow: hidden auto;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    background: var(--paper); color: var(--ink);
  }
  .gate-path { position: absolute; top: 0; right: -18%; width: 78%; height: 100%; opacity: .16; pointer-events: none; z-index: 0; }
  .gate-logo, .gate-body { position: relative; z-index: 1; }
  .gate-logo img { height: 56px; width: auto; display: block; }
  .gate-body { max-width: 34rem; }
  #gate h1 { font-size: 32px; margin: 0 0 14px; }
  #gate p { color: var(--muted); margin: 0; }
  .rule { height: 4px; width: 72px; border-radius: 2px; background: var(--brand-path); margin: 0 0 18px; }
  #startBtn {
    margin-top: 24px; width: 100%; padding: 17px; min-height: 56px;
    background: var(--petrol); color: #fff; font-size: 18px; font-weight: 700; font-style: italic;
    box-shadow: 0 8px 20px rgba(24,96,120,.3);
  }
  #startBtn:disabled { opacity: .7; }
  .gate-lang { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .gate-lang label { font-size: 15px; font-weight: 600; color: var(--petrol); }

  .lang-select {
    font-size: 16px; font-weight: 600; padding: 8px 14px; min-height: 44px;
    border-radius: 999px; border: 2px solid var(--line-strong);
    background: #fff; color: var(--petrol);
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; }
  #hud.on { display: block; }
  #status {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top)); left: var(--pad); right: var(--pad);
    padding: 9px 16px; border-radius: 999px;
    background: rgba(255,255,255,.94); color: var(--petrol); font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #langWrap { position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 54px); right: var(--pad); pointer-events: auto; }
  #langWrap .lang-select { box-shadow: 0 4px 14px rgba(14,63,80,.25); }

  /* ---------- Χάρτης ---------- */
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; height: 52%; z-index: 15; display: flex; flex-direction: column; transform: translateY(calc(100% - var(--handle))); transition: transform .28s cubic-bezier(.32,.72,0,1); }
  #drawer.open { transform: translateY(0); }
  #handle {
    position: relative; flex: none; height: var(--handle); width: 100%;
    display: flex; align-items: center; gap: 12px; padding: 0 20px env(safe-area-inset-bottom);
    background: #fff; color: var(--petrol); border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 18px rgba(14,63,80,.2); pointer-events: auto; touch-action: none;
  }
  #handle::before { content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; border-radius: 0 0 4px 4px; background: var(--brand-path); }
  #handle .grip { width: 34px; height: 4px; border-radius: 2px; background: #9FB6C0; flex: none; }
  #handle .lbl { font-size: 16px; font-weight: 700; font-style: italic; }
  #map { position: relative; flex: 1; background: var(--mist); pointer-events: auto; }
  .leaflet-container { background: var(--mist); font-family: inherit; }
  .map-cluster-dot { background: var(--petrol); color: #fff; border: 3px solid #fff; border-radius: 50%; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  #compass { position: absolute; top: 12px; right: 10px; z-index: 500; width: 54px; height: 54px; border-radius: 50%; background: #fff; color: var(--petrol); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(14,63,80,.3); }
  #compass .needle { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #compass .needle::before { content: ''; position: absolute; left: 50%; top: 6px; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 14px solid var(--amber); }
  #compass .needle::after { content: ''; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 14px solid rgba(24,96,120,.3); }

  #nearest {
    position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--handle) + var(--pad));
    display: none; width: calc(100% - var(--pad) * 2); text-align: left; padding: 14px 18px;
    background: #fff; color: var(--ink); border-radius: 16px; border-left: 6px solid var(--amber);
    box-shadow: 0 8px 22px rgba(14,63,80,.3); pointer-events: auto; transition: bottom .28s;
  }
  #nearest.on { display: block; }
  body.drawer-open #nearest { bottom: calc(52% + var(--pad)); }
  #nearest .dist { display: block; font-size: 14px; font-weight: 600; color: var(--amber-text); }
  #nearest .name { display: block; font-size: 20px; font-weight: 700; font-style: italic; color: var(--petrol); }

  .me-wrap { position: relative; width: 56px; height: 56px; }
  .me-rot { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .me-cone { position: absolute; left: 50%; bottom: 50%; transform: translateX(-50%); border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid rgba(36,156,204,.55); }
  .me-rot.unknown .me-cone { display: none; }
  .me-dot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: var(--sky); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--petrol); }
  .poi-dot { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid var(--petrol); margin: 4px; }

  #addBtn {
    position: fixed; bottom: calc(var(--handle) + var(--pad) + 76px); right: var(--pad); z-index: 25;
    width: 58px; height: 58px; display: none; align-items: center; justify-content: center;
    background: var(--petrol); color: #fff; font-size: 32px; font-weight: 400;
    border: 3px solid #fff; box-shadow: 0 6px 16px rgba(14,63,80,.4); pointer-events: auto;
  }
  #addBtn.on { display: flex; }
  body.drawer-open #addBtn { bottom: calc(52% + var(--pad)); }

  #authBtn {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 54px); left: var(--pad); pointer-events: auto;
    padding: 8px 16px; min-height: 44px; font-size: 15px; font-weight: 700;
    background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #authBtn[hidden] { display: none; }
  .story-media { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 6px; }
  .story-media img, .story-media video { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: #000; }
  .story-media audio { width: 100%; }
  .story-author { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .input-group input[type="email"], .input-group input[type="password"] { width: 100%; padding: 12px 14px; border: 2px solid var(--line-strong); border-radius: 12px; font-size: 16px; color: var(--ink); }
  #authSheet { z-index: 70; }
  .link-btn { background: none; color: var(--petrol); text-decoration: underline; font-weight: 600; padding: 8px 4px; min-height: 44px; border-radius: 8px; }

  .story-know { margin: 8px 0; }
  .story-know h3, .ann-media h3 { margin: 14px 0 6px; font-size: 16px; font-style: italic; color: var(--petrol); }
  .story-know details { margin: 6px 0; } .story-know summary { cursor: pointer; font-weight: 600; color: var(--petrol); min-height: 32px; }
  .story-know pre { white-space: pre-wrap; font-family: inherit; font-size: 15px; background: var(--mist); border-radius: 10px; padding: 10px; }
  .term-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .term-list li { background: var(--sky-soft); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .term-list a { color: var(--petrol); font-weight: 600; }
  .vocab-tag { font-size: 11px; font-weight: 700; color: var(--amber-text); margin-left: 6px; text-transform: uppercase; }
  #sheetTools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; } #sheetTools[hidden] { display: none; }
  #annSheet { z-index: 65; }
  .img-frame { position: relative; line-height: 0; }
  .story-media .img-frame { display: inline-block; max-width: 100%; }
  .story-media .img-frame img { display: block; width: auto; max-width: 100%; max-height: 42vh; height: auto; border-radius: 12px; background: #000; cursor: zoom-in; }
  #imgPopup { z-index: 80; }
  #locMap { height: 260px; border-radius: 10px; margin: 6px 0; }
  .det-box { margin: 8px 0; padding: 8px 10px; background: var(--sky-soft); border-radius: 10px; }
  .tr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0; }
  .tr-row .btn-primary { padding: 10px 20px; min-height: 44px; }
  .ann-why { flex-basis: 100%; font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  .col-head { position: sticky; top: 60px; z-index: 7; background: #fff; padding-top: 2px; }
  .steps-bar { padding: 8px 10px; background: var(--sky-soft); border-radius: 12px; margin-bottom: 6px; }
  .steps-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; }
  .steps-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .steps-meta .lang-select { min-height: 34px; padding: 2px 10px; font-size: 14px; }
  .steps-row button { flex: 1 1 auto; padding: 8px 10px; min-height: 44px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  @media (max-width: 700px) { .steps-row { flex-wrap: wrap; } }
  .steps-bar p { margin: 4px 2px 0; font-size: 13px; color: var(--muted); min-height: 1.3em; flex: 1 1 auto; }
  .order-list { list-style: none; margin: 6px 0; padding: 0; }
  .order-item { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); }
  .order-item span { flex: 1; min-width: 0; }
  .x-btn { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: var(--mist); color: var(--petrol); font-weight: 700; border: 1px solid var(--line-strong); }
  .x-btn:disabled { opacity: .35; }
  .view-switch { display: flex; gap: 4px; background: rgba(255,255,255,.15); border-radius: 999px; padding: 3px; }
  .view-switch[hidden] { display: none; }
  .head-link { color: #fff; font-weight: 700; text-decoration: none; padding: 6px 16px; min-height: 36px; border-radius: 999px; background: rgba(255,255,255,.15); display: inline-flex; align-items: center; }
  .head-link[hidden] { display: none; }
  .head-link:hover { background: rgba(255,255,255,.28); }
  .view-switch button { background: transparent; color: #fff; font-weight: 700; padding: 6px 16px; min-height: 36px; }
  .view-switch button[aria-pressed="true"] { background: #fff; color: var(--petrol); }
  .map-view { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .map-bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 8px; }
  .map-bar .chk { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--petrol); font-size: 14px; }
  .map-bar .chk input[type=checkbox] { width: 20px; height: 20px; }
  .map-bar [hidden] { display: none; }
  .map-bar .lang-select { min-height: 34px; padding: 2px 10px; font-size: 14px; }
  #bigMap { height: calc(100vh - 230px); min-height: 380px; border-radius: 12px; border: 1px solid var(--line-strong); }
  .map-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .map-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .map-count span { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 14px; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
  .map-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 3px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .map-row button { margin: 0; flex: none; }
  .map-num span { width: auto; min-width: 30px; padding: 0 7px; border-radius: 15px; box-sizing: border-box; }
  .map-story-sel { max-width: 340px; }
  .map-order { flex-basis: 100%; margin: 4px 0 0; padding-left: 22px; color: var(--ink, #222); }
  .map-order li { margin: 2px 0; }
  .map-order li.off { color: var(--muted); }
  .map-quote { display: block; font-style: italic; color: var(--muted); margin-top: 2px; }
  .map-pop { max-width: 320px; }
  .map-pop strong { display: block; color: var(--petrol); }
  .map-pop button { margin-top: 6px; padding: 6px 12px; min-height: 34px; background: var(--petrol); color: #fff; font-weight: 700; }
  .ann-step > summary, .fold > summary { list-style: none; }
  .ann-step > summary::-webkit-details-marker, .fold > summary::-webkit-details-marker { display: none; }
  .ann-step > summary::before, .fold > summary::before { content: '▸'; display: inline-block; width: 1.1em; flex: none; color: var(--amber-text); }
  .ann-step[open] > summary::before, .fold[open] > summary::before { content: '▾'; }
  .help-btn { background: #fff; color: var(--petrol); font-weight: 700; padding: 6px 14px; min-height: 36px; }
  .help-btn[hidden] { display: none; }
  .work-empty { text-align: left; }
  .work-empty .we-lead { text-align: center; font-size: 17px; margin: 0 0 14px; }
  .guide { text-align: left; max-width: 640px; margin: 0 auto; background: var(--sky-soft); border-radius: 12px; padding: 12px 18px; color: var(--ink); }
  .guide h3 { margin: 0 0 6px; color: var(--petrol); }
  .guide ol, .guide-list { margin: 0; padding-left: 22px; line-height: 1.5; }
  .guide li, .guide-list li { margin: 4px 0; }
  .lang-lbl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .ann-add > .link-btn { font-size: 13px; opacity: .85; }
  .note-step.done { color: var(--petrol); font-weight: 700; }
  .note-step.done::before { content: '✓ '; color: #2E7D32; }
  .note-missing { font-size: 13px; color: var(--amber-text); margin: 4px 0 0; }
  .note-form .step-btn { padding: 8px 18px; min-height: 40px; font-weight: 700; }
  .img-thumb { cursor: zoom-in; }
  .export-all { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .export-all button { width: 100%; padding: 8px 12px; min-height: 40px; font-weight: 700; font-size: 14px; }
  .rec-wrap > summary { font-size: 16px; }
  .rec-wrap > .ann-media { border-top: 0; padding-top: 0; margin-top: 0; }
  .rec-info { padding: 8px 10px; background: var(--mist); border-radius: 10px; margin: 6px 0 8px; }
  .table-wrap { overflow-x: auto; margin: 6px 0; border: 1px solid var(--line); border-radius: 10px; }
  .note-table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: auto; min-width: 460px; }
  .note-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: var(--mist); padding: 6px 8px; position: sticky; top: 0; }
  .note-table td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  .note-table tr.grp-first td { border-top: 2px solid var(--line-strong); }
  .note-table tr.grp-first:first-child td { border-top: 0; }
  .note-table .c-line { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .note-table .c-time button, .note-table .c-area button { white-space: nowrap; padding: 2px 4px; min-height: 32px; }
  .note-table .c-term { min-width: 120px; }
  .note-table .cnt { color: var(--muted); font-size: 12px; }
  .note-table .c-del { width: 40px; text-align: right; }
  .note-table .x-btn { width: 32px; height: 32px; padding: 0; border-radius: 50%; background: var(--mist); color: var(--danger); font-weight: 700; }
  .note-table .x-btn:hover { background: var(--danger); color: #fff; }
  .sr-only-th { width: 40px; }
  .det-box h4 { margin: 0 0 4px; font-size: 14px; color: var(--petrol); }
  .ann-media > .media-cap { margin: 0 0 8px; }
  #sheetSub { display: none; }
  .story-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; margin: 2px 0 4px; }
  .story-head > * { margin: 0 !important; font-size: 14px; }
  .tabbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 0 8px; border-bottom: 2px solid var(--line); margin-bottom: 10px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { padding: 10px 18px; min-height: 44px; font-weight: 700; background: var(--mist); color: var(--petrol); border: 2px solid transparent; border-radius: 12px; }

<style>
  /* ---------- Διάταξη ιστοσελίδας ---------- */
  html, body { height: auto; overflow: visible; background: var(--mist); }
  #annotateBtn, #deleteBtn { display: none !important; }
  #siteDeleteBtn { margin-left: auto; }
  #delSheet .del-list { margin: 8px 0 12px; padding-left: 22px; }
  #delSheet .del-ok { display: flex; gap: 10px; align-items: center; font-weight: 600; margin: 10px 0 14px; }
  #delSheet .del-ok input { width: 22px; height: 22px; }
  #delSheet .del-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  #delSheet .del-btns button { padding: 12px 22px; min-height: 48px; font-weight: 700; }
  #delSheet .btn-danger:not(:disabled) { background: var(--danger); color: #fff; }
  .site-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: var(--petrol); color: #fff; }
  .site-head h1 { color: #fff; font-size: 22px; margin: 0; flex: 1 1 auto; }
  .site-head .lang-select { min-height: 40px; }
  #userBox { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  #userBox[hidden] { display: none; }
  #logoutBtn { background: #fff; color: var(--petrol); font-weight: 700; padding: 8px 16px; min-height: 40px; }
  .site-main { max-width: 1500px; margin: 0 auto; padding: 18px 20px 60px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px; max-width: 460px; margin: 40px auto; }
  .card h2 { margin: 0 0 6px; }
  [hidden] { display: none !important; }
  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  .side { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .side h2 { font-size: 20px; margin: 0 0 10px; }
  .list-item.current { outline: 3px solid var(--amber); }
  .work { min-width: 0; }
  .work-empty { background: #fff; border: 1px dashed var(--line-strong); border-radius: 16px; padding: 40px; text-align: center; color: var(--muted); }
  #storyView { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  #storyView h2 { font-size: 26px; margin: 0 0 4px; }
  #sheetTools { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 14px; }
  #sheetTools[hidden] { display: none; }
  #sheetTools button { padding: 10px 18px; min-height: 44px; font-weight: 700; }
  .cols { display: grid; grid-template-columns: minmax(300px, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
  .col-media { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; }
  .col-ann h2 { font-size: 20px; margin: 0 0 6px; }
  .ann-media { border-top: 2px solid var(--line); padding-top: 8px; margin-top: 10px; }
  .ann-media:first-child { border-top: 0; margin-top: 0; }
  .story-media { margin: 0 0 10px; }
  .story-media audio, .story-media video { width: 100%; }
  .story-know { margin-top: 16px; }
  #imgPopup { z-index: 80; }
  @media (max-width: 1000px) {
    .layout, .cols { grid-template-columns: minmax(0, 1fr); }
    .side, .col-media { position: static; max-height: none; }
    .side { max-height: 280px; }
  }
</style>

<body>
<div id="srLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<header class="site-head">
  <h1 data-i18n="siteTitle"></h1>
  <label for="langSel" class="sr-only" data-i18n="language"></label>
  <select id="langSel" class="lang-select">
    <option value="el" lang="el">EL</option><option value="en" lang="en">EN</option><option value="fr" lang="fr">FR</option><option value="it" lang="it">IT</option>
  </select>
  <button type="button" id="helpBtn" class="help-btn" hidden data-i18n="helpBtn"></button>
  <nav id="viewSwitch" class="view-switch" hidden aria-label="View">
    <button type="button" id="viewStories" aria-pressed="true" data-i18n="viewStories"></button>
    <button type="button" id="viewMap" aria-pressed="false" data-i18n="viewMap"></button>
  </nav>
  <a id="linksPage" class="head-link" href="../connect/" hidden data-i18n="navLinks"></a>
  <div id="userBox" hidden><span id="userName"></span><button id="logoutBtn" type="button" data-i18n="logout"></button></div>
</header>

<main class="site-main">
  <section id="loginView" class="card" aria-labelledby="loginTitle">
    <h2 id="loginTitle" data-i18n="siteLoginTitle"></h2>
    <p class="sheet-sub" data-i18n="siteLoginHint"></p>
    <form id="loginForm" novalidate>
      <div class="input-group"><label for="authEmail" data-i18n="email"></label><input type="email" id="authEmail" autocomplete="email" required></div>
      <div class="input-group"><label for="authPass" data-i18n="password"></label><input type="password" id="authPass" autocomplete="current-password" minlength="6" required></div>
      <p id="authError" class="field-error" role="alert"></p>
      <button type="submit" class="btn-primary btn-wide" id="authSubmitBtn"></button>
    </form>
  </section>

  <section id="noAccess" class="card" hidden>
    <p data-i18n="siteNoAccess"></p>
    <button id="logoutBtn2" type="button" class="btn-secondary btn-wide" data-i18n="logout"></button>
  </section>

  <section id="mapView" class="map-view" hidden aria-label="Map">
    <div class="map-bar">
      <label class="chk"><span data-i18n="mapStoryLbl"></span>
        <select id="mapStory" class="lang-select map-story-sel"><option value=""></option></select></label>
      <label class="chk map-all-only"><input type="checkbox" id="mapFiles" checked><span data-i18n="mapLinkFiles"></span></label>
      <label class="chk map-all-only"><input type="checkbox" id="mapUsers"><span data-i18n="mapLinkUsers"></span></label>
      <label class="chk map-all-only"><input type="checkbox" id="mapTerms"><span data-i18n="mapLinkTerms"></span></label>
      <label class="chk" id="mapMinWrap" hidden><span data-i18n="mapMinShared"></span>
        <select id="mapMin" class="lang-select"><option>1</option><option>2</option><option>3</option><option>5</option></select></label>
      <label class="chk"><span data-i18n="mapStatus"></span>
        <select id="mapStatusSel" class="lang-select"><option value="all"></option><option value="draft"></option><option value="published"></option></select></label>
      <span id="mapInfo" class="sheet-sub" role="status"></span>
    </div>
    <div id="bigMap" role="application" aria-label="Map"></div>
    <div id="mapLegend" class="map-legend"></div>
  </section>

  <div id="appView" class="layout" hidden>
    <aside class="side" aria-labelledby="sideTitle">
      <h2 id="sideTitle" data-i18n="siteStories"></h2>
      <div class="input-group"><label for="listSearch" data-i18n="listSearch"></label><input type="text" id="listSearch" autocomplete="off"></div>
      <div class="input-group"><label for="listFilter" data-i18n="listFilter"></label><select id="listFilter" class="lang-select"></select></div>
      <div id="listBody"></div>
      <div class="export-all"><button type="button" id="exportAllBtn" class="btn-secondary" data-i18n="exportAllRdf"></button><p id="exportAllStatus" class="sheet-sub" role="status"></p></div>
    </aside>
    <section class="work" aria-live="polite">
      <div id="workEmpty" class="work-empty">
        <p class="we-lead" data-i18n="siteSelect"></p>
        <div class="guide"><h3 data-i18n="guideTitle"></h3><ol>
          <li data-i18n="guide1"></li><li data-i18n="guide2"></li><li data-i18n="guide3"></li><li data-i18n="guide4"></li><li data-i18n="guide5"></li><li data-i18n="guide6"></li>
        </ol></div>
      </div>
      <div id="storyView" hidden>
        <h2 id="sheetTitle"></h2>
        <p id="sheetSub" class="sheet-sub" hidden></p>
        <div class="story-head">
          <span id="sheetAuthor" class="story-author"></span>
          <span id="sheetStatus" class="story-status"></span>
          <span id="sheetConsent" class="story-status" hidden></span>
        </div>
        <div id="sheetTools" hidden>
          <button id="publishBtn" class="btn-primary" hidden></button>
          <button id="exportBtn" class="btn-secondary" hidden data-i18n="annExport"></button>
          <button id="exportRdfBtn" class="btn-secondary" hidden data-i18n="exportRdf"></button>
          <button id="annotateBtn" hidden></button>
          <button id="deleteBtn" hidden></button>
          <button id="siteDeleteBtn" type="button" class="btn-danger" hidden data-i18n="delStoryBtn"></button>
        </div>
        <div class="cols">
          <div class="col-media">
            <div id="sheetMedia" class="story-media"></div>
            <div id="sheetImages" class="story-media"></div>
            <details id="orderFold" class="fold" hidden><summary data-i18n="orderTitle"></summary><ol id="orderList" class="order-list"></ol><p id="orderErr" class="field-error" role="alert"></p></details>
            <details id="locFold" class="fold" hidden open><summary data-i18n="locMapTitle"></summary><div id="locMap"></div></details>
          </div>
          <div class="col-ann">
            <div class="col-head">
              <div class="steps-bar">
                <div class="steps-row">
                  <button type="button" class="btn-primary" id="stepTranscribe" data-i18n="trBtn"></button>
                  <button type="button" class="btn-secondary" id="stepSave" data-i18n="trSave"></button>
                  <button type="button" class="btn-primary" id="suggestAllBtn" data-i18n="sugAll"></button>
                </div>
                <div class="steps-meta">
                  <p id="suggestStatus" role="status"></p>
                  <label class="lang-lbl"><span data-i18n="trLangLbl"></span><select id="trLang" class="lang-select" data-i18n-aria="annLangLabel"><option value="el">EL</option><option value="en">EN</option><option value="fr">FR</option><option value="it">IT</option></select></label>
                </div>
              </div>
              <div class="tabbar">
              <div role="tablist" class="tabs">
                <button type="button" role="tab" id="tabRec" aria-selected="true" aria-controls="panelRec"></button>
                <button type="button" role="tab" id="tabImg" aria-selected="false" aria-controls="panelImg" tabindex="-1"></button>
              </div>
              <label class="follow"><input type="checkbox" id="followCb" checked><span data-i18n="followPb"></span></label>
            </div>
            </div>
            <div id="panelRec" role="tabpanel" aria-labelledby="tabRec"></div>
            <div id="panelImg" role="tabpanel" aria-labelledby="tabImg" hidden></div>
          </div>
        </div>
        <div id="sheetKnow" class="story-know"></div>
      </div>
    </section>
  </div>
</main>

<div id="helpSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="sheet-inner">
    <h2 id="helpTitle" data-i18n="guideTitle"></h2>
    <ol class="guide-list"><li data-i18n="guide1"></li><li data-i18n="guide2"></li><li data-i18n="guide3"></li><li data-i18n="guide4"></li><li data-i18n="guide5"></li><li data-i18n="guide6"></li></ol>
    <button id="helpClose" class="btn-primary" style="margin-top:14px" data-i18n="close"></button>
  </div>
</div>

<div id="delSheet" class="edit-sheet" role="alertdialog" aria-modal="true" aria-labelledby="delTitle" aria-describedby="delText">
  <div class="sheet-inner">
    <h2 id="delTitle"></h2>
    <p id="delText"></p>
    <ul id="delList" class="del-list"></ul>
    <label class="del-ok"><input type="checkbox" id="delOk"><span data-i18n="delUnderstand"></span></label>
    <p id="delErr" class="field-error" role="alert"></p>

      <button type="button" id="delCancel" class="btn-secondary" data-i18n="cancel"></button>
    </div>
  </div>
</div>
<div id="geoSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="geoTitle">
  <div class="sheet-inner">
    <h2 id="geoTitle"></h2>
    <p id="geoSub" class="sheet-sub"></p>
    <p class="sheet-sub" data-i18n="geoHelp"></p>
    <div id="geoMap" role="application" aria-label="Map"></div>
    <div class="geo-tools">
      <span id="geoVal" class="geo-val" role="status"></span>
      <button type="button" id="geoTermBtn" class="btn-secondary" data-i18n="geoUseTerm" hidden></button>
      <button type="button" id="geoFileBtn" class="btn-secondary" data-i18n="geoUseFile" hidden></button>
      <button type="button" id="geoSave" class="btn-primary" data-i18n="geoSave"></button>
      <button type="button" id="geoClear" class="btn-secondary" data-i18n="geoClear" hidden></button>
      <button type="button" id="geoCancel" class="btn-secondary" data-i18n="cancel"></button>
    </div>
  </div>
</div>
<div id="imgPopup" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="imgPopupTitle">
  <div class="sheet-inner">
    <h2 id="imgPopupTitle"></h2>
    <p id="imgPopupHint" class="sheet-sub" hidden></p>
    <div class="popup-stage"><div class="popup-frame"><img id="imgPopupImg" alt=""><div id="imgPopupLayer" class="region-layer"></div></div></div>
    <button id="imgPopupClose" class="btn-primary" style="margin-top:14px" data-i18n="close"></button>
  </div>
</div>

  function detectLang() {
    try {
      var saved = localStorage.getItem('dm_lang');
      if (saved && LANGS.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var prefs = navigator.languages || [navigator.language || 'el'];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).slice(0, 2).toLowerCase();
      if (LANGS.indexOf(code) !== -1) return code;
    }
    return 'el';
  }

  var LANG = detectLang();

  function t(key, vars) {
    var s = (I18N[LANG] && I18N[LANG][key]) || I18N.el[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

    root = root || document;
    root.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    root.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.dataset.i18nPh); });
    root.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  }

  function setLang(code) {
    if (LANGS.indexOf(code) === -1) return;
    LANG = code;
    try { localStorage.setItem('dm_lang', code); } catch (e) {}
    document.documentElement.lang = code;       // WCAG 3.1.1
    document.title = t('siteTitle');            // WCAG 2.4.2
    $('langSel').value = code;
    applyLang();
    langListeners.forEach(function (fn) { try { fn(); } catch (e) {} });
  }

  $('langSel').addEventListener('change', function () { setLang(this.value); });

  // 0b. ΔΙΑΛΟΓΟΙ (εστίαση, Tab, Escape)
  // ==========================================
  var dialogStack = [];
  var FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function focusablesIn(el) {
    return Array.prototype.filter.call(el.querySelectorAll(FOCUSABLE), function (n) {
      return !n.hidden && n.getClientRects().length > 0;
    });
  }

  function openDialog(id, focusEl) {
    var el = $(id);
    if (!el.classList.contains('on')) {
      el.classList.add('on');
      dialogStack.push({ id: id, ret: document.activeElement });
    }
    setTimeout(function () {
      var target = focusEl || el.querySelector('[data-autofocus]') || focusablesIn(el)[0] || el;
      if (target === el && !el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
      try { target.focus(); } catch (e) {}
    }, 40);
  }

  function closeDialog(id, noRestore) {
    var el = $(id);
    el.classList.remove('on');
    for (var i = dialogStack.length - 1; i >= 0; i--) {
      if (dialogStack[i].id === id) {
        var entry = dialogStack.splice(i, 1)[0];
        if (!noRestore && entry.ret && document.contains(entry.ret) && entry.ret.getClientRects().length) {
          try { entry.ret.focus(); } catch (e) {}
        }
        break;
      }
    }
  }

  var escHandlers = {};

  document.addEventListener('keydown', function (e) {
    var top = dialogStack.length ? $(dialogStack[dialogStack.length - 1].id) : null;
    if (!top) return;

    if (e.key === 'Escape' && escHandlers[top.id]) {
      e.preventDefault();
      escHandlers[top.id]();
      return;
    }

    if (e.key === 'Tab') {
      var items = focusablesIn(top);
      if (!items.length) { e.preventDefault(); return; }
      var first = items[0], last = items[items.length - 1];
      if (!top.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  async function fetchKnowledge(s, all) {
    var ids = s.media.map(function (m) { return m.id; }).filter(Boolean);
    function annQuery() {
      var q = sb.from('annotations').select(ANN_COLS).in('media_id', ids).order('start_s');

    }
    var aq = annQuery();

      sb.from('media_transcripts').select('id,media_id,language,text,status,error,transcript_segments(idx,start_s,end_s,text,words)').in('media_id', ids),
      sb.from('media_links').select('id,story_id,image_media_id,av_media_id,start_s,end_s').eq('story_id', s.dbId).order('start_s'),
      sb.from('transcript_comments').select('id,media_id,segment_idx,start_s,end_s,body,author_name,updated_at').in('media_id', ids).order('start_s')
    ]);
    if (res[1].error && /words/i.test(res[1].error.message || '')) {   // βάση χωρίς στήλη words
      res[1] = await sb.from('media_transcripts').select('id,media_id,language,text,status,error,transcript_segments(idx,start_s,end_s,text)').in('media_id', ids);
    }
    if (isGeoColErr(res[0].error)) {                                         // βάση χωρίς τοποθεσίες όρων (roles.sql)

    }

  // ---- Στατιστικά διορθώσεων απομαγνητοφώνησης: πόσες λέξεις/γραμμές άλλαξε ο σχολιαστής σε σχέση με την προηγούμενη μορφή ----

    var h = document.createElement('strong'); h.textContent = st(x).title; d.appendChild(h);
    items.forEach(function (i) {
      var row = document.createElement('div'); row.className = 'map-row';
      var tx = document.createElement('span');
      if (i.a) {                       // όρος γραμμής απομαγνητοφώνησης με τοποθεσία
        tx.textContent = i.n + '. ' + stopText(x, data, i); row.appendChild(tx);
        var g0 = segIdxOf(data, i.av.id, i.a.segment_idx), q0 = document.createElement('span'); q0.className = 'map-quote';
        var t0 = g0 && g0.text ? g0.text.trim() : '';
        q0.textContent = (i.a.mention ? '“' + i.a.mention + '”' : '') + (t0 ? (i.a.mention ? ' — ' : '') + '“' + (t0.length > 110 ? t0.slice(0, 110) + '…' : t0) + '”' : '');
        if (q0.textContent) row.appendChild(q0);
        d.appendChild(row); return;
      }
      tx.textContent = (i.n ? i.n + '. ' : '') + (KIND_ICON[i.m.kind] || '') + ' ' + mediaName(x, i.m) + [i.m.about, i.m.recorded, i.m.period].filter(Boolean).map(function (v) { return ' · ' + v; }).join('');
      row.appendChild(tx);
      if (!i.n) { var nl = document.createElement('span'); nl.className = 'map-quote'; nl.textContent = t('mapNotLinked'); row.appendChild(nl); }
      (ord.moments[i.m.id] || []).slice(0, 4).forEach(function (mo) {
        var q = document.createElement('span'); q.className = 'map-quote';
        var seg = segmentAt(data, mo.av.id, mo.t), txt = seg && seg.text ? seg.text.trim() : '';
        q.textContent = t('mapAtTime', { r: mediaName(x, mo.av), t: mmss(mo.t) }) + (txt ? ' — “' + (txt.length > 110 ? txt.slice(0, 110) + '…' : txt) + '”' : '');
        row.appendChild(q);
      });
      d.appendChild(row);
    });
    var b = document.createElement('button'); b.type = 'button'; b.textContent = t('mapOpenStory');
    b.onclick = function () { if (x !== currentSheetStory && !okToLeave()) return; setView('stories'); openStory(x); };
    d.appendChild(b);
    return d;
  }
  // Αναδυόμενο παράθυρο τοποθεσίας: όλα τα αρχεία (και οι ιστορίες) σε αυτό το σημείο
  function popupForGroup(g, files) {
    var d = document.createElement('div'); d.className = 'map-pop';
    var h = document.createElement('strong'); h.textContent = files.length ? t('mapHere', { n: files.length }) : t('mapStoryPoint'); d.appendChild(h);
    var items = files.length ? files : g.items;
    items.slice(0, 12).forEach(function (i) {
      var row = document.createElement('div'); row.className = 'map-row';
      var bits = [st_(i.x) + (i.x.author ? ' — ' + i.x.author : '')];
      if (i.m) { bits.push((KIND_ICON[i.m.kind] || '') + ' ' + mediaName(i.x, i.m)); if (i.m.about) bits.push(i.m.about); if (i.m.recorded) bits.push(i.m.recorded); if (i.m.period) bits.push(i.m.period); }
      var tx = document.createElement('span'); tx.textContent = bits.join(' · '); row.appendChild(tx);
      var b = document.createElement('button'); b.type = 'button'; b.textContent = t('mapOpenStory'); b.onclick = function () { if (i.x !== currentSheetStory && !okToLeave()) return; setView('stories'); openStory(i.x); };
      row.appendChild(b);
      if ($('mapStory').value !== i.x.dbId) {
        var b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'map-only'; b2.textContent = t('mapOnlyThis'); b2.style.marginLeft = '6px';
        b2.onclick = function () { if (bigMap.closePopup) bigMap.closePopup(); $('mapStory').value = i.x.dbId; renderBigMap(); };
        row.appendChild(b2);
      }
      d.appendChild(row);
    });
    if (items.length > 12) { var more = document.createElement('div'); more.textContent = t('mapMore', { n: items.length - 12 }); d.appendChild(more); }
    return d;
  }
  function st_(x) { return x.t && x.t.el ? x.t.el.title : ''; }
  ['mapStory', 'mapFiles', 'mapUsers', 'mapTerms', 'mapMin', 'mapStatusSel'].forEach(function (id) { $(id).addEventListener('change', function () { if (currentView === 'map') renderBigMap(); }); });

  $('helpBtn').onclick = function () { openDialog('helpSheet', $('helpClose')); };
  $('helpClose').onclick = function () { closeDialog('helpSheet'); };
  escHandlers.helpSheet = function () { closeDialog('helpSheet'); };

  // ---- Προστασία από απώλεια: απομαγνητοφώνηση που δεν αποθηκεύτηκε ----
  function hasUnsaved() { return annSections.some(function (x) { return x.isUnsaved && x.isUnsaved(); }); }
  function okToLeave() { return !hasUnsaved() || window.confirm(t('unsavedLeave')); }
  window.addEventListener('beforeunload', function (e) { if (hasUnsaved()) { e.preventDefault(); e.returnValue = ''; } });

  function showView() {
    var annot = isAnnotator();
    $('loginView').hidden = !!currentUser;
    $('noAccess').hidden = !(currentUser && !annot);
    $('appView').hidden = !annot || currentView !== 'stories';
    $('mapView').hidden = !annot || currentView !== 'map';
    $('viewSwitch').hidden = !annot; $('linksPage').hidden = !annot;
    $('helpBtn').hidden = !annot;
    $('userBox').hidden = !currentUser;
    $('userName').textContent = currentUser ? userName(currentUser) : '';
  }
  $('loginForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!sb) return;
    var email = $('authEmail').value.trim(), pass = $('authPass').value;
    $('authError').textContent = '';
    if (!email || pass.length < 6) { $('authError').textContent = t('authNeedFields'); return; }
    $('authSubmitBtn').disabled = true;
    try {
      var r = await sb.auth.signInWithPassword({ email: email, password: pass });
      if (r.error) throw r.error;
    } catch (e) { $('authError').textContent = t('authFailed', { e: e.message || e }); }
    finally { $('authSubmitBtn').disabled = false; }
  });
  $('logoutBtn').onclick = $('logoutBtn2').onclick = function () { if (!okToLeave()) return; if (sb) sb.auth.signOut(); };

  if (sb) {
    sb.auth.onAuthStateChange(function (_event, session) {
      currentUser = session ? session.user : null;
      showView();
      loadRole().then(function () {
        showView();
        if (isAnnotator()) loadStories(); else { STORIES = []; closeStory(); }
      });
    });
  } else { $('authError').textContent = 'Supabase is not configured (config.js).'; }
  onLangChange(function () {
    showView(); if (isAnnotator()) renderList(); if (currentView === 'map') renderBigMap(); $('authSubmitBtn').textContent = t('login');
    $('suggestAllBtn').title = t('sugHint');
    var n = $('panelImg').children.length; $('tabRec').textContent = t('tabRec'); $('tabImg').textContent = t('tabImg') + ' (' + n + ')';
  });

  setLang(LANG);
  showView();
  $('authSubmitBtn').textContent = t('login');
})();
</script>
</body>
</html>
