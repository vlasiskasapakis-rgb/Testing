    } else {
      var count = processedFiles.filter(function (x) { return x.kind === kind; }).length + 1;
      item = { originalFile: currentFile, name: currentFile.name, num: count, kind: kind, meta: meta, blob: null, outType: null };
      processedFiles.push(item);
      idx = processedFiles.length - 1;
    }

    updateMediaListUI();
    announce(t('kept', { name: nameOf(item) }));
    leaveEditor(document.querySelector('#mediaList [data-act="edit"][data-i="' + idx + '"]'));
  };

  function describeChanges(f) {
    if (f.kind === 'image') {
      var n = (f.meta.strokes || []).length;
      return n === 0 ? t('noChanges') : (n === 1 ? t('blur1') : t('blurN', { n: n }));
    }
    var r = (f.meta.ranges || []).length;
    return r === 0 ? t('noChanges') : (r === 1 ? t('pts1') : t('ptsN', { n: r }));
  }

  function countEdits(f) {
    return f.kind === 'image' ? (f.meta.strokes || []).length : (f.meta.ranges || []).length;
  }

  function escHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  function updateMediaListUI() {
    var list = $('mediaList');
    if (!processedFiles.length) {
      list.innerHTML = '<li class="empty-note">' + escHTML(t('noFiles')) + '</li>';
      return;
    }
    var html = '';
    processedFiles.forEach(function (f, i) {
      var nm = nameOf(f);
      html += '<li class="media-list-item">' +
                '<div class="mi-text">' +
                  '<span class="mi-name" title="' + escHTML(f.name) + '">' + escHTML(nm) + ' <small>(' + Math.round(f.originalFile.size / 1024) + ' KB)</small></span>' +
                  '<span class="mi-changes">' + escHTML(describeChanges(f)) + ' · ' + escHTML(f.blob ? t('saved') : t('pending')) + '</span>' +
                '</div>' +
                '<div style="flex-shrink:0;">' +
                  '<button type="button" class="icon-btn edit" data-act="edit" data-i="' + i + '" aria-label="' + escHTML(t('editItem', { name: nm })) + '"><span aria-hidden="true">✏️</span></button>' +
                  '<button type="button" class="icon-btn del" data-act="del" data-i="' + i + '" aria-label="' + escHTML(t('deleteItem', { name: nm })) + '"><span aria-hidden="true">✕</span></button>' +
                '</div>' +
              '</li>';
    });
    list.innerHTML = html;
  }
  onLangChange(updateMediaListUI);

  $('mediaList').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var i = parseInt(b.dataset.i, 10), f = processedFiles[i];
    if (!f) return;
    if (b.dataset.act === 'edit') {
      window.currentEditIndex = i;
      loadFileIntoEditor(f.originalFile, f.meta);
    } else {
      var nm = nameOf(f);
      processedFiles.splice(i, 1);
      updateMediaListUI();
      announce(t('removed', { name: nm }));
      var next = document.querySelector('#mediaList [data-act="edit"][data-i="' + Math.min(i, processedFiles.length - 1) + '"]');
      (next || $('triggerFileBtn')).focus();
    }
  });

  // --- Ολοκλήρωση ιστορίας (WCAG 3.3.1: ενσωματωμένα μηνύματα λάθους) ---
  function renderConfirmSummary() {
    var pending = processedFiles.filter(function (f) { return !f.blob; }).length;
    var withEdits = processedFiles.filter(function (f) { return countEdits(f) > 0; }).length;
    $('confirmSummary').textContent = t('confirmSummary', { n: processedFiles.length, e: withEdits, p: pending });
  }
  onLangChange(renderConfirmSummary);

  $('finishStoryBtn').onclick = function () {
    clearErrors();
    if (!$('storyTitle').value.trim()) {
      $('titleError').textContent = t('titleRequired');
      $('storyTitle').setAttribute('aria-invalid', 'true');
      $('storyTitle').focus();
      return;
    }
    if (!processedFiles.length) {
      $('mediaError').textContent = t('fileRequired');
      $('triggerFileBtn').focus();
      return;
    }
    renderConfirmSummary();
    closeDialog('uploadSheet', true);
    openDialog('confirmModal');
  };

  $('confirmBackBtn').onclick = function () {
    closeDialog('confirmModal', true);
    openDialog('uploadSheet', $('finishStoryBtn'));
  };
  escHandlers.confirmModal = function () { $('confirmBackBtn').click(); };

  var procAudio = null;
  function getProcAudio() {
    if (procAudio) return procAudio;
    var actx = new (window.AudioContext || window.webkitAudioContext)();
    var src = actx.createMediaElementSource($('procVideo'));
    var gain = actx.createGain();
    src.connect(gain);
    gain.connect(actx.destination);
    procAudio = { ctx: actx, src: src, gain: gain };
    return procAudio;
  }

  $('confirmApplyBtn').onclick = function () {
    closeDialog('confirmModal', true);

    // Ξεκλείδωμα ήχου/βίντεο μέσα στο πάτημα (iOS)
    var firstVid = processedFiles.find(function (f) { return !f.blob && f.kind === 'video' && (f.meta.ranges || []).length; });
    if (firstVid) {
      try {
        var pa = getProcAudio();
        if (pa.ctx.state === 'suspended') pa.ctx.resume();
        var pv = $('procVideo');
        var unlockUrl = URL.createObjectURL(firstVid.originalFile);
        pv.src = unlockUrl;
        var p = pv.play();
        if (p && p.then) p.then(function () { pv.pause(); }).catch(function () {});
        setTimeout(function () { URL.revokeObjectURL(unlockUrl); }, 5000);
      } catch (e) {}
    }
    applyAllEdits();
  };

  async function applyAllEdits() {
    var todo = processedFiles.filter(function (f) { return !f.blob; });
    var total = todo.length;
    lastPctAnnounce = -1;

    try {
      for (var k = 0; k < todo.length; k++) {
        var f = todo[k];
        var head = t('fileOf', { i: k + 1, n: total, name: nameOf(f) });
        var base = (k / total) * 100, span = 100 / total;
        showProgress(true, head, base, t('savingChanges'));
        announce(head);

        if (f.kind === 'image') {
          f.blob = await renderImageFinal(f.originalFile, f.meta.strokes);
          f.outType = 'image/jpeg';
        } else if (f.kind === 'video') {
          var vr = f.meta.ranges || [];
          if (vr.length) {
            f.blob = await processVideoFile(f.originalFile, vr, function (pct, txt) {
              showProgress(true, head + ' · ' + txt, base + span * pct / 100);
            });
            f.outType = f.blob.type || 'video/webm';
          } else {
            f.blob = f.originalFile; f.outType = f.originalFile.type;
          }
        } else {
          var ar = f.meta.ranges || [];
          if (ar.length) {
            f.blob = await processAudioLocal(f.originalFile, ar);
            f.outType = 'audio/wav';
          } else {
            f.blob = f.originalFile; f.outType = f.originalFile.type || 'audio/mp4';
          }
        }
        showProgress(true, head, base + span);
      }
    } catch (e) {
      showProgress(false);
      updateMediaListUI();
      alert(t('saveError', { e: (e && e.message ? e.message : e) }));
      openDialog('uploadSheet', $('finishStoryBtn'));
      return;
    }

    showProgress(false);
    updateMediaListUI();
    announce(t('allSaved'));
    showLocalPreview();
  }

  function showLocalPreview() {
    var container = $('localPreviewContainer');
    clearPreview();

    processedFiles.forEach(function (f, i) {
      var box = document.createElement('section');
      box.style.cssText = 'background:#F2F7F9; border:1px solid #D3E3EA; padding:12px; border-radius:14px; color:#12303B;';
      var h = document.createElement('h3');
      h.className = 'pv-name';
      h.dataset.i = i;
      h.style.cssText = 'margin:0 0 8px; font-size:16px; font-style:italic; color:#186078;';
      h.textContent = nameOf(f);
      box.appendChild(h);

      var url = URL.createObjectURL(f.blob);
      previewURLs.push(url);
      var el;
      if (f.kind === 'image') {
        el = document.createElement('img');
        el.alt = nameOf(f);
        el.style.cssText = 'width:100%; max-height:180px; object-fit:contain; border-radius:10px; background:#fff;';
      } else if (f.kind === 'video') {
        el = document.createElement('video');
        el.controls = true; el.playsInline = true; el.preload = 'metadata';
        el.setAttribute('aria-label', nameOf(f));
        el.style.cssText = 'width:100%; max-height:220px; border-radius:10px; background:#000;';
      } else {
        el = document.createElement('audio');
        el.controls = true; el.preload = 'metadata';
        el.setAttribute('aria-label', nameOf(f));
        el.style.width = '100%';
      }
      el.src = url;
      box.appendChild(el);
      container.appendChild(box);
    });

    container.querySelectorAll('video, audio').forEach(fixDuration);
    setAR(false);
    openDialog('previewSheet', $('previewTitle'));
    $('previewTitle').setAttribute('tabindex', '-1');
  }

  onLangChange(function () {
    document.querySelectorAll('#localPreviewContainer .pv-name').forEach(function (h) {
      var f = processedFiles[+h.dataset.i];
      if (f) h.textContent = nameOf(f);
    });
  });

  function fixDuration(v) {
    v.addEventListener('loadedmetadata', function () {
      if (!isFinite(v.duration)) waitForFiniteDuration(v);
    }, { once: true });
  }

  function clearPreview() {
    var c = $('localPreviewContainer');
    c.querySelectorAll('video, audio').forEach(function (m) { m.pause(); m.removeAttribute('src'); m.load(); });
    c.innerHTML = '';
    previewURLs.forEach(function (u) { URL.revokeObjectURL(u); });
    previewURLs = [];
  }

  $('backToUploadBtn').onclick = function () {
    clearPreview();
    closeDialog('previewSheet', true);
    openDialog('uploadSheet', $('finishStoryBtn'));
  };
  escHandlers.previewSheet = function () { $('backToUploadBtn').click(); };

  function finishStoryFlow() {
    clearPreview();
    $('publishError').textContent = '';
    $('storyTitle').value = '';
    processedFiles = [];
    updateMediaListUI();
    closeDialog('previewSheet', true);
    setAR(true);
    if ($('addBtn').classList.contains('on')) $('addBtn').focus();
  }

  $('closePreviewBtn').onclick = async function () {
    var btn = this;
    $('publishError').textContent = '';
    if (!currentUser) { $('publishError').textContent = t('loginToAdd'); return; }
    if (!me) return;
    btn.disabled = true;
    try {
      var story = await WM.publish($('storyTitle').value.trim(), me, processedFiles, function (i, n) {
        btn.textContent = t('publishing', { i: i, n: n });
      });
      addStoryRuntime(story);
      announce(t('published'));
      alert(t('uploadDone'));
      finishStoryFlow();
    } catch (e) {
      $('publishError').textContent = t('publishError', { e: (e && e.message) ? e.message : e });
    } finally {
      btn.disabled = false;
      btn.textContent = t('publish');
    }
  };

  // --- Τελική επεξεργασία βίντεο ---
  function loadProcVideo(video, url) {
    return new Promise(function (resolve, reject) {
      var tmo = setTimeout(function () { reject(new Error(t('errVideoTimeout'))); }, 15000);
      video.onloadedmetadata = function () { clearTimeout(tmo); video.onloadedmetadata = null; video.onerror = null; resolve(); };
      video.onerror = function () { clearTimeout(tmo); video.onerror = null; reject(new Error(t('errVideoLoad'))); };
      video.src = url;
      video.load();
    });
  }

  async function processVideoFile(file, ranges, onProg) {
    if (!window.MediaRecorder) throw new Error(t('errNoRec'));
    var video = $('procVideo');
    video.muted = false;
    var url = URL.createObjectURL(file);
    try {
      await loadProcVideo(video, url);
      await waitForFiniteDuration(video);
      return await recordProcessedVideo(video, ranges, onProg);
    } finally {
      try { video.pause(); } catch (e) {}
      video.removeAttribute('src');
      video.load();
      URL.revokeObjectURL(url);
    }
  }

  function recordProcessedVideo(video, ranges, onProg) {
    return new Promise(function (resolve, reject) {
      var mime = [
        'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus',
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm'
      ].filter(function (ty) { try { return MediaRecorder.isTypeSupported(ty); } catch (e) { return false; } })[0];
      if (!mime) { reject(new Error(t('errNoRec'))); return; }

      var blurRanges = ranges.filter(function (r) { return r.blur; });
      var muteRanges = ranges.filter(function (r) { return r.mute; });

      var vw = video.videoWidth || 640, vh = video.videoHeight || 480;
      var k = Math.min(1, MAX_VIDEO_W / vw);
      var ow = Math.max(2, Math.round(vw * k / 2) * 2), oh = Math.max(2, Math.round(vh * k / 2) * 2);

      var oCanvas = document.createElement('canvas');
      oCanvas.width = ow; oCanvas.height = oh;
      var oCtx = oCanvas.getContext('2d', { alpha: false });
      oCtx.imageSmoothingEnabled = true;

      var scratch = document.createElement('canvas');
      var tw = 24, th = Math.max(1, Math.round(tw * vh / vw));
      scratch.width = tw; scratch.height = th;
      var sctx = scratch.getContext('2d', { alpha: false });
      sctx.imageSmoothingEnabled = true;

      var pa;
      try { pa = getProcAudio(); } catch (e) { reject(new Error('Audio: ' + e.message)); return; }
      var audioCtx = pa.ctx, gainNode = pa.gain;
      var destNode = audioCtx.createMediaStreamDestination();
      gainNode.connect(destNode);
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);

      function cleanupAudio() {
        try { gainNode.disconnect(destNode); } catch (e) {}
        gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      }

      var vTracks = oCanvas.captureStream(30).getVideoTracks();
      var stream = new MediaStream(vTracks.concat(destNode.stream.getAudioTracks()));

      var rec;
      try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: VIDEO_BITRATE }); }
      catch (e) { cleanupAudio(); reject(new Error('MediaRecorder: ' + e.message)); return; }

      var chunks = [], running = true, finished = false, lastUI = 0;
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        if (finished) return; finished = true;
        running = false;
        try { video.pause(); } catch (e) {}
        video.onended = null;
        vTracks.forEach(function (tr) { try { tr.stop(); } catch (e) {} });
        cleanupAudio();
        resolve(new Blob(chunks, { type: mime.split(';')[0] }));
      };

      function drawFrame() {
        if (inRanges(blurRanges, video.currentTime)) {
          sctx.drawImage(video, 0, 0, tw, th);
          oCtx.drawImage(scratch, 0, 0, tw, th, 0, 0, ow, oh);
        } else {
          oCtx.drawImage(video, 0, 0, ow, oh);
        }
      }

      function nextFrame(fn) {
        if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(function () { fn(); });
        else requestAnimationFrame(fn);
      }

      function loop() {
        if (!running) return;
        drawFrame();
        gainNode.gain.setValueAtTime(inRanges(muteRanges, video.currentTime) ? 0 : 1, audioCtx.currentTime);
        var now = performance.now();
        if (now - lastUI > 250) {
          lastUI = now;
          if (isFinite(video.duration) && video.duration > 0 && onProg) {
            onProg(video.currentTime / video.duration * 100, Math.round(video.currentTime) + 's / ' + Math.round(video.duration) + 's');
          }
        }
        nextFrame(loop);
      }

      function stopAll() { if (rec.state !== 'inactive') rec.stop(); }

      function seekToStart() {
        return new Promise(function (res) {
          var done = false, go = function () { if (!done) { done = true; res(); } };
          if (video.readyState >= 2 && video.currentTime < 0.05) { go(); return; }
          video.addEventListener('seeked', go, { once: true });
          video.currentTime = 0;
          setTimeout(go, 1200);
        });
      }

      if (onProg) onProg(0, t('warmup'));

      seekToStart().then(function () {
        return Promise.resolve(video.play());
      }).then(function () {
        if (audioCtx.state === 'suspended') return audioCtx.resume();
      }).then(function () {
        var primed = 0;
        (function prime() {
          drawFrame();
          if (++primed < 4) { nextFrame(prime); return; }
          video.onended = stopAll;
          rec.start(1000);
          loop();
        })();
      }).catch(function (err) {
        running = false;
        cleanupAudio();
        reject(new Error(t('errPlayback') + (err && err.message ? err.message : err)));
      });
    });
  }

  // --- Τελική επεξεργασία ήχου ---
  function processAudioLocal(file, mRanges) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error(t('errFileRead'))); };
      reader.onload = async function (e) {
        try {
          var aCtx = new (window.AudioContext || window.webkitAudioContext)();
          var aBuf = await new Promise(function (res, rej) { aCtx.decodeAudioData(e.target.result, res, rej); });
          aCtx.close();

          var oCtx = new OfflineAudioContext(aBuf.numberOfChannels, aBuf.length, aBuf.sampleRate);
          var src = oCtx.createBufferSource(); src.buffer = aBuf;
          var gain = oCtx.createGain(); gain.gain.setValueAtTime(1, 0);
          mRanges.forEach(function (r) {
            gain.gain.setValueAtTime(1, Math.max(0, r.s - 0.01));
            gain.gain.setValueAtTime(0, r.s);
            gain.gain.setValueAtTime(0, r.e);
            gain.gain.setValueAtTime(1, r.e + 0.01);
          });
          src.connect(gain); gain.connect(oCtx.destination); src.start(0);

          var renBuf = await oCtx.startRendering();
          var numCh = renBuf.numberOfChannels, len = renBuf.length * numCh * 2 + 44;
          var buf = new ArrayBuffer(len), view = new DataView(buf), pos = 0;
          var set16 = function (d) { view.setUint16(pos, d, true); pos += 2; };
          var set32 = function (d) { view.setUint32(pos, d, true); pos += 4; };

          set32(0x46464952); set32(len - 8); set32(0x45564157); set32(0x20746d66); set32(16); set16(1); set16(numCh);
          set32(renBuf.sampleRate); set32(renBuf.sampleRate * 2 * numCh); set16(numCh * 2); set16(16); set32(0x61746164); set32(len - pos - 4);

          var chs = [];
          for (var i = 0; i < numCh; i++) chs.push(renBuf.getChannelData(i));
          for (var off = 0; off < renBuf.length; off++) {
            for (var c = 0; c < numCh; c++) {
              var smp = Math.max(-1, Math.min(1, chs[c][off]));
              set16((smp < 0 ? smp * 32768 : smp * 32767) | 0);
            }
          }
          resolve(new Blob([buf], { type: 'audio/wav' }));
        } catch (err) { reject(err); }
      };
      reader.readAsArrayBuffer(file);
    });
  }

  // ==========================================
  // Εκκίνηση
  // ==========================================
  setLang(LANG);
  updateMediaListUI();
  renderLoc();
})();
</script>
</body>
