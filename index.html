<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<!-- WCAG 1.4.4: επιτρέπεται η μεγέθυνση (αφαιρέθηκαν user-scalable/maximum-scale) -->
<meta name="theme-color" content="#186078" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Test</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

<style>
  :root {
    /* Χρώματα από το logo Walking Memory */
    --petrol: #186078;       /* κύριο: κείμενο, κουμπιά */
    --petrol-deep: #0E3F50;  /* σκούρες επιφάνειες */
    --sky: #249CCC;          /* γραμμές, περιγράμματα, εστίαση */
    --sky-soft: #E7F4FA;
    --sky-light: #7CCAEB;    /* κείμενο πάνω σε σκούρο */
    --amber: #E0904F;        /* το «μονοπάτι» — έμφαση */
    --amber-text: #9A5413;   /* πορτοκαλί για μικρό κείμενο σε λευκό */
    --ink: #12303B;
    --paper: #FFFFFF;
    --mist: #F2F7F9;
    --line: #D3E3EA;
    --line-strong: #6F8D99;  /* όρια πεδίων (≥3:1) */
    --danger: #B3261E;
    --muted: #4B6470;
    --brand-path: linear-gradient(90deg, #E0904F 0%, #249CCC 55%, #186078 100%);
    /* ψευδώνυμα για inline styles */
    --chalk: var(--amber); --bone: #fff; --sea-dark: var(--petrol); --sea-light: var(--sky-light);
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
    --pad: 16px;
    --handle: calc(56px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: var(--petrol-deep); color: var(--ink);
    font-family: var(--font); font-size: 17px; line-height: 1.5;
  }
  button, input, select { font-family: inherit; }
  button { font-size: inherit; cursor: pointer; border: 0; border-radius: 999px; }
  h1, h2 { font-style: italic; font-weight: 700; color: var(--petrol); letter-spacing: -0.01em; line-height: 1.15; }

  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(255,255,255,.85); }

  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  a-scene, a-scene .a-canvas { position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important; z-index: 0; }
  body.editing a-scene, body.editing a-scene .a-canvas { visibility: hidden !important; }

  /* ---------- Ετικέτες AR ---------- */
  #ar-overlay-container { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .ar-html-marker {
    position: absolute; transform: translate(-50%, -50%);
    background: rgba(255,255,255,.96); color: var(--ink);
    border-left: 4px solid var(--sky); border-radius: 12px;
    padding: 8px 12px; width: 184px; min-height: 44px; text-align: left;
    box-shadow: 0 6px 18px rgba(14,63,80,.35);
    pointer-events: auto;
    transition: left .15s ease-out, top .15s ease-out, transform .2s ease-out, box-shadow .2s ease-out;
  }
  .ar-html-marker.locked { opacity: .85; filter: grayscale(.7); border-left-color: var(--line-strong) !important; }
  .ar-html-marker.closest { z-index: 100 !important; border-left-color: var(--amber); transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 10px 24px rgba(14,63,80,.45); }
  .closest-badge {
    position: absolute; top: -12px; right: -8px; display: none; pointer-events: none;
    background: var(--amber); color: var(--ink); font-size: 12px; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .ar-html-marker.closest .closest-badge { display: block; }
  .ar-html-marker .m-title { display: block; font-size: 15px; font-weight: 700; font-style: italic; color: var(--petrol); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-html-marker .m-sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-html-marker .m-dist { display: block; font-size: 12px; font-weight: 600; color: var(--amber-text); }

  /* ---------- Αρχική οθόνη ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 40; overflow: hidden auto;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    background: var(--paper); color: var(--ink);
  }
  .gate-path { position: absolute; top: 0; right: -18%; width: 78%; height: 100%; opacity: .16; pointer-events: none; z-index: 0; }
  .gate-logo, .gate-body { position: relative; z-index: 1; }
  .gate-logo img { height: 56px; width: auto; display: block; }
  .gate-body { max-width: 34rem; }
  #gate h1 { font-size: 32px; margin: 0 0 14px; }
  #gate p { color: var(--muted); margin: 0; }
  .rule { height: 4px; width: 72px; border-radius: 2px; background: var(--brand-path); margin: 0 0 18px; }
  #startBtn {
    margin-top: 24px; width: 100%; padding: 17px; min-height: 56px;
    background: var(--petrol); color: #fff; font-size: 18px; font-weight: 700; font-style: italic;
    box-shadow: 0 8px 20px rgba(24,96,120,.3);
  }
  #startBtn:disabled { opacity: .7; }
  .gate-lang { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .gate-lang label { font-size: 15px; font-weight: 600; color: var(--petrol); }

  .lang-select {
    font-size: 16px; font-weight: 600; padding: 8px 14px; min-height: 44px;
    border-radius: 999px; border: 2px solid var(--line-strong);
    background: #fff; color: var(--petrol);
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; }
  #hud.on { display: block; }
  #status {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top)); left: var(--pad); right: var(--pad);
    padding: 9px 16px; border-radius: 999px;
    background: rgba(255,255,255,.94); color: var(--petrol); font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #langWrap { position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 54px); right: var(--pad); pointer-events: auto; }
  #langWrap .lang-select { box-shadow: 0 4px 14px rgba(14,63,80,.25); }

  /* ---------- Χάρτης ---------- */
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; height: 52%; z-index: 15; display: flex; flex-direction: column; transform: translateY(calc(100% - var(--handle))); transition: transform .28s cubic-bezier(.32,.72,0,1); }
  #drawer.open { transform: translateY(0); }
  #handle {
    position: relative; flex: none; height: var(--handle); width: 100%;
    display: flex; align-items: center; gap: 12px; padding: 0 20px env(safe-area-inset-bottom);
    background: #fff; color: var(--petrol); border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 18px rgba(14,63,80,.2); pointer-events: auto; touch-action: none;
  }
  #handle::before { content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; border-radius: 0 0 4px 4px; background: var(--brand-path); }
  #handle .grip { width: 34px; height: 4px; border-radius: 2px; background: #9FB6C0; flex: none; }
  #handle .lbl { font-size: 16px; font-weight: 700; font-style: italic; }
  #map { position: relative; flex: 1; background: var(--mist); pointer-events: auto; }
  .leaflet-container { background: var(--mist); font-family: inherit; }
  .map-cluster-dot { background: var(--petrol); color: #fff; border: 3px solid #fff; border-radius: 50%; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  #compass { position: absolute; top: 12px; right: 10px; z-index: 500; width: 54px; height: 54px; border-radius: 50%; background: #fff; color: var(--petrol); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(14,63,80,.3); }
  #compass .needle { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #compass .needle::before { content: ''; position: absolute; left: 50%; top: 6px; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 14px solid var(--amber); }
  #compass .needle::after { content: ''; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 14px solid rgba(24,96,120,.3); }

  #nearest {
    position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--handle) + var(--pad));
    display: none; width: calc(100% - var(--pad) * 2); text-align: left; padding: 14px 18px;
    background: #fff; color: var(--ink); border-radius: 16px; border-left: 6px solid var(--amber);
    box-shadow: 0 8px 22px rgba(14,63,80,.3); pointer-events: auto; transition: bottom .28s;
  }
  #nearest.on { display: block; }
  body.drawer-open #nearest { bottom: calc(52% + var(--pad)); }
  #nearest .dist { display: block; font-size: 14px; font-weight: 600; color: var(--amber-text); }
  #nearest .name { display: block; font-size: 20px; font-weight: 700; font-style: italic; color: var(--petrol); }

  .me-wrap { position: relative; width: 56px; height: 56px; }
  .me-rot { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .me-cone { position: absolute; left: 50%; bottom: 50%; transform: translateX(-50%); border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid rgba(36,156,204,.55); }
  .me-rot.unknown .me-cone { display: none; }
  .me-dot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: var(--sky); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--petrol); }
  .poi-dot { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid var(--petrol); margin: 4px; }

  #addBtn {
    position: fixed; bottom: calc(var(--handle) + var(--pad) + 76px); right: var(--pad); z-index: 25;
    width: 58px; height: 58px; display: none; align-items: center; justify-content: center;
    background: var(--petrol); color: #fff; font-size: 32px; font-weight: 400;
    border: 3px solid #fff; box-shadow: 0 6px 16px rgba(14,63,80,.4); pointer-events: auto;
  }
  #addBtn.on { display: flex; }
  body.drawer-open #addBtn { bottom: calc(52% + var(--pad)); }

  #authBtn {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 54px); left: var(--pad); pointer-events: auto;
    padding: 8px 16px; min-height: 44px; font-size: 15px; font-weight: 700;
    background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #authBtn[hidden] { display: none; }
  .story-media { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 6px; }
  .story-media img, .story-media video { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: #000; }
  .story-media audio { width: 100%; }
  .story-author { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .input-group input[type="email"], .input-group input[type="password"] { width: 100%; padding: 12px 14px; border: 2px solid var(--line-strong); border-radius: 12px; font-size: 16px; color: var(--ink); }
  #authSheet { z-index: 70; }
  .link-btn { background: none; color: var(--petrol); text-decoration: underline; font-weight: 600; padding: 8px 4px; min-height: 44px; border-radius: 8px; }

  .story-know { margin: 8px 0; }
  .story-know h3, .ann-media h3 { margin: 14px 0 6px; font-size: 16px; font-style: italic; color: var(--petrol); }
  .story-know details { margin: 6px 0; } .story-know summary { cursor: pointer; font-weight: 600; color: var(--petrol); min-height: 32px; }
  .story-know pre { white-space: pre-wrap; font-family: inherit; font-size: 15px; background: var(--mist); border-radius: 10px; padding: 10px; }
  .term-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .term-list li { background: var(--sky-soft); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .term-list a { color: var(--petrol); font-weight: 600; }
  .vocab-tag { font-size: 11px; font-weight: 700; color: var(--amber-text); margin-left: 6px; text-transform: uppercase; }
  #sheetTools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; } #sheetTools[hidden] { display: none; }
  .img-frame { position: relative; line-height: 0; }
  .story-media .img-frame { display: inline-block; max-width: 100%; }
  .story-media .img-frame img { display: block; width: auto; max-width: 100%; max-height: 42vh; height: auto; border-radius: 12px; background: #000; cursor: zoom-in; }
  #imgPopup { z-index: 80; }
  #imgPopup .sheet-inner { max-height: 96vh; }
  .popup-stage { display: flex; justify-content: center; }
  .popup-frame { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
  .popup-frame img { display: block; width: auto; height: auto; max-width: 100%; max-height: 62vh; border-radius: 12px; background: #000; }
  .img-thumb { display: block; padding: 0; width: 120px; height: 90px; overflow: hidden; border: 2px solid var(--line-strong); border-radius: 12px; background: #000; cursor: zoom-in; }
  .img-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .region-layer { position: absolute; inset: 0; pointer-events: none; }
  .region-layer.drawing { pointer-events: auto; cursor: crosshair; touch-action: none; outline: 3px solid var(--amber); }
  .region-box { position: absolute; box-sizing: border-box; pointer-events: none; border: 3px solid var(--amber); box-shadow: 0 0 0 1px rgba(255,255,255,.9) inset, 0 0 0 1px rgba(0,0,0,.45); }
  .region-box.suggested { border-style: dashed; }
  .img-terms { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .term-row label { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; min-height: 40px; }
  .term-row input[type=checkbox] { width: 22px; height: 22px; }
  .badge-sug { font-size: 12px; font-weight: 700; color: var(--amber-text); }
  #listBtn {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 108px); left: var(--pad); pointer-events: auto;
    padding: 8px 16px; min-height: 44px; font-size: 15px; font-weight: 700;
    background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #listBtn[hidden] { display: none; }
  #modeBtn {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 108px); right: var(--pad); pointer-events: auto; max-width: 62%;
    padding: 8px 16px; min-height: 44px; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #modeBtn[hidden] { display: none; }
  .mode-choose { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .mode-choose[hidden], .mode-choose .mode-opt[hidden] { display: none; }
  .mode-choose .mode-head { font-size: 15px; font-weight: 700; color: var(--petrol); margin: 0; }
  .mode-opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 2px solid var(--line-strong); border-radius: 14px; background: #fff; cursor: pointer; }
  .mode-opt:has(input:checked) { border-color: var(--petrol); background: var(--sky-soft); }
  .mode-opt input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--petrol); flex: none; }
  .mode-opt b { display: block; color: var(--petrol); font-size: 17px; }
  .mode-opt small { display: block; color: var(--muted); font-size: 14px; }
  .mode-opt select { margin-top: 8px; width: 100%; }
  .mode-opt .walk-desc { margin: 6px 0 0; font-size: 14px; color: var(--ink); }
  .mode-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .mode-actions button { flex: 1 1 140px; padding: 12px 18px; min-height: 48px; font-weight: 700; }
  #walkProgress ol { margin: 12px 0 0; padding-left: 0; list-style: none; }
  #walkProgress li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  #walkProgress li .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; background: #fff; color: var(--petrol); border: 3px solid var(--petrol); }
  #walkProgress li.done .n { background: var(--petrol); color: #fff; }
  #walkProgress li.next .n { border-color: var(--amber); }
  #walkProgress li .tt { flex: 1 1 auto; min-width: 0; }
  #walkProgress li .tt small { display: block; color: var(--muted); }
  #walkProgress .restart { margin-top: 10px; }
  #nearest.walk { border-left-color: var(--petrol); }
  .walk-pin { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--petrol); border: 3px solid var(--petrol); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .walk-pin.done { background: var(--petrol); color: #fff; }
  .walk-pin.next { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(224,144,79,.45); }
  .story-status { font-size: 13px; font-weight: 700; color: var(--amber-text); margin: 0 0 6px; } .story-status:empty { display: none; }
  .list-item { display: block; width: 100%; text-align: left; border-radius: 14px; background: var(--mist); color: var(--ink); padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); }
  .list-item .t { display: block; font-weight: 700; color: var(--petrol); font-style: italic; }
  .list-item .m { display: block; font-size: 13px; color: var(--muted); }
  .chip-draft { color: var(--amber-text); font-weight: 700; } .chip-pub { color: var(--petrol); font-weight: 700; }
  .sync-stage { border: 3px solid var(--amber); border-radius: 16px; padding: 10px; background: #fff; }
  .sync-stage[hidden] { display: none; }
  .stage-view { height: 38vh; min-height: 200px; display: flex; gap: 8px; align-items: center; justify-content: center; background: var(--mist); border-radius: 12px; overflow: hidden; }
  .stage-view .img-wrap { height: 100%; display: flex; align-items: center; min-width: 0; animation: stageIn .35s ease; }
  .stage-view .img-frame { display: inline-block; max-width: 100%; }
  .stage-view .img-frame img { max-height: 32vh; max-width: 100%; width: auto; height: auto; border-radius: 10px; cursor: zoom-in; }
  .stage-view .img-terms { display: none; }
  .stage-view .img-wrap.keep { animation: none; }
  .av-wrap > summary { font-size: 16px; }
  .av-wrap > .media-cap { margin: 4px 0 6px; }
  .media-cap { font-size: 14px; color: var(--muted); margin: 6px 0 4px; line-height: 1.35; }
  .media-cap strong { display: block; color: var(--petrol); font-size: 15px; }
  .media-cap a { color: var(--petrol); font-weight: 600; }
  .stage-view .img-wrap { flex-direction: column; justify-content: center; }
  .stage-idle { color: var(--muted); font-size: 15px; text-align: center; padding: 0 16px; }
  .stage-terms { min-height: 44px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .stage-terms .term-list { margin: 0; }
  @keyframes stageIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage-view .img-wrap { animation: none; } }
  .sync-stage h3, .link-strip-h { margin: 0 0 6px; font-size: 15px; font-style: italic; color: var(--petrol); }
  .link-strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .link-card { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--sky-soft); color: var(--petrol); font-weight: 700; font-size: 14px; border: 2px solid transparent; min-height: 48px; }
  .link-card img { width: 44px; height: 36px; object-fit: cover; border-radius: 8px; }
  .link-card.active { border-color: var(--amber); }
  .tr-lines { list-style: none; margin: 6px 0 0; padding: 0; }
  .tr-line { display: block; width: 100%; text-align: left; background: none; color: var(--ink); border-radius: 8px; padding: 6px 8px; font-size: 15px; border: 0; }
  .tr-line .when { font-weight: 700; color: var(--amber-text); margin-right: 8px; font-size: 13px; }

  .lnk-box { border-top: 1px dashed var(--line-strong); margin-top: 10px; padding-top: 8px; }

  function detectLang() {
    try {
      var saved = localStorage.getItem('dm_lang');
      if (saved && LANGS.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var prefs = navigator.languages || [navigator.language || 'el'];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).slice(0, 2).toLowerCase();
      if (LANGS.indexOf(code) !== -1) return code;
    }
    return 'el';
  }

  var LANG = detectLang();

  function t(key, vars) {
    var s = (I18N[LANG] && I18N[LANG][key]) || I18N.el[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  function applyLang(root) {
    root = root || document;
    root.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    root.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.dataset.i18nPh); });
    root.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  }

  // Για λειτουργίες που πρέπει να ξαναζωγραφίσουν κείμενο όταν αλλάζει η γλώσσα
  var langListeners = [];
  function onLangChange(fn) { langListeners.push(fn); }

  function setLang(code) {
    if (LANGS.indexOf(code) === -1) return;
    LANG = code;
    try { localStorage.setItem('dm_lang', code); } catch (e) {}
    document.documentElement.lang = code;       // WCAG 3.1.1
    document.title = t('pageTitle');            // WCAG 2.4.2
    $('langGate').value = code;
    $('langHud').value = code;
    if ($('langConsent')) $('langConsent').value = code;
    applyLang();
    langListeners.forEach(function (fn) { try { fn(); } catch (e) {} });
  }

  $('langGate').addEventListener('change', function () { setLang(this.value); });
  $('langHud').addEventListener('change', function () { setLang(this.value); });
  $('langConsent').addEventListener('change', function () { setLang(this.value); });

  function announce(msg) {
    var r = $('srLive');
    r.textContent = '';
    setTimeout(function () { r.textContent = msg; }, 60);
  }

  var dialogStack = [];
  var FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function focusablesIn(el) {
    return Array.prototype.filter.call(el.querySelectorAll(FOCUSABLE), function (n) {
      return !n.hidden && n.getClientRects().length > 0;
    });
  }

  function openDialog(id, focusEl) {
    var el = $(id);
    if (!el.classList.contains('on')) {
      el.classList.add('on');
      dialogStack.push({ id: id, ret: document.activeElement });
    }
    setTimeout(function () {
      var target = focusEl || el.querySelector('[data-autofocus]') || focusablesIn(el)[0] || el;
      if (target === el && !el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
      try { target.focus(); } catch (e) {}
    }, 40);
  }

  function closeDialog(id, noRestore) {
    var el = $(id);
    el.classList.remove('on');
    for (var i = dialogStack.length - 1; i >= 0; i--) {
      if (dialogStack[i].id === id) {
        var entry = dialogStack.splice(i, 1)[0];
        if (!noRestore && entry.ret && document.contains(entry.ret) && entry.ret.getClientRects().length) {
          try { entry.ret.focus(); } catch (e) {}
        }
        break;
      }
    }
  }

  var escHandlers = {};

  document.addEventListener('keydown', function (e) {
    var top = dialogStack.length ? $(dialogStack[dialogStack.length - 1].id) : null;
    if (!top) return;

    if (e.key === 'Escape' && escHandlers[top.id]) {
      e.preventDefault();
      escHandlers[top.id]();
      return;
    }

    if (e.key === 'Tab') {
      var items = focusablesIn(top);
      if (!items.length) { e.preventDefault(); return; }
      var first = items[0], last = items[items.length - 1];
      if (!top.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // ==========================================
  // 1. AR & ΧΑΡΤΗΣ
  // ==========================================
  window.hardwareHeading = null;
  window.currentEditIndex = -1;

  window.addEventListener('deviceorientation', function(e) {
    if (e.webkitCompassHeading !== undefined) window.hardwareHeading = e.webkitCompassHeading;
  }, true);

  window.addEventListener('deviceorientationabsolute', function(e) {
    if (e.alpha !== null) {
      var alpha = e.alpha ? e.alpha * Math.PI / 180 : 0;
      var beta = e.beta ? e.beta * Math.PI / 180 : 0;
      var gamma = e.gamma ? e.gamma * Math.PI / 180 : 0;
      var cA = Math.cos(alpha), sA = Math.sin(alpha);
      var cB = Math.cos(beta), sB = Math.sin(beta);
      var cG = Math.cos(gamma), sG = Math.sin(gamma);
      var vX = -cA * sG - sA * sB * cG;
      var vY = -sA * sG + cA * sB * cG;
      var heading = Math.atan2(vX, vY) * 180 / Math.PI;
      if (heading < 0) heading += 360;
      window.hardwareHeading = heading;
    }
  }, true);

  var STORIES = [];   // φορτώνονται από τη βάση (Supabase)
  var DEFAULT_CENTER = [39.106668, 26.557367];   // Μυτιλήνη

  function st(s) { return s.t[LANG] || s.t.el; }
  function fmtDist(d) { return d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m'; }

  var MIN_DIST = 2;
  var me = null, map = null, meMarker = null, accCircle = null, followMe = true, gpsFailed = false;
  window.currentHeading = null;

  var arPaused = false;
  function setAR(active) {
    var sc = document.querySelector('a-scene');
    if (!sc) return;
    if (!active && !arPaused) { try { sc.pause(); } catch(e){} arPaused = true; document.body.classList.add('editing'); }
    else if (active && arPaused) { try { sc.play(); } catch(e){} arPaused = false; document.body.classList.remove('editing'); }
  }

  function distanceMetres(lat1, lon1, lat2, lon2) {
    var R = 6371000, rad = function(d) { return d * Math.PI / 180; };
    var a = Math.sin(rad(lat2 - lat1)/2) * Math.sin(rad(lat2 - lat1)/2) + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1)/2) * Math.sin(rad(lon2 - lon1)/2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  AFRAME.registerComponent('hud-compass', {
    tick: function () {
      if (window.hardwareHeading === null) return;
      var h = window.hardwareHeading;
      window.currentHeading = h;
      if (this.displayHeading === undefined) this.displayHeading = h;
      var diff = h - (this.displayHeading % 360);
      if (diff > 180) diff -= 360; else if (diff < -180) diff += 360;
      this.displayHeading += diff * 0.1;
      var needle = document.querySelector('#compass .needle');
      var degOut = document.querySelector('#compass .deg');
      if (needle) {
        needle.style.transform = 'rotate(' + (-this.displayHeading) + 'deg)';
        degOut.textContent = Math.round(((this.displayHeading % 360) + 360) % 360) + '°';
      }
      applyHeadingToDot();
      updateHTMLMarkersPosition();
    }
  });

  // ---- Στατιστικά χρήσης (ανώνυμα): ποιες ιστορίες ανοίγονται/ακούγονται. Τυχαίο id στη συσκευή, χωρίς όνομα, e-mail ή IP.
  // Αν ο browser ζητά «Do Not Track», δεν καταγράφεται τίποτα.
  function visitorId() {
    try {
      var v = localStorage.getItem('wm_vid');
      if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); localStorage.setItem('wm_vid', v); }
      return /^[0-9a-f-]{36}$/i.test(v) ? v : null;
    } catch (e) { return null; }
  }
  function trackView(s, event, mediaId, via) {
    if (!sb || !s || !s.dbId || navigator.doNotTrack === '1' || window.doNotTrack === '1') return;
    var vid = visitorId(); if (!vid) return;
    var row = { visitor_id: vid, user_id: currentUser ? currentUser.id : null, story_id: s.dbId, event: event, media_id: mediaId || null, via: via || null };
    try { sb.from('story_views').insert(row).then(function () {}, function () {}); } catch (e) { /* τα στατιστικά δεν επηρεάζουν την εφαρμογή */ }
  }

  function openStorySheet(s, via) {
    if (MODE.kind === 'walk' && walkNo(s)) markVisited(s);
    trackView(s, 'open', null, via);
    var tr = st(s);
    $('sheetTitle').textContent = tr.title;
    $('sheetSub').textContent = tr.sub;
    $('sheetBody').textContent = tr.text;
    $('sheetAuthor').textContent = s.author ? t('byAuthor', { n: s.author }) : '';
    renderSheetMedia(s);
    renderKnowledge(s);
    renderConnections(s, via);
    openDialog('infoSheet');
  }
  // Ιστορίες συνδεδεμένες με αυτή σε δημοσιευμένες διαδρομές (σελίδα «Συνδέσεις ιστοριών»): προηγούμενες και επόμενες
  function connectionsOf(s) {
    var out = [], seen = {};
    if (!s.dbId) return out;
    WALKS.forEach(function (w) {
      (w.links || []).forEach(function (l) {
        var dir = l.from === s.dbId ? 'next' : l.to === s.dbId ? 'prev' : null; if (!dir) return;
        var o = storyByDb(dir === 'next' ? l.to : l.from);
        if (!o || o.status !== 'published' || seen[dir + o.dbId + w.id]) return;
        seen[dir + o.dbId + w.id] = 1;
        out.push({ dir: dir, s: o, label: l.label, walk: w });
      });
    });
    return out.sort(function (a, b) { return (a.dir === 'prev' ? 0 : 1) - (b.dir === 'prev' ? 0 : 1); });
  }
  function renderConnections(s, via) {
    var box = $('sheetLinks'); box.innerHTML = '';
    var list = connectionsOf(s); if (!list.length) return;
    var h = document.createElement('h3'); h.textContent = t('connTitle'); box.appendChild(h);
    var ul = document.createElement('ul');
    list.forEach(function (c) {
      var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
      b.appendChild(document.createTextNode((c.dir === 'next' ? '→ ' + t('connNext') : '← ' + t('connPrev')) + ': '));
      var tb = document.createElement('b'); tb.textContent = st(c.s).title; b.appendChild(tb);
      var sm = document.createElement('small'); sm.textContent = [t('connIn', { w: c.walk.title }), c.label ? '“' + c.label + '”' : ''].filter(Boolean).join(' · '); b.appendChild(sm);
      b.onclick = function () { openStorySheet(c.s, via === 'map' || via === 'ar' ? 'map' : 'list'); var sh = $('infoSheet').querySelector('.sheet-inner'); if (sh) sh.scrollTop = 0; };
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  function clearSheetMedia() {
    var box = $('sheetMedia');
    box.querySelectorAll('video, audio').forEach(function (m) { m.pause(); m.removeAttribute('src'); m.load(); });
    box.innerHTML = '';
    $('sheetImages').innerHTML = '';
    $('sheetLinks').innerHTML = '';
    imagesFoldOpen = undefined; termsFoldOpen = undefined;
    clearSubtitles();
    sheetK = null; currentLinks = [];
  }
  function renderSheetMedia(s) {
    clearSheetMedia();
    var avWraps = [], avN = 0;
    (s.media || []).forEach(function (m, i) {
      if (m.kind === 'image') return;
      avN++;
      var el;
      if (m.kind === 'video') { el = document.createElement('video'); el.controls = true; el.playsInline = true; el.preload = 'metadata'; }
      else { el = document.createElement('audio'); el.controls = true; el.preload = 'metadata'; }
      el.setAttribute('aria-label', mediaName(s, m));
      el.dataset.mediaId = m.id || '';
      el.src = m.url;
      el.addEventListener('timeupdate', function () { updateStage(el); });
      el.addEventListener('seeked', function () { updateStage(el); });
      el.addEventListener('loadedmetadata', function () { if (sheetK) paintTimeline(s, el); });
      el.addEventListener('durationchange', function () { if (sheetK) paintTimeline(s, el); });
      var played = false, ended = false;
      el.addEventListener('ended', function () { if (!ended) { ended = true; trackView(s, 'complete', m.id); } });
      el.addEventListener('play', function () {
        if (!played) { played = true; trackView(s, 'play', m.id); }
        $('sheetMedia').querySelectorAll('audio, video').forEach(function (o) { if (o !== el) o.pause(); });
        var w = el.closest('.av-wrap'); if (w && !w.open) w.open = true;          // ανοίγει το πλαίσιο της ηχογράφησης που παίζει
      });
      var wrap = document.createElement('details'); wrap.className = 'fold av-wrap'; wrap.dataset.avWrap = m.id || ''; avWraps.push(wrap);
      var wsm = document.createElement('summary'); wsm.textContent = KIND_ICON[m.kind] + ' ' + mediaName(s, m); wrap.appendChild(wsm);
      var mcap = mediaCaption(m, false, true); if (mcap) wrap.appendChild(mcap);
      wrap.appendChild(el);
      var stg = document.createElement('div'); stg.className = 'sync-stage'; stg.hidden = true; stg.setAttribute('aria-live', 'polite'); wrap.appendChild(stg);   // η δική της «οθόνη» εικόνων και όρων
      wrap.addEventListener('toggle', function () { if (wrap.open) avWraps.forEach(function (o) { if (o !== wrap) o.open = false; }); });   // ένα ανοιχτό κάθε φορά
      $('sheetMedia').appendChild(wrap);
    });
    if (avWraps.length) avWraps[0].open = true;
    renderImages(s, null);
  }
  function tr_(s) { return st(s).title; }
  $('closeInfoBtn').addEventListener('click', function () { clearSheetMedia(); currentSheetStory = null; closeDialog('infoSheet'); });
  escHandlers.infoSheet = function () { clearSheetMedia(); currentSheetStory = null; closeDialog('infoSheet'); };

  function createMarkerEl(s) {
    var container = $('ar-overlay-container');
    var btn = document.createElement('button');
    btn.className = 'ar-html-marker';
    btn.id = 'html-marker-' + s.id;
    btn.style.display = 'none';
    btn.innerHTML =
      '<span class="closest-badge" aria-hidden="true"></span>' +
      '<span class="m-title"><span class="lock" aria-hidden="true">🔒 </span><span class="mt"></span></span>' +
      '<span class="m-sub"></span>' +
      '<span class="m-dist"></span>';
    btn.onclick = function () {
      if (me) {
        var d = distanceMetres(me.lat, me.lon, s.lat, s.lon);
        if (d > 100) { alert(t('lockedAlert', { m: Math.round(d) })); return; }
      }
      openStorySheet(s, 'ar');
    };
    container.appendChild(btn);
  }

  function buildScene() {
    var container = $('ar-overlay-container');
    container.innerHTML = '';
    STORIES.forEach(createMarkerEl);
    refreshMarkerTexts();

    var scene = document.createElement('a-scene');
    scene.setAttribute('hud-compass', '');
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    scene.setAttribute('arjs', 'sourceType: webcam; videoTexture: true; debugUIEnabled: false');
    scene.setAttribute('aria-hidden', 'true');
    scene.innerHTML = '<a-camera id="cam" gps-new-camera="gpsMinDistance: ' + MIN_DIST + '"></a-camera>';
    document.body.appendChild(scene);
  }

  function refreshMarkerTexts() {
    STORIES.forEach(function (s) {
      var el = $('html-marker-' + s.id);
      if (!el) return;
      var tr = st(s);
      el.querySelector('.closest-badge').textContent = t('closest');
      var no = walkNo(s);
      el.querySelector('.mt').textContent = (no ? no + ' · ' : '') + tr.title;
      el.querySelector('.m-sub').textContent = tr.sub + (s.status === 'draft' ? ' · ' + t('statusDraft') : '');
      el.querySelector('.m-dist').textContent = s.d != null ? t('distance', { d: fmtDist(s.d) }) : t('calculating');
      el._label = null;
    });
  }
  onLangChange(refreshMarkerTexts);

  function updateHTMLMarkersPosition() {
    if (!me || window.currentHeading === null) return;
    if (!document.querySelector('#cam')) return;

    var items = [], minDist = Infinity, closestId = null;

    STORIES.forEach(function (s) {
      s.d = distanceMetres(me.lat, me.lon, s.lat, s.lon);
      if (inMode(s) && s.d < minDist) { minDist = s.d; closestId = s.id; }
    });
    if (MODE.kind === 'walk') { var ns0 = nextStop(); closestId = ns0 ? ns0.s.id : null; }   // σε διαδρομή τονίζεται η επόμενη στάση

    STORIES.forEach(function (s) {
      var el = $('html-marker-' + s.id);
      if (!el) return;
      if (!inMode(s)) { if (el.style.display !== 'none') el.style.display = 'none'; return; }

      var distTxt = t('distance', { d: fmtDist(s.d) });
      var distEl = el.querySelector('.m-dist');
      if (distEl.textContent !== distTxt) distEl.textContent = distTxt;

      var isClosest = s.id === closestId, isLocked = s.d > 100;
      el.classList.toggle('closest', isClosest);
      el.classList.toggle('locked', isLocked);
      el.querySelector('.lock').style.display = isLocked ? 'inline' : 'none';

      var label = (walkNo(s) ? t('walkStop', { i: walkNo(s), n: walkStops().length }) + ', ' : '') + st(s).title + ', ' + fmtDist(s.d) + (isLocked ? ', ' + t('locked') : '') + (isClosest ? ', ' + t('closest').replace('📍 ', '') : '');
      if (el._label !== label) { el.setAttribute('aria-label', label); el._label = label; }

      el.style.zIndex = Math.max(1, 90 - Math.floor(s.d / 10));

      var rad = function(d) { return d * Math.PI / 180; };
      var dLon = rad(s.lon - me.lon);
      var y = Math.sin(dLon) * Math.cos(rad(s.lat));
      var x = Math.cos(rad(me.lat)) * Math.sin(rad(s.lat)) - Math.sin(rad(me.lat)) * Math.cos(rad(s.lat)) * Math.cos(dLon);
      var bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

      var angleDiff = bearing - window.currentHeading;
      while (angleDiff < -180) angleDiff += 360;
      while (angleDiff > 180) angleDiff -= 360;

      if (Math.abs(angleDiff) < 70) {
        items.push({ el: el, x: window.innerWidth / 2 + (angleDiff / 70) * (window.innerWidth / 2) });
      } else if (document.activeElement !== el) {
        el.style.display = 'none';
      }
    });

    items.sort(function (a, b) { return a.x - b.x; });
    var baseY = window.innerHeight / 2, minSpacing = 130;

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      it.el.style.display = 'block';
      var ty = baseY;
      if (i > 0 && Math.abs(items[i].x - items[i - 1].x) < minSpacing) ty = baseY + ((i % 2 === 0) ? -55 : 55);
      it.el.style.left = it.x + 'px';
      it.el.style.top = ty + 'px';
    }
  }

  var poiLayers = [], markerCluster = null;
  function addPoiMarker(s) {
    var m = L.marker([s.lat, s.lon], {
      icon: L.divIcon({ html: '<div class="poi-dot"></div>', iconSize: [24, 24], iconAnchor: [12, 12], className: '' }),
      title: st(s).title, alt: st(s).title, keyboard: true
    }).on('click', function () { openStorySheet(s, 'map'); });
    poiLayers.push({ m: m, s: s });
    markerCluster.addLayer(m);
  }
  function initMap() {
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView(STORIES[0] ? [STORIES[0].lat, STORIES[0].lon] : DEFAULT_CENTER, 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    markerCluster = L.markerClusterGroup({ maxClusterRadius: 40, iconCreateFunction: function (c) { return L.divIcon({ html: c.getChildCount(), className: 'map-cluster-dot', iconSize: [32, 32] }); } });
    STORIES.forEach(addPoiMarker);
    map.addLayer(markerCluster);
    renderWalkMap();
    map.on('dragstart', function () { followMe = false; });
  }

  onLangChange(function () {
    poiLayers.forEach(function (p) {
      var el = p.m.getElement();
      if (el) { el.title = st(p.s).title; el.setAttribute('aria-label', st(p.s).title); }
    });
  });

  function updateMap() {
    if (!map || !me) return;
    var ll = [me.lat, me.lon];
    if (!meMarker) {
      meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me-wrap" aria-hidden="true"><div class="me-rot unknown"><div class="me-cone"></div><div class="me-dot"></div></div></div>', iconSize: [56, 56], iconAnchor: [28, 28] }), zIndexOffset: 1000, keyboard: false, interactive: false }).addTo(map);
      accCircle = L.circle(ll, { radius: me.accuracy || 0, color: '#249CCC', weight: 2, fillOpacity: 0.12, interactive: false }).addTo(map);
    } else {
      meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(me.accuracy || 0);
    }
    if (followMe) map.setView(ll, map.getZoom(), { animate: false });
  }

  var cachedRot = null, displayMapHeading = 0;
  function applyHeadingToDot() {
    if (!meMarker || window.currentHeading === null) return;
    if (!cachedRot) { var elm = meMarker.getElement(); if (elm) cachedRot = elm.querySelector('.me-rot'); }
    if (!cachedRot) return;
    cachedRot.classList.remove('unknown');
    var diff = window.currentHeading - (displayMapHeading % 360);
    if (diff > 180) diff -= 360; else if (diff < -180) diff += 360;
    displayMapHeading += diff;
    cachedRot.style.transform = 'rotate(' + displayMapHeading + 'deg)';
  }

  $('handle').addEventListener('click', function () {
    var open = $('drawer').classList.toggle('open');

    if (map) setTimeout(function () { map.invalidateSize(); updateMap(); }, 300);
  });

  function renderStatus() {
    if (gpsFailed && !me) { $('status').textContent = t('gpsError'); return; }
    if (!me) { $('status').textContent = t('waitingFix'); return; }
    $('status').textContent = t('accuracy', { m: Math.round(me.accuracy) }) +

  }

  var lastNearestId = null;
  function renderNearest(announceChange) {
    if (MODE.kind === 'walk') { renderWalkCard(announceChange); return; }
    $('nearest').classList.remove('walk');
    if (!me) return;
    var ranked = STORIES.map(function (s) { return { s: s, d: distanceMetres(me.lat, me.lon, s.lat, s.lon) }; })
                        .sort(function (a, b) { return a.d - b.d; })[0];
    if (!ranked) return;
    var btn = $('nearest');
    var here = ranked.d <= ranked.s.radius;
    btn.querySelector('.dist').textContent = here ? t('youAreHere') : t('mAway', { m: Math.round(ranked.d) });
    btn.querySelector('.name').textContent = st(ranked.s).title;
    btn.classList.add('on');
    btn.onclick = function () { openStorySheet(ranked.s, 'nearest'); };

    var key = ranked.s.id + (here ? ':here' : '');

  }

  var storyLoc = null;     // τοποθεσία ιστορίας από τον χάρτη (αλλιώς το στίγμα GPS)
  // Ιστοσελίδα για υπολογιστή: ίδιο ανέβασμα, χωρίς AR και GPS (η τοποθεσία επιλέγεται πάντα στον χάρτη)
  var WEB = /[?&]web=1\b/.test(location.search);
  var BROWSE = !WEB && /[?&]view=1\b/.test(location.search);    // ιστοσελίδα επισκεπτών
  function renderLoc() {

    $('locDisplay').textContent = storyLoc ? '🗺 ' + t('locFromMap', { c: c(storyLoc) }) : me ? '📍 ' + t('locFromGps', { c: c(me) }) : t(WEB ? 'locNeededWeb' : 'locNeeded');
    $('storyLocGps').disabled = !me || !storyLoc;

  function onPosition(pos) {

  $('startBtn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true; btn.textContent = t('opening');
    (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function' ? DeviceOrientationEvent.requestPermission() : Promise.resolve('granted'))
    .then(function (state) {

    var pos = {}; items.forEach(function (i) { pos[i.story_id] = i; });

  // Επιλογή τρόπου (οθόνη έναρξης και φύλλο «Τρόπος εξερεύνησης»)
  function buildChooser(box, name) {

    function render() {

        sp.appendChild(b); sp.appendChild(sm); l.appendChild(sp); box.appendChild(l); return { l: l, r: r, sp: sp };

  var progressOn = false, lastPctAnnounce = -1;

    }

  function waitForFiniteDuration(media) {
    return new Promise(function (resolve) {
      if (isFinite(media.duration) && media.duration > 0) { resolve(); return; }
      var done = false;
      function finish(force) {
        if (done) return;
        if (!force && !isFinite(media.duration)) return;
        done = true;
        media.removeEventListener('durationchange', onEv);
        media.removeEventListener('timeupdate', onEv);
        try { media.currentTime = 0; } catch (e) {}
        resolve();
      }
      function onEv() { finish(false); }
      media.addEventListener('durationchange', onEv);
      media.addEventListener('timeupdate', onEv);
      try { media.currentTime = 1e7; } catch (e) {}
      setTimeout(function () { finish(true); }, 3000);
    });
  }

  function inRanges(ranges, tm, key) {
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      if ((!key || r[key]) && tm >= r.s && tm < r.e) return true;
    }
    return false;
  }

  function pickInterval(d) {
    if (d > 120) return 30;
    if (d > 60) return 15;
    if (d > 20) return 5;
    if (d > 10) return 2;
    return 1;
  }

  // --- Θόλωμα (με υποστήριξη iOS) ---
  var _filterSupported = null;
  function supportsCanvasFilter() {
    if (_filterSupported !== null) return _filterSupported;
    try {
      var c = document.createElement('canvas'); c.width = 5; c.height = 5;
      var x = c.getContext('2d');
      if (!('filter' in x)) return (_filterSupported = false);
      x.fillStyle = '#000'; x.fillRect(0, 0, 5, 5);
      x.filter = 'blur(2px)';
      x.fillStyle = '#fff'; x.fillRect(2, 2, 1, 1);
      _filterSupported = x.getImageData(1, 2, 1, 1).data[0] > 0;
    } catch (e) { _filterSupported = false; }
    return _filterSupported;
  }

  function buildBlurSource(src, dst) {
    var w = src.width, h = src.height;
    dst.width = w; dst.height = h;
    var dctx = dst.getContext('2d');
    if (supportsCanvasFilter()) {
      dctx.filter = 'blur(16px)'; dctx.drawImage(src, 0, 0); dctx.filter = 'none';
      return;
    }
    var target = Math.max(8, Math.round(w / 20));
    var steps = [], cur = src, cw = w, ch = h;
    while (cw / 2 >= target) {
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(cw / 2)); c.height = Math.max(1, Math.round(ch / 2));
      var cc = c.getContext('2d');
      cc.imageSmoothingEnabled = true; cc.imageSmoothingQuality = 'high';
      cc.drawImage(cur, 0, 0, c.width, c.height);
      steps.push(c); cur = c; cw = c.width; ch = c.height;
    }
    for (var i = steps.length - 2; i >= 0; i--) {
      var up = steps[i], uc = up.getContext('2d');
      uc.imageSmoothingEnabled = true; uc.imageSmoothingQuality = 'high';
      uc.clearRect(0, 0, up.width, up.height);
      uc.drawImage(cur, 0, 0, up.width, up.height);
      cur = up;
    }
    dctx.imageSmoothingEnabled = true; dctx.imageSmoothingQuality = 'high';
    dctx.drawImage(cur, 0, 0, w, h);
  }

  function blurDot(tctx, src, x, y, r) {
    tctx.save();
    tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI * 2); tctx.clip();
    tctx.drawImage(src, 0, 0);
    tctx.restore();
  }

  function paintStrokes(tctx, src, strokes, w, h) {
    strokes.forEach(function (g) { g.forEach(function (p) { blurDot(tctx, src, p.x * w, p.y * h, p.r * w); }); });
  }

  function redrawImage() {
    if (!imgObj) return;
    ctx.drawImage(imgObj, 0, 0, canvas.width, canvas.height);
    paintStrokes(ctx, blurSrc, imgStrokes, canvas.width, canvas.height);
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error(t('errImage'))); };
      im.src = url;
    });
  }

  async function renderImageFinal(file, strokes) {
    var im = await loadImage(file);
    var k = Math.min(1, MAX_IMAGE_W / im.width);
    var c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    var cctx = c.getContext('2d', { alpha: false });
    cctx.drawImage(im, 0, 0, c.width, c.height);
    if (strokes && strokes.length) {
      var bs = document.createElement('canvas');
      buildBlurSource(c, bs);
      paintStrokes(cctx, bs, strokes, c.width, c.height);
    }
    return await new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.82); });
  }

  function updateSliderAria(el, media) {

  function sliderKeys(media, e) {
    var d = media.duration;
    if (!isFinite(d) || d <= 0) return;
    var step = e.shiftKey ? 5 : 1, nt = null;
    switch (e.key) {
      case 'ArrowRight': case 'ArrowUp': nt = media.currentTime + step; break;
      case 'ArrowLeft': case 'ArrowDown': nt = media.currentTime - step; break;
      case 'PageUp': nt = media.currentTime + 10; break;
      case 'PageDown': nt = media.currentTime - 10; break;
      case 'Home': nt = 0; break;
      case 'End': nt = d; break;
      case ' ': case 'Enter':
        e.preventDefault();
        if (media.paused) media.play(); else media.pause();
        return;
      default: return;
    }
    e.preventDefault();
    media.currentTime = Math.max(0, Math.min(d, nt));

  // --- Timeline βίντεο ---
  function drawTicks(gctx, width, height, duration, topOffset, labelY) {
    var interval = pickInterval(duration);
    gctx.fillStyle = 'rgba(242, 237, 228, 0.9)';
    gctx.font = '11px monospace';
    gctx.textBaseline = 'top';
    for (var tt = 0; tt <= duration; tt += interval) {
      var x = (tt / duration) * width;
      gctx.textAlign = x < 10 ? 'left' : (x > width - 15 ? 'right' : 'center');
      gctx.fillText(tt + 's', x, labelY);
      gctx.fillStyle = 'rgba(242, 237, 228, 0.15)';
      gctx.fillRect(x, topOffset, 1, height - topOffset);
      gctx.fillStyle = 'rgba(242, 237, 228, 0.9)';
    }
  }

  function updateVideoTimeline() {
    cachedVideoRanges = readVideoRanges();
    applyVideoFx();

    var timeline = $('videoTimeline');
    timeline.innerHTML = '';
    var duration = $('videoPreview').duration;
    if (!isFinite(duration) || duration <= 0) return;

    var gc = $('videoGridCanvas'), gctx = gc.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = gc.getBoundingClientRect();
    var width = rect.width || gc.parentElement.clientWidth || 300, height = rect.height || 60;
    gc.width = width * dpr; gc.height = height * dpr;
    gctx.scale(dpr, dpr);
    gctx.clearRect(0, 0, width, height);
    var topOffset = 18;
    drawTicks(gctx, width, height, duration, topOffset, 4);

    cachedVideoRanges.forEach(function (r) {
      var leftPct = Math.max(0, Math.min(100, (r.s / duration) * 100));
      var widthPct = Math.max(0, Math.min(100 - leftPct, ((r.e - r.s) / duration) * 100));
      ['blur', 'mute'].forEach(function (kind) {
        if (!r[kind]) return;
        var b = document.createElement('div');
        b.className = 'timeline-block ' + kind;
        b.style.left = leftPct + '%'; b.style.width = widthPct + '%'; b.style.top = topOffset + 'px';
        timeline.appendChild(b);
      });
    });
  }

  function drawWaveform(buffer) {
    var wc = $('audioWaveCanvas'), wctx = wc.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = wc.getBoundingClientRect();
    var width = rect.width || wc.parentElement.clientWidth || 300, height = rect.height || 90;
    wc.width = width * dpr; wc.height = height * dpr;
    wctx.scale(dpr, dpr);
    wctx.clearRect(0, 0, width, height);

    var topOffset = 16, waveH = height - topOffset;
    wctx.fillStyle = 'rgba(124, 202, 235, 0.25)';
    wctx.fillRect(0, topOffset + waveH / 2 - 1, width, 2);
    wctx.fillStyle = '#7CCAEB';

    var data = buffer.getChannelData(0);
    var step = Math.ceil(data.length / width), amp = waveH / 2;
    for (var i = 0; i < width; i++) {
      var min = 1, max = -1, start = i * step, end = Math.min(start + step, data.length);
      for (var j = start; j < end; j++) { var d = data[j]; if (d < min) min = d; if (d > max) max = d; }
      var y1 = topOffset + (1 + min) * amp, y2 = topOffset + (1 + max) * amp;
      wctx.fillRect(i, y1, 1, Math.max(1, y2 - y1));
    }
    if (isFinite(buffer.duration) && buffer.duration > 0) drawTicks(wctx, width, height, buffer.duration, topOffset - 2, 2);
  }

  // --- Ζωντανή προεπισκόπηση εφέ ---
  function applyVideoFx() {
    if ($('videoEditor').style.display === 'none') return;
    var vid = $('videoPreview'), tm = vid.currentTime || 0;
    var blur = inRanges(cachedVideoRanges, tm, 'blur'), mute = inRanges(cachedVideoRanges, tm, 'mute');
    var f = blur ? 'blur(18px)' : 'none';
    if (vid.style.filter !== f) { vid.style.filter = f; vid.style.webkitFilter = f; }
    if (vid.muted !== mute) vid.muted = mute;
    var parts = [];
    if (blur) parts.push(t('blur'));
    if (mute) parts.push(t('mute'));
    var badge = $('vidFxBadge');
    var txt = parts.length ? t('previewFx', { fx: parts.join(' + ') }) : '';
    if (badge.textContent !== txt) badge.textContent = txt;
    badge.classList.toggle('on', parts.length > 0);
  }

  function applyAudioFx() {
    if ($('audioEditor').style.display === 'none') return;
    var aud = $('audioPreview');
    var mute = inRanges(cachedAudioRanges, aud.currentTime || 0);

  // ---- Συναίνεση πριν από κάθε καταγραφή: δημιουργεί κωδικό (από το id της εγγραφής) που γράφεται στο έντυπο ----
  var activeConsent = null;                       // { id, code } της συναίνεσης που ισχύει για το ανέβασμα που ετοιμάζεται
  var CONSENT_VERSION = 'v1';
  var CODE_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // χωρίς 0/O, 1/I/L για να διαβάζεται εύκολα

  function consentCodeFor(uuid) {
    var n = BigInt('0x' + uuid.replace(/-/g, '').slice(0, 10)), out = '', base = BigInt(CODE_ALPHA.length);
    for (var i = 0; i < 8; i++) { out = CODE_ALPHA[Number(n % base)] + out; n = n / base; }
    return 'WM-' + out.slice(0, 4) + '-' + out.slice(4);
  }

  async function createConsent(accepted) {
    for (var tries = 0; tries < 4; tries++) {
      var id = crypto.randomUUID(), code = consentCodeFor(id);
      var r = await sb.from('consents').insert({ id: id, code: code, statement_version: CONSENT_VERSION, lang: LANG, accepted: accepted }).select('id,code').single();
      if (!r.error) return r.data;
      if (r.error.code !== '23505') throw r.error;     // μόνο σύγκρουση κωδικού ξαναδοκιμάζεται
    }
    throw new Error('code collision');
  }

  async function copyText(text, btn) {
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
    if (!ok) {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
    }
    if (btn) {
      var old = btn.textContent; btn.textContent = ok ? t('consentCopied') : old;
      setTimeout(function () { btn.textContent = t('consentCopy'); }, 1800);
    }
    return ok;
  }

  function consentBoxes() { return Array.prototype.slice.call(document.querySelectorAll('.consent-cb')); }
  function consentShowCode(c) {

  // --- Πινέλο θολώματος (αφή/ποντίκι) ---
  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cX = (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX;
    var cY = (e.touches && e.touches.length) ? e.touches[0].clientY : e.clientY;
    return { x: (cX - rect.left) * canvas.width / rect.width, y: (cY - rect.top) * canvas.height / rect.height };
  }

  function brushR() { return Math.max(BRUSH_MIN, canvas.width * BRUSH_FRAC); }

  function addStrokePoint(pos) {
    var w = canvas.width, h = canvas.height, r = brushR();
    var last = curStroke.length ? curStroke[curStroke.length - 1] : null;
    var pts = [];
    if (last) {
      var lx = last.x * w, ly = last.y * h;
      var n = Math.floor(Math.hypot(pos.x - lx, pos.y - ly) / (r / 2));
      for (var i = 1; i <= n; i++) pts.push({ x: lx + (pos.x - lx) * i / (n + 1), y: ly + (pos.y - ly) * i / (n + 1) });
    }
    pts.push(pos);
    pts.forEach(function (p) {
      curStroke.push({ x: p.x / w, y: p.y / h, r: r / w });
      blurDot(ctx, blurSrc, p.x, p.y, r);
    });
  }

  function handleDrawStart(e) {
    if (!imgObj) return;
    e.preventDefault();
    isDrawing = true;

    addStrokePoint(getCanvasPos(e));
  }
  function handleDrawMove(e) { if (!isDrawing) return; e.preventDefault(); addStrokePoint(getCanvasPos(e)); }
  function handleDrawEnd() { isDrawing = false; curStroke = null; }

  canvas.addEventListener('touchstart', handleDrawStart, { passive: false });
  canvas.addEventListener('touchmove', handleDrawMove, { passive: false });
  canvas.addEventListener('touchend', handleDrawEnd);
  canvas.addEventListener('touchcancel', handleDrawEnd);
  canvas.addEventListener('mousedown', handleDrawStart);
  canvas.addEventListener('mousemove', handleDrawMove);
  canvas.addEventListener('mouseup', handleDrawEnd);
  canvas.addEventListener('mouseleave', handleDrawEnd);

  // --- Πινέλο με πληκτρολόγιο (WCAG 2.1.1) ---
  function placeKbCursor() {
    var cur = $('kbCursor');
    var cw = canvas.clientWidth, chh = canvas.clientHeight;
    if (!cw || !canvas.width) return;
    var d = (brushR() / canvas.width) * cw * 2;
    cur.style.width = d + 'px';
    cur.style.height = d + 'px';
    cur.style.left = (canvas.offsetLeft + kbPos.x * cw) + 'px';
    cur.style.top = (canvas.offsetTop + kbPos.y * chh) + 'px';
  }

  canvas.addEventListener('focus', function () {

  });
  canvas.addEventListener('blur', function () { $('kbCursor').style.display = 'none'; });

  canvas.addEventListener('keydown', function (e) {
    if (!imgObj) return;
    var step = e.shiftKey ? 0.1 : 0.02, handled = true;
    switch (e.key) {
      case 'ArrowLeft': kbPos.x = Math.max(0, kbPos.x - step); break;
      case 'ArrowRight': kbPos.x = Math.min(1, kbPos.x + step); break;
      case 'ArrowUp': kbPos.y = Math.max(0, kbPos.y - step); break;
      case 'ArrowDown': kbPos.y = Math.min(1, kbPos.y + step); break;
      case 'Enter': case ' ':

  // --- Τελική επεξεργασία βίντεο ---
  function loadProcVideo(video, url) {
    return new Promise(function (resolve, reject) {
      var tmo = setTimeout(function () { reject(new Error(t('errVideoTimeout'))); }, 15000);
      video.onloadedmetadata = function () { clearTimeout(tmo); video.onloadedmetadata = null; video.onerror = null; resolve(); };
      video.onerror = function () { clearTimeout(tmo); video.onerror = null; reject(new Error(t('errVideoLoad'))); };
      video.src = url;
      video.load();
    });
  }

  async function processVideoFile(file, ranges, onProg) {
    if (!window.MediaRecorder) throw new Error(t('errNoRec'));
    var video = $('procVideo');
    video.muted = false;
    var url = URL.createObjectURL(file);
    try {
      await loadProcVideo(video, url);
      await waitForFiniteDuration(video);
      return await recordProcessedVideo(video, ranges, onProg);
    } finally {
      try { video.pause(); } catch (e) {}
      video.removeAttribute('src');
      video.load();
      URL.revokeObjectURL(url);
    }
  }

  function recordProcessedVideo(video, ranges, onProg) {
    return new Promise(function (resolve, reject) {
      var mime = [
        'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus',
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm'
      ].filter(function (ty) { try { return MediaRecorder.isTypeSupported(ty); } catch (e) { return false; } })[0];
      if (!mime) { reject(new Error(t('errNoRec'))); return; }

      var blurRanges = ranges.filter(function (r) { return r.blur; });
      var muteRanges = ranges.filter(function (r) { return r.mute; });

      var vw = video.videoWidth || 640, vh = video.videoHeight || 480;
      var k = Math.min(1, MAX_VIDEO_W / vw);
      var ow = Math.max(2, Math.round(vw * k / 2) * 2), oh = Math.max(2, Math.round(vh * k / 2) * 2);

      var oCanvas = document.createElement('canvas');
      oCanvas.width = ow; oCanvas.height = oh;
      var oCtx = oCanvas.getContext('2d', { alpha: false });
      oCtx.imageSmoothingEnabled = true;

      var scratch = document.createElement('canvas');
      var tw = 24, th = Math.max(1, Math.round(tw * vh / vw));
      scratch.width = tw; scratch.height = th;
      var sctx = scratch.getContext('2d', { alpha: false });
      sctx.imageSmoothingEnabled = true;

      var pa;
      try { pa = getProcAudio(); } catch (e) { reject(new Error('Audio: ' + e.message)); return; }
      var audioCtx = pa.ctx, gainNode = pa.gain;
      var destNode = audioCtx.createMediaStreamDestination();
      gainNode.connect(destNode);
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);

      function cleanupAudio() {
        try { gainNode.disconnect(destNode); } catch (e) {}
        gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      }

      var vTracks = oCanvas.captureStream(30).getVideoTracks();
      var stream = new MediaStream(vTracks.concat(destNode.stream.getAudioTracks()));

      var rec;
      try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: VIDEO_BITRATE }); }
      catch (e) { cleanupAudio(); reject(new Error('MediaRecorder: ' + e.message)); return; }

      var chunks = [], running = true, finished = false, lastUI = 0;
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        if (finished) return; finished = true;
        running = false;
        try { video.pause(); } catch (e) {}
        video.onended = null;
        vTracks.forEach(function (tr) { try { tr.stop(); } catch (e) {} });
        cleanupAudio();
        resolve(new Blob(chunks, { type: mime.split(';')[0] }));
      };

      function drawFrame() {
        if (inRanges(blurRanges, video.currentTime)) {
          sctx.drawImage(video, 0, 0, tw, th);
          oCtx.drawImage(scratch, 0, 0, tw, th, 0, 0, ow, oh);
        } else {
          oCtx.drawImage(video, 0, 0, ow, oh);
        }
      }

      function nextFrame(fn) {
        if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(function () { fn(); });
        else requestAnimationFrame(fn);
      }

      function loop() {
        if (!running) return;
        drawFrame();
        gainNode.gain.setValueAtTime(inRanges(muteRanges, video.currentTime) ? 0 : 1, audioCtx.currentTime);
        var now = performance.now();
        if (now - lastUI > 250) {
          lastUI = now;
          if (isFinite(video.duration) && video.duration > 0 && onProg) {
            onProg(video.currentTime / video.duration * 100, Math.round(video.currentTime) + 's / ' + Math.round(video.duration) + 's');
          }
        }
        nextFrame(loop);
      }

      function stopAll() { if (rec.state !== 'inactive') rec.stop(); }

      function seekToStart() {
        return new Promise(function (res) {
          var done = false, go = function () { if (!done) { done = true; res(); } };
          if (video.readyState >= 2 && video.currentTime < 0.05) { go(); return; }
          video.addEventListener('seeked', go, { once: true });
          video.currentTime = 0;
          setTimeout(go, 1200);
        });
      }

      if (onProg) onProg(0, t('warmup'));

      seekToStart().then(function () {
        return Promise.resolve(video.play());
      }).then(function () {
        if (audioCtx.state === 'suspended') return audioCtx.resume();
      }).then(function () {
        var primed = 0;
        (function prime() {
          drawFrame();
          if (++primed < 4) { nextFrame(prime); return; }
          video.onended = stopAll;
          rec.start(1000);
          loop();
        })();
      }).catch(function (err) {
        running = false;
        cleanupAudio();
        reject(new Error(t('errPlayback') + (err && err.message ? err.message : err)));
      });
    });
  }

  // --- Τελική επεξεργασία ήχου ---
  function processAudioLocal(file, mRanges) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error(t('errFileRead'))); };
      reader.onload = async function (e) {
        try {
          var aCtx = new (window.AudioContext || window.webkitAudioContext)();
          var aBuf = await new Promise(function (res, rej) { aCtx.decodeAudioData(e.target.result, res, rej); });
          aCtx.close();

          var oCtx = new OfflineAudioContext(aBuf.numberOfChannels, aBuf.length, aBuf.sampleRate);
          var src = oCtx.createBufferSource(); src.buffer = aBuf;
          var gain = oCtx.createGain(); gain.gain.setValueAtTime(1, 0);
          mRanges.forEach(function (r) {
            gain.gain.setValueAtTime(1, Math.max(0, r.s - 0.01));
            gain.gain.setValueAtTime(0, r.s);
            gain.gain.setValueAtTime(0, r.e);
            gain.gain.setValueAtTime(1, r.e + 0.01);
          });
          src.connect(gain); gain.connect(oCtx.destination); src.start(0);

          var renBuf = await oCtx.startRendering();
          var numCh = renBuf.numberOfChannels, len = renBuf.length * numCh * 2 + 44;
          var buf = new ArrayBuffer(len), view = new DataView(buf), pos = 0;
          var set16 = function (d) { view.setUint16(pos, d, true); pos += 2; };
          var set32 = function (d) { view.setUint32(pos, d, true); pos += 4; };

          set32(0x46464952); set32(len - 8); set32(0x45564157); set32(0x20746d66); set32(16); set16(1); set16(numCh);
          set32(renBuf.sampleRate); set32(renBuf.sampleRate * 2 * numCh); set16(numCh * 2); set16(16); set32(0x61746164); set32(len - pos - 4);

          var chs = [];
          for (var i = 0; i < numCh; i++) chs.push(renBuf.getChannelData(i));
          for (var off = 0; off < renBuf.length; off++) {
            for (var c = 0; c < numCh; c++) {
              var smp = Math.max(-1, Math.min(1, chs[c][off]));
              set16((smp < 0 ? smp * 32768 : smp * 32767) | 0);
            }
          }
          resolve(new Blob([buf], { type: 'audio/wav' }));
        } catch (err) { reject(err); }
      };
      reader.readAsArrayBuffer(file);
    });
  }

    // χάρτης
    if (browseLayer) browseMap.removeLayer(browseLayer);
    browseLayer = w ? L.layerGroup() : (L.markerClusterGroup ? L.markerClusterGroup({ maxClusterRadius: 40, iconCreateFunction: function (c) { return L.divIcon({ html: c.getChildCount(), className: 'map-cluster-dot', iconSize: [32, 32] }); } }) : L.layerGroup());
    if (w && list.length > 1) L.polyline(all.map(function (x) { return [x.lat, x.lon]; }), { color: '#186078', weight: 4, opacity: .7, dashArray: '8 8', interactive: false }).addTo(browseLayer);
    list.forEach(function (x) {
      var n = all.indexOf(x) + 1, name = (w ? n + '. ' : '') + st(x).title;
      var icon = w ? L.divIcon({ className: '', html: '<div class="walk-pin">' + n + '</div>', iconSize: [30, 30], iconAnchor: [15, 15] })
                   : L.divIcon({ html: '<div class="poi-dot"></div>', iconSize: [24, 24], iconAnchor: [12, 12], className: '' });
      var mk = L.marker([x.lat, x.lon], { icon: icon, title: name, alt: name, keyboard: true }).on('click', function () { openStorySheet(x, 'map'); });
      browseLayer.addLayer(mk);
    });
    browseMap.addLayer(browseLayer);
    // Συνδέσεις όλων των διαδρομών ανάμεσα στις ιστορίες που φαίνονται (μόνο στην προβολή «Όλες οι ιστορίες»)
    $('browseConnWrap').hidden = !!w || !WALKS.some(function (x) { return x.links && x.links.length; });
    if (connLayer) { browseMap.removeLayer(connLayer); connLayer = null; }
    if (!w && $('browseConn').checked) {
      connLayer = L.layerGroup(); var shown = {}, drawn = {};
      list.forEach(function (x) { shown[x.dbId] = x; });
      WALKS.forEach(function (wk) {
        (wk.links || []).forEach(function (l) {
          var A = shown[l.from], B = shown[l.to], k2 = l.from + '>' + l.to; if (!A || !B || drawn[k2]) return; drawn[k2] = 1;
          var pl = L.polyline([[A.lat, A.lon], [B.lat, B.lon]], { color: '#7B1FA2', weight: 3, opacity: .7, dashArray: '6 6' });
          var tip = st(A).title + ' → ' + st(B).title + ' · ' + wk.title + (l.label ? ' · “' + l.label + '”' : '');
          if (pl.bindTooltip) pl.bindTooltip(tip, { sticky: true });
          connLayer.addLayer(pl);
        });
      });
      browseMap.addLayer(connLayer);
    }
    var key = (w ? w.id : 'all') + ':' + all.length;
    if (!keepView && key !== browseFitKey && list.length) {
      browseFitKey = key;
      var pts = list.map(function (x) { return [x.lat, x.lon]; });
      if (pts.length === 1) browseMap.setView(pts[0], 16); else browseMap.fitBounds(pts, { padding: [40, 40], maxZoom: 17 });
    }
    setTimeout(function () { browseMap.invalidateSize(); }, 50);
  }

  function renderWeb() {
    if (!WEB) return;
    var inn = !!currentUser;
    $('webHello').textContent = inn ? t('webHelloIn', { n: userName(currentUser) }) : t('webHelloOut');
    $('webUser').textContent = inn ? userName(currentUser) + ' (' + t('role_' + currentRole) + ')' : '';
    $('webAuthBtn').textContent = t(inn ? 'logout' : 'login'); $('webAuthBtn').hidden = !sb;
    $('webActions').hidden = !inn; $('webLoginBtn').hidden = inn || !sb;
  }
  $('webAuthBtn').onclick = $('webLoginBtn').onclick = function () { $('authBtnGate').onclick(); };
  $('webNewBtn').onclick = function () { $('addBtn').onclick(); };
  $('webMineBtn').onclick = function () { $('listBtn').onclick(); };
  $('langWeb').addEventListener('change', function () { setLang(this.value); });
  onLangChange(function () { $('langWeb').value = LANG; renderWeb(); });
  setLang(LANG);
  updateMediaListUI();
  renderLoc();
})();
</script>
</body>
</html>
