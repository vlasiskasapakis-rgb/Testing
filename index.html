<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<!-- WCAG 1.4.4: επιτρέπεται η μεγέθυνση (αφαιρέθηκαν user-scalable/maximum-scale) -->
<meta name="theme-color" content="#186078" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Test</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

<style>
  :root {
    /* Χρώματα από το logo Walking Memory */
    --petrol: #186078;       /* κύριο: κείμενο, κουμπιά */
    --petrol-deep: #0E3F50;  /* σκούρες επιφάνειες */
    --sky: #249CCC;          /* γραμμές, περιγράμματα, εστίαση */
    --sky-soft: #E7F4FA;
    --sky-light: #7CCAEB;    /* κείμενο πάνω σε σκούρο */
    --amber: #E0904F;        /* το «μονοπάτι» — έμφαση */
    --amber-text: #9A5413;   /* πορτοκαλί για μικρό κείμενο σε λευκό */
    --ink: #12303B;
    --paper: #FFFFFF;
    --mist: #F2F7F9;
    --line: #D3E3EA;
    --line-strong: #6F8D99;  /* όρια πεδίων (≥3:1) */
    --danger: #B3261E;
    --muted: #4B6470;
    --brand-path: linear-gradient(90deg, #E0904F 0%, #249CCC 55%, #186078 100%);
    /* ψευδώνυμα για inline styles */
    --chalk: var(--amber); --bone: #fff; --sea-dark: var(--petrol); --sea-light: var(--sky-light);
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
    --pad: 16px;
    --handle: calc(56px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: var(--petrol-deep); color: var(--ink);
    font-family: var(--font); font-size: 17px; line-height: 1.5;
  }
  button, input, select { font-family: inherit; }
  button { font-size: inherit; cursor: pointer; border: 0; border-radius: 999px; }
  h1, h2 { font-style: italic; font-weight: 700; color: var(--petrol); letter-spacing: -0.01em; line-height: 1.15; }

  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(255,255,255,.85); }

  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  a-scene, a-scene .a-canvas { position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important; z-index: 0; }
  body.editing a-scene, body.editing a-scene .a-canvas { visibility: hidden !important; }

  /* ---------- Ετικέτες AR ---------- */
  #ar-overlay-container { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .ar-html-marker {
    position: absolute; transform: translate(-50%, -50%);
    background: rgba(255,255,255,.96); color: var(--ink);
    border-left: 4px solid var(--sky); border-radius: 12px;
    padding: 8px 12px; width: 184px; min-height: 44px; text-align: left;
    box-shadow: 0 6px 18px rgba(14,63,80,.35);
    pointer-events: auto;
    transition: left .15s ease-out, top .15s ease-out, transform .2s ease-out, box-shadow .2s ease-out;
  }
  .ar-html-marker.locked { opacity: .85; filter: grayscale(.7); border-left-color: var(--line-strong) !important; }
  .ar-html-marker.closest { z-index: 100 !important; border-left-color: var(--amber); transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 10px 24px rgba(14,63,80,.45); }
  .closest-badge {
    position: absolute; top: -12px; right: -8px; display: none; pointer-events: none;
    background: var(--amber); color: var(--ink); font-size: 12px; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .ar-html-marker.closest .closest-badge { display: block; }
  .ar-html-marker .m-title { display: block; font-size: 15px; font-weight: 700; font-style: italic; color: var(--petrol); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-html-marker .m-sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-html-marker .m-dist { display: block; font-size: 12px; font-weight: 600; color: var(--amber-text); }

  /* ---------- Αρχική οθόνη ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 40; overflow: hidden auto;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    background: var(--paper); color: var(--ink);
  }
  .gate-path { position: absolute; top: 0; right: -18%; width: 78%; height: 100%; opacity: .16; pointer-events: none; z-index: 0; }
  .gate-logo, .gate-body { position: relative; z-index: 1; }
  .gate-logo img { height: 56px; width: auto; display: block; }
  .gate-body { max-width: 34rem; }
  #gate h1 { font-size: 32px; margin: 0 0 14px; }
  #gate p { color: var(--muted); margin: 0; }
  .rule { height: 4px; width: 72px; border-radius: 2px; background: var(--brand-path); margin: 0 0 18px; }
  #startBtn {
    margin-top: 24px; width: 100%; padding: 17px; min-height: 56px;
    background: var(--petrol); color: #fff; font-size: 18px; font-weight: 700; font-style: italic;
    box-shadow: 0 8px 20px rgba(24,96,120,.3);
  }
  #startBtn:disabled { opacity: .7; }
  .gate-lang { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .gate-lang label { font-size: 15px; font-weight: 600; color: var(--petrol); }

  .lang-select {
    font-size: 16px; font-weight: 600; padding: 8px 14px; min-height: 44px;
    border-radius: 999px; border: 2px solid var(--line-strong);
    background: #fff; color: var(--petrol);
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; }
  #hud.on { display: block; }
  #status {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top)); left: var(--pad); right: var(--pad);
    padding: 9px 16px; border-radius: 999px;
    background: rgba(255,255,255,.94); color: var(--petrol); font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #langWrap { position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 54px); right: var(--pad); pointer-events: auto; }
  #langWrap .lang-select { box-shadow: 0 4px 14px rgba(14,63,80,.25); }

  /* ---------- Χάρτης ---------- */
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; height: 52%; z-index: 15; display: flex; flex-direction: column; transform: translateY(calc(100% - var(--handle))); transition: transform .28s cubic-bezier(.32,.72,0,1); }
  #drawer.open { transform: translateY(0); }
  #handle {
    position: relative; flex: none; height: var(--handle); width: 100%;
    display: flex; align-items: center; gap: 12px; padding: 0 20px env(safe-area-inset-bottom);
    background: #fff; color: var(--petrol); border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 18px rgba(14,63,80,.2); pointer-events: auto; touch-action: none;
  }
  #handle::before { content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; border-radius: 0 0 4px 4px; background: var(--brand-path); }
  #handle .grip { width: 34px; height: 4px; border-radius: 2px; background: #9FB6C0; flex: none; }
  #handle .lbl { font-size: 16px; font-weight: 700; font-style: italic; }
  #map { position: relative; flex: 1; background: var(--mist); pointer-events: auto; }
  .leaflet-container { background: var(--mist); font-family: inherit; }
  .map-cluster-dot { background: var(--petrol); color: #fff; border: 3px solid #fff; border-radius: 50%; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  #compass { position: absolute; top: 12px; right: 10px; z-index: 500; width: 54px; height: 54px; border-radius: 50%; background: #fff; color: var(--petrol); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(14,63,80,.3); }
  #compass .needle { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #compass .needle::before { content: ''; position: absolute; left: 50%; top: 6px; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 14px solid var(--amber); }
  #compass .needle::after { content: ''; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 14px solid rgba(24,96,120,.3); }

  #nearest {
    position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--handle) + var(--pad));
    display: none; width: calc(100% - var(--pad) * 2); text-align: left; padding: 14px 18px;
    background: #fff; color: var(--ink); border-radius: 16px; border-left: 6px solid var(--amber);
    box-shadow: 0 8px 22px rgba(14,63,80,.3); pointer-events: auto; transition: bottom .28s;
  }
  #nearest.on { display: block; }
  body.drawer-open #nearest { bottom: calc(52% + var(--pad)); }
  #nearest .dist { display: block; font-size: 14px; font-weight: 600; color: var(--amber-text); }
  #nearest .name { display: block; font-size: 20px; font-weight: 700; font-style: italic; color: var(--petrol); }

  .me-wrap { position: relative; width: 56px; height: 56px; }
  .me-rot { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .me-cone { position: absolute; left: 50%; bottom: 50%; transform: translateX(-50%); border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid rgba(36,156,204,.55); }
  .me-rot.unknown .me-cone { display: none; }
  .me-dot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: var(--sky); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--petrol); }
  .poi-dot { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid var(--petrol); margin: 4px; }

  #addBtn {
    position: fixed; bottom: calc(var(--handle) + var(--pad) + 76px); right: var(--pad); z-index: 25;
    width: 58px; height: 58px; display: none; align-items: center; justify-content: center;
    background: var(--petrol); color: #fff; font-size: 32px; font-weight: 400;
    border: 3px solid #fff; box-shadow: 0 6px 16px rgba(14,63,80,.4); pointer-events: auto;
  }
  #addBtn.on { display: flex; }
  body.drawer-open #addBtn { bottom: calc(52% + var(--pad)); }

  #authBtn {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 54px); left: var(--pad); pointer-events: auto;
    padding: 8px 16px; min-height: 44px; font-size: 15px; font-weight: 700;
    background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #authBtn[hidden] { display: none; }
  .story-media { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 6px; }
  .story-media img, .story-media video { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; background: #000; }
  .story-media audio { width: 100%; }
  .story-author { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .input-group input[type="email"], .input-group input[type="password"] { width: 100%; padding: 12px 14px; border: 2px solid var(--line-strong); border-radius: 12px; font-size: 16px; color: var(--ink); }
  #authSheet { z-index: 70; }
  .link-btn { background: none; color: var(--petrol); text-decoration: underline; font-weight: 600; padding: 8px 4px; min-height: 44px; border-radius: 8px; }

  .story-know { margin: 8px 0; }
  .story-know h3, .ann-media h3 { margin: 14px 0 6px; font-size: 16px; font-style: italic; color: var(--petrol); }
  .story-know details { margin: 6px 0; } .story-know summary { cursor: pointer; font-weight: 600; color: var(--petrol); min-height: 32px; }
  .story-know pre { white-space: pre-wrap; font-family: inherit; font-size: 15px; background: var(--mist); border-radius: 10px; padding: 10px; }
  .term-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .term-list li { background: var(--sky-soft); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .term-list a { color: var(--petrol); font-weight: 600; }
  .vocab-tag { font-size: 11px; font-weight: 700; color: var(--amber-text); margin-left: 6px; text-transform: uppercase; }
  #sheetTools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; } #sheetTools[hidden] { display: none; }
  #annSheet { z-index: 65; }
  .img-frame { position: relative; line-height: 0; }
  .story-media .img-frame img, .ann-media .img-frame img { width: 100%; height: auto; max-height: none; display: block; border-radius: 12px; background: #000; }
  .region-layer { position: absolute; inset: 0; pointer-events: none; }
  .region-layer.drawing { pointer-events: auto; cursor: crosshair; touch-action: none; outline: 3px solid var(--amber); }
  .region-box { position: absolute; box-sizing: border-box; pointer-events: none; border: 3px solid var(--amber); box-shadow: 0 0 0 1px rgba(255,255,255,.9) inset, 0 0 0 1px rgba(0,0,0,.45); }
  .region-box.suggested { border-style: dashed; }
  .img-terms { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .term-row label { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; min-height: 40px; }
  .term-row input[type=checkbox] { width: 22px; height: 22px; }
  .badge-sug { font-size: 12px; font-weight: 700; color: var(--amber-text); }
  #listBtn {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top) + 108px); left: var(--pad); pointer-events: auto;
    padding: 8px 16px; min-height: 44px; font-size: 15px; font-weight: 700;
    background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); box-shadow: 0 4px 14px rgba(14,63,80,.25);
  }
  #listBtn[hidden] { display: none; }
  .story-status { font-size: 13px; font-weight: 700; color: var(--amber-text); margin: 0 0 6px; } .story-status:empty { display: none; }
  .list-item { display: block; width: 100%; text-align: left; border-radius: 14px; background: var(--mist); color: var(--ink); padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); }
  .list-item .t { display: block; font-weight: 700; color: var(--petrol); font-style: italic; }
  .list-item .m { display: block; font-size: 13px; color: var(--muted); }
  .chip-draft { color: var(--amber-text); font-weight: 700; } .chip-pub { color: var(--petrol); font-weight: 700; }
  .sync-stage { border: 3px solid var(--amber); border-radius: 16px; padding: 10px; background: #fff; }
  .sync-stage[hidden] { display: none; }
  .sync-stage h3, .link-strip-h { margin: 0 0 6px; font-size: 15px; font-style: italic; color: var(--petrol); }
  .link-strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .link-card { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--sky-soft); color: var(--petrol); font-weight: 700; font-size: 14px; border: 2px solid transparent; min-height: 48px; }
  .link-card img { width: 44px; height: 36px; object-fit: cover; border-radius: 8px; }
  .link-card.active { border-color: var(--amber); }
  .tr-lines { list-style: none; margin: 6px 0 0; padding: 0; }
  .tr-line { display: block; width: 100%; text-align: left; background: none; color: var(--ink); border-radius: 8px; padding: 6px 8px; font-size: 15px; border: 0; }
  .tr-line .when { font-weight: 700; color: var(--amber-text); margin-right: 8px; font-size: 13px; }
  .tr-line.now { background: var(--sky-soft); }
  .lnk-box { border-top: 1px dashed var(--line-strong); margin-top: 10px; padding-top: 8px; }
  .lnk-box .time-in { width: 90px; padding: 8px 10px; border: 2px solid var(--line-strong); border-radius: 10px; font-size: 15px; }
  .lnk-box audio, .lnk-box video { width: 100%; max-height: 220px; margin: 6px 0; }
  .tl { margin: 4px 0 12px; }
  .tl-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
  .tl-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; }
  .tl-track { position: relative; background: var(--mist); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 4px; cursor: pointer; }
  .tl-item { position: absolute; height: 16px; min-width: 8px; border: 0; padding: 0; border-radius: 4px; opacity: .9; box-shadow: 0 0 0 1px rgba(255,255,255,.8) inset; }
  .tl-item.img { background: var(--amber); } .tl-item.term { background: var(--sky); }
  .tl-item.active { outline: 2px solid var(--petrol); opacity: 1; }
  .tl-head { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--petrol); pointer-events: none; }
  .now-terms { margin-top: 8px; }
  .term-times { margin-left: 4px; } .term-times button { background: none; color: var(--petrol); font-weight: 700; font-size: 12px; padding: 2px 6px; min-height: 28px; border-radius: 6px; border: 1px solid var(--line-strong); margin-left: 4px; }
  .ann-when { font-size: 13px; font-weight: 700; color: var(--amber-text); }
  .ann-time-panel { flex-basis: 100%; }
  .ann-player { width: 100%; max-height: 220px; margin: 6px 0; }
  .btn-danger { padding: 12px 22px; min-height: 48px; font-weight: 700; background: #fff; color: var(--danger); border: 2px solid var(--danger); }
  .ann-media { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
  .ann-text { width: 100%; padding: 10px 12px; border: 2px solid var(--line-strong); border-radius: 12px; font-size: 15px; font-family: inherit; color: var(--ink); }
  .ann-media .btn-wide { margin-bottom: 8px; }
  .ann-add { margin-top: 6px; } .ann-add[hidden], .ann-add div[hidden] { display: none; }
  .ann-term-in { width: calc(100% - 110px); padding: 10px 12px; border: 2px solid var(--line-strong); border-radius: 12px; font-size: 15px; margin-right: 8px; }
  .kind-select { min-height: 40px; padding: 4px 10px; font-size: 14px; }
  .ann-seg { margin: 10px 0; padding: 8px 10px; background: var(--mist); border-radius: 10px; }
  .ann-seg .when { font-size: 12px; font-weight: 700; color: var(--amber-text); }
  .ann-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; font-size: 14px; }
  .ann-row .desc { color: var(--muted); flex-basis: 100%; }
  .ann-row button { padding: 6px 14px; min-height: 40px; font-weight: 700; background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); }
  .ann-row.approved { border-left: 4px solid var(--petrol); padding-left: 8px; } .ann-row.rejected { opacity: .55; }

  /* ---------- Φύλλα / διάλογοι ---------- */
  .edit-sheet { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; justify-content: flex-end; background: rgba(14,63,80,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); pointer-events: auto; }
  .edit-sheet.on { display: flex; }
  #infoSheet { z-index: 30; }
  .sheet-inner {
    position: relative; background: var(--paper); color: var(--ink);
    padding: 30px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 95vh; overflow-y: auto; border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 30px rgba(14,63,80,.3);
  }
  .sheet-inner::before { content: ''; position: absolute; top: 0; left: 28px; right: 28px; height: 4px; border-radius: 0 0 4px 4px; background: var(--brand-path); }
  .sheet-inner h2 { margin: 0 0 12px; font-size: 24px; }
  .sheet-sub { color: var(--muted); margin-top: -6px; font-size: 14px; }
  #closeInfoBtn { padding: 12px 26px; background: var(--petrol); color: #fff; font-size: 16px; font-weight: 700; margin-top: 10px; min-height: 48px; }

  .input-group { margin-bottom: 18px; }
  .input-group > label, .group-label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--petrol); font-style: normal; }
  .input-group input[type="text"] { width: 100%; padding: 12px 14px; border: 2px solid var(--line-strong); border-radius: 12px; font-size: 16px; color: var(--ink); }
  .input-group input[aria-invalid="true"] { border-color: var(--danger); }
  .loc-box { font-variant-numeric: tabular-nums; padding: 9px 14px; background: var(--mist); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); }
  .field-error { color: var(--danger); font-size: 14px; font-weight: 600; margin: 6px 0 0; }
  .field-error:empty { display: none; }

  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  .btn-row button { flex: 1; padding: 13px 14px; font-size: 16px; font-weight: 700; min-height: 50px; }
  .btn-primary { background: var(--petrol); color: #fff; }
  .btn-secondary { background: #fff; color: var(--petrol); box-shadow: inset 0 0 0 2px var(--petrol); }
  .btn-wide { width: 100%; padding: 12px; margin-top: 8px; min-height: 50px; font-weight: 700; }
  .btn-dashed { background: var(--sky-soft); color: var(--petrol); box-shadow: none; border: 2px dashed var(--petrol); }

  #mediaList { list-style: none; padding: 0; margin: 0 0 12px; }
  .media-list-item { background: var(--mist); border: 1px solid var(--line); padding: 10px 10px 10px 14px; margin-bottom: 8px; border-radius: 14px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .media-list-item .mi-text { min-width: 0; overflow: hidden; }
  .media-list-item .mi-name { display: block; font-weight: 700; color: var(--petrol); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-list-item .mi-changes { display: block; font-size: 13px; color: var(--amber-text); }
  .media-list-item small { color: var(--muted); font-weight: 400; }
  .empty-note { font-size: 14px; color: var(--muted); margin: 0; }
  .icon-btn { min-width: 44px; min-height: 44px; font-size: 16px; color: #fff; }
  .icon-btn.edit { background: var(--petrol); margin-right: 6px; }
  .icon-btn.del { background: var(--danger); }

  .preview-note { font-size: 14px; background: var(--sky-soft); color: var(--ink); border-left: 4px solid var(--sky); padding: 9px 12px; border-radius: 10px; margin: 0 0 16px; }

  /* ---------- Editor ---------- */
  .editor-box { position: relative; width: 100%; background: var(--petrol-deep); border-radius: 14px; overflow: hidden; margin-bottom: 15px; display: none; touch-action: none; }
  #imageCanvas { width: 100%; display: block; touch-action: none; }
  #imageCanvas:focus-visible { outline: 3px solid var(--amber); outline-offset: -3px; box-shadow: none; }
  .img-hint { position: absolute; top: 10px; left: 10px; background: rgba(14,63,80,.88); color: #fff; padding: 5px 10px; font-size: 12px; border-radius: 10px; pointer-events: none; max-width: 55%; }
  .img-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 10; }
  .img-tools button { padding: 6px 14px; font-size: 13px; font-weight: 700; min-height: 36px; }
  #kbCursor { position: absolute; border: 3px dashed var(--amber); border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px #000; }

  #videoContainer { position: relative; width: 100%; overflow: hidden; border-radius: 14px 14px 0 0; background: #000; }
  #vidPlayBtn { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(14,63,80,.85); color: #fff; border: 2px solid #fff; width: 62px; height: 62px; font-size: 24px; display: flex; align-items: center; justify-content: center; z-index: 6; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  #vidPlayBtn.playing { left: auto; top: auto; right: 8px; bottom: 8px; transform: none; width: 44px; height: 44px; font-size: 16px; }

  .fx-badge { display: none; background: var(--petrol-deep); color: #fff; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border-left: 4px solid var(--amber); }
  .fx-badge.on { display: inline-block; }
  #vidFxBadge { position: absolute; top: 8px; left: 8px; z-index: 5; pointer-events: none; }

  .timeline-wrap { position: relative; width: 100%; background: var(--petrol-deep); overflow: hidden; cursor: pointer; }
  .timeline-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .timeline-layer:focus-visible { outline: 3px solid var(--amber); outline-offset: -3px; box-shadow: none; }
  .timeline-block { position: absolute; height: 100%; border-left: 1px solid #fff; border-right: 1px solid #fff; z-index: 2; }
  .timeline-block.blur { background: rgba(224,144,79,.75); }
  .timeline-block.mute { background: rgba(179,38,30,.6); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.28) 0 4px, transparent 4px 8px); }
  .time-now { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--petrol); }

  .range-item, .mute-item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; color: var(--ink); box-shadow: 0 1px 3px rgba(14,63,80,.08); }
  .rr { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
  .rr + .rr { margin-top: 8px; }
  .rr input[type="number"] { width: 78px; padding: 6px 8px; border-radius: 10px; border: 2px solid var(--line-strong); font-size: 16px; min-height: 38px; font-variant-numeric: tabular-nums; }
  .rr label { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
  .rr input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--petrol); }
  .nowbtn { background: var(--sky-soft); color: var(--petrol); box-shadow: inset 0 0 0 1px var(--petrol); padding: 6px 12px; font-size: 13px; font-weight: 700; min-height: 36px; }
  .delrow { margin-left: auto; background: var(--danger); color: #fff; padding: 6px 10px; font-size: 14px; min-width: 38px; min-height: 38px; }
  .add-row-btn { padding: 10px 18px; background: #fff; color: var(--petrol); border: 2px dashed var(--petrol); font-size: 14px; font-weight: 700; min-height: 44px; margin-top: 4px; }

  /* ---------- Επεξεργασία σε εξέλιξη ---------- */
  #processingOverlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center; padding: 24px; background: rgba(255,255,255,.97); color: var(--ink); }
  #processingOverlay.on { display: flex; }
  #procTitle { color: var(--petrol); }
  #procBar { width: 80%; max-width: 340px; height: 10px; background: var(--line); border-radius: 5px; margin-top: 18px; overflow: hidden; }
  #procBarFill { height: 100%; width: 0%; background: var(--brand-path); background-size: 340px 100%; border-radius: 5px; transition: width .2s linear; }

  #confirmModal { z-index: 150; }
  #recorderModal { z-index: 100; }
  #recStatusTimer { font-size: 34px; font-weight: 700; font-style: italic; font-variant-numeric: tabular-nums; color: var(--petrol); margin: 18px 0; }

  #procVideo { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; z-index: -1; }
</style>
</head>
<body>

<!-- Ανακοινώσεις για αναγνώστες οθόνης (WCAG 4.1.3) -->
<div id="srLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<main id="gate" aria-labelledby="gateTitle">
  <svg class="gate-path" aria-hidden="true" focusable="false" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="gatePathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0904F"/><stop offset=".5" stop-color="#249CCC"/><stop offset="1" stop-color="#186078"/>
    </linearGradient></defs>
    <path d="M250 -30 C 110 80, 340 170, 205 280 S 80 460, 230 550 S 340 730, 160 850" fill="none" stroke="url(#gatePathGrad)" stroke-width="48" stroke-linecap="round"/>
  </svg>

  <div class="gate-body">
  <h1 id="gateTitle" data-i18n="gateTitle"></h1>
  <div class="rule" aria-hidden="true"></div>
  <p data-i18n="gateText"></p>
  <div class="gate-lang">
    <label for="langGate" data-i18n="language"></label>
    <select id="langGate" class="lang-select">
      <option value="el" lang="el">Ελληνικά</option>
      <option value="en" lang="en">English</option>
      <option value="fr" lang="fr">Français</option>
      <option value="it" lang="it">Italiano</option>
    </select>
  </div>
  <button id="startBtn" data-i18n="start"></button>
  <button id="authBtnGate" class="link-btn" hidden></button>
</div>
</main>

<div id="hud">
  <div id="status" role="status" aria-live="off"></div>
  <div id="langWrap">
    <label for="langHud" class="sr-only" data-i18n="language"></label>
    <select id="langHud" class="lang-select">
      <option value="el" lang="el">EL</option>
      <option value="en" lang="en">EN</option>
      <option value="fr" lang="fr">FR</option>
      <option value="it" lang="it">IT</option>
    </select>
  </div>
  <button id="authBtn" hidden></button>
  <button id="listBtn" hidden></button>
  <button id="nearest"><span class="dist"></span><span class="name"></span></button>
</div>

<div id="ar-overlay-container"></div>

<button id="addBtn" data-i18n-aria="addStory"><span aria-hidden="true">+</span></button>

<div id="drawer">
  <button id="handle" aria-expanded="false" aria-controls="map"><span class="grip" aria-hidden="true"></span><span class="lbl" data-i18n="map"></span></button>
  <div id="map" role="region" data-i18n-aria="map" inert>
    <div id="compass" aria-hidden="true"><span class="needle"></span><span class="deg">—</span></div>
  </div>
</div>

<!-- Προβολή ιστορίας -->
<div id="infoSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <h2 id="sheetTitle"></h2>
    <p id="sheetSub" class="sheet-sub"></p>
    <p id="sheetAuthor" class="story-author"></p>
    <p id="sheetStatus" class="story-status"></p>
    <p id="sheetBody"></p>
    <div id="sheetMedia" class="story-media"></div>
    <div id="sheetImages" class="story-media"></div>
    <div id="sheetKnow" class="story-know"></div>
    <div id="sheetTools" hidden>
      <button id="publishBtn" class="btn-primary" hidden></button>
      <button id="annotateBtn" class="btn-secondary" hidden data-i18n="annotate"></button>
      <button id="exportBtn" class="btn-secondary" hidden data-i18n="annExport"></button>
      <button id="deleteBtn" class="btn-danger" hidden data-i18n="deleteStory"></button>
    </div>
    <button id="closeInfoBtn" data-i18n="close"></button>
  </div>
</div>

<!-- 1. Νέα ιστορία -->
<div id="uploadSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
  <div class="sheet-inner">
    <h2 id="uploadTitle" data-i18n="newStory"></h2>
    <div class="input-group">
      <span class="group-label" id="locLabel" data-i18n="locLabel"></span>
      <div id="locDisplay" class="loc-box" aria-labelledby="locLabel"></div>
    </div>
    <div class="input-group">
      <label for="storyTitle" data-i18n="storyTitle"></label>
      <input type="text" id="storyTitle" data-i18n-ph="titlePh" autocomplete="off" aria-describedby="titleError" required>
      <p id="titleError" class="field-error" role="alert"></p>
    </div>

    <div class="input-group">
      <h3 class="group-label" id="mediaHeading" data-i18n="media" style="margin:0 0 4px;"></h3>
      <ul id="mediaList" aria-labelledby="mediaHeading"></ul>
      <p id="mediaError" class="field-error" role="alert"></p>
      <input type="file" id="singleFileInput" accept="image/*,video/*,audio/*" hidden>
      <button class="btn-wide btn-dashed" id="triggerFileBtn" data-i18n="addFile"></button>
      <button class="btn-primary btn-wide" id="recordAudioBtn" data-i18n="recordAudio"></button>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="cancelStoryBtn" data-i18n="cancel"></button>
      <button class="btn-primary" id="finishStoryBtn" data-i18n="finish"></button>
    </div>
  </div>
</div>

<!-- Επιβεβαίωση -->
<div id="confirmModal" class="edit-sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText confirmSummary">
  <div class="sheet-inner">
    <h2 id="confirmTitle" data-i18n="confirmTitle"></h2>
    <p id="confirmText" data-i18n="confirmText"></p>
    <p id="confirmSummary" class="sheet-sub" style="margin-top:0;"></p>
    <p style="font-size:14px; color:var(--muted);" data-i18n="confirmNote"></p>
    <div class="btn-row">
      <button class="btn-secondary" id="confirmBackBtn" data-i18n="backToCheck"></button>
      <button class="btn-primary" id="confirmApplyBtn" data-autofocus data-i18n="saveAll"></button>
    </div>
  </div>
</div>

<!-- Ηχογράφηση -->
<div id="recorderModal" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="recTitle">
  <div class="sheet-inner" style="text-align: center;">
    <h2 id="recTitle" data-i18n="recTitle"></h2>
    <p id="recStatusTimer" role="timer" data-i18n-aria="recElapsed">00:00</p>
    <div class="btn-row">
      <button class="btn-secondary" id="cancelRecBtn" data-i18n="cancel"></button>
      <button class="btn-primary" id="stopRecBtn" data-autofocus style="background: var(--danger);" data-i18n="recStop"></button>
    </div>
  </div>
</div>

<!-- 2. Editor -->
<div id="editorSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <div class="sheet-inner" style="position: relative;">
    <h2 id="editorTitle" data-i18n="editTitle"></h2>
    <p id="editorFilename" class="sheet-sub" style="word-break: break-all;"></p>
    <p class="preview-note" data-i18n="previewNote"></p>

    <!-- Εικόνα -->
    <div id="imageEditor" class="editor-box">
      <canvas id="imageCanvas" tabindex="0" role="img" data-i18n-aria="imageCanvas" aria-describedby="imgHint kbHint"></canvas>
      <div id="kbCursor"></div>
      <div class="img-hint" aria-hidden="true">
        <span id="imgHint" data-i18n="blurHint"></span><br>
        <span id="kbHint" data-i18n="kbHint"></span>
      </div>
      <div class="img-tools">
        <button id="undoBlurBtn" style="background:var(--chalk); color:var(--ink);" data-i18n="undo"></button>
        <button id="clearBlurBtn" style="background:var(--danger); color:#fff;" data-i18n="clear"></button>
      </div>
    </div>

    <!-- Βίντεο -->
    <div id="videoEditor" class="editor-box" style="background:transparent;">
      <div id="videoContainer">
        <video id="videoPreview" playsinline preload="metadata" style="width:100%; display:block; cursor:pointer; background:#000;"></video>
        <span id="vidFxBadge" class="fx-badge"></span>
        <button id="vidPlayBtn" data-i18n-aria="play"><span aria-hidden="true">▶</span></button>
      </div>

      <div id="videoTimelineContainer" class="timeline-wrap" style="height:60px; border-radius:0 0 14px 14px; margin-bottom:6px;">
        <canvas id="videoGridCanvas" class="timeline-layer" aria-hidden="true"></canvas>
        <div id="videoTimeline" class="timeline-layer" tabindex="0" role="slider" data-i18n-aria="videoTimeline" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></div>
        <div id="videoProgressFill" style="position:absolute; top:0; left:0; width:0%; height:100%; background:rgba(255,255,255,0.15); pointer-events:none; z-index:3;"></div>
        <div id="videoPlayhead" style="position:absolute; top:0; left:0; width:2px; height:100%; background:#fff; pointer-events:none; box-shadow:0 0 4px rgba(0,0,0,0.8); display:none; z-index:4;"></div>
      </div>

      <div id="vTimeNow" class="time-now" style="margin-bottom:12px;" aria-hidden="true"></div>

      <h3 class="group-label" data-i18n="editRanges" style="margin:0 0 6px;"></h3>
      <div id="videoRangeList"></div>
      <button id="addRangeBtn" class="add-row-btn" data-i18n="addRange"></button>
    </div>

    <!-- Ήχος -->
    <div id="audioEditor" style="display:none; width:100%; margin-bottom:15px;">
      <audio id="audioPreview" style="display:none;"></audio>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <span id="aTimeNow" class="time-now" aria-hidden="true"></span>
        <span id="audFxBadge" class="fx-badge"></span>
      </div>
      <div style="display:flex; align-items:stretch; gap:8px; margin-bottom:10px;">
        <button id="wavePlayBtn" data-i18n-aria="play" style="flex:none; background:var(--petrol); color:#fff; border-radius:14px; width:50px; font-size:18px;"><span aria-hidden="true">▶</span></button>
        <div id="waveContainer" class="timeline-wrap" style="flex:1; height:90px; border-radius:14px;">
          <canvas id="audioWaveCanvas" class="timeline-layer" aria-hidden="true"></canvas>
          <div id="audioTimeline" class="timeline-layer" tabindex="0" role="slider" data-i18n-aria="audioTimeline" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></div>
          <div id="audioProgressFill" style="position:absolute; top:0; left:0; width:0%; height:100%; background:rgba(255,255,255,0.15); pointer-events:none; z-index:3;"></div>
          <div id="audioPlayhead" style="position:absolute; top:0; left:0; width:2px; height:100%; background:#fff; pointer-events:none; box-shadow:0 0 4px rgba(0,0,0,0.8); display:none; z-index:4;"></div>
        </div>
      </div>

      <h3 class="group-label" data-i18n="muteStamps" style="margin:0 0 6px;"></h3>
      <div id="audioMuteList"></div>
      <button id="addAudioRangeBtn" class="add-row-btn" data-i18n="addMute"></button>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="cancelSingleBtn" data-i18n="cancelShort"></button>
      <button class="btn-primary" id="saveFileBtn" data-i18n="keep"></button>
    </div>
  </div>
</div>

<!-- Επεξεργασία σε εξέλιξη -->
<div id="processingOverlay" role="alertdialog" aria-modal="true" aria-labelledby="procTitle" aria-describedby="procMsg" tabindex="-1">
  <h2 id="procTitle" style="margin:0 0 10px; font-size:20px;" data-i18n="processing"></h2>
  <p id="procMsg" style="font-size:15px; margin:0;"></p>
  <div id="procBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="progress"><div id="procBarFill"></div></div>
  <p style="font-size:14px; margin-top:14px;" data-i18n="procNote"></p>
</div>

<!-- 3. Τελικό αποτέλεσμα -->
<div id="listSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="listTitle">
  <div class="sheet-inner">
    <h2 id="listTitle"></h2>
    <div class="input-group" id="listFilterWrap">
      <label for="listFilter" data-i18n="listFilter"></label>
      <select id="listFilter" class="lang-select"></select>
    </div>
    <div id="listBody"></div>
    <button id="listCloseBtn" class="btn-primary" style="margin-top:14px" data-i18n="close"></button>
  </div>
</div>

<div id="annSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="annTitle">
  <div class="sheet-inner">
    <h2 id="annTitle" data-i18n="annTitle"></h2>
    <p class="sheet-sub" data-i18n="annNote"></p>
    <div id="annBody"></div>
    <button id="annCloseBtn" class="btn-primary" style="margin-top:14px" data-i18n="close"></button>
  </div>
</div>

<div id="authSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="sheet-inner">
    <h2 id="authTitle"></h2>
    <form id="authForm" novalidate>
      <div class="input-group" id="nameGroup">
        <label for="authName" data-i18n="displayName"></label>
        <input type="text" id="authName" autocomplete="nickname" maxlength="60">
      </div>
      <div class="input-group">
        <label for="authEmail" data-i18n="email"></label>
        <input type="email" id="authEmail" autocomplete="email" required>
      </div>
      <div class="input-group">
        <label for="authPass" data-i18n="password"></label>
        <input type="password" id="authPass" autocomplete="current-password" minlength="6" required>
      </div>
      <p id="authError" class="field-error" role="alert"></p>
      <div class="btn-row">
        <button type="button" class="btn-secondary" id="authCancelBtn" data-i18n="cancel"></button>
        <button type="submit" class="btn-primary" id="authSubmitBtn"></button>
      </div>
      <button type="button" class="link-btn" id="authToggleBtn"></button>
    </form>
  </div>
</div>

<div id="previewSheet" class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
  <div class="sheet-inner">
    <h2 id="previewTitle" data-i18n="finalTitle"></h2>
    <p class="sheet-sub" data-i18n="finalNote"></p>
    <p id="publishError" class="field-error" role="alert"></p>
    <div id="localPreviewContainer" style="display:flex; flex-direction:column; gap:15px; margin-bottom:20px;"></div>
    <div class="btn-row">
      <button class="btn-secondary" id="backToUploadBtn" data-i18n="backToFiles"></button>
      <button class="btn-primary" id="closePreviewBtn" data-i18n="publish"></button>
    </div>
  </div>
</div>

<video id="procVideo" playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>

<script>
(function () {
  'use strict';
  var $ = function(id) { return document.getElementById(id); };

  // ==========================================
  // 0. ΜΕΤΑΦΡΑΣΕΙΣ

  var LANGS = ['el', 'en', 'fr', 'it'];
  var I18N = {
    el: {
      pageTitle: "Walking Memory — Μυτιλήνη", language: "Γλώσσα",
      gateTitle: "Διαδρομή μνήμης, κέντρο Μυτιλήνης",
      gateText: "Χρειάζεται κάμερα, τοποθεσία και αισθητήρες κίνησης. Δούλεψε σε ανοιχτό χώρο.",
      start: "Ξεκίνα τη διαδρομή", opening: "Άνοιγμα κάμερας…", retry: "Δοκίμασε ξανά", permDenied: "Δεν δόθηκε άδεια.",
      waitingFix: "Αναμονή για στίγμα…", accuracy: "Ακρίβεια {m}m.", compassDeg: "Πυξίδα {d}°", gpsError: "Σφάλμα GPS",
      youAreHere: "Είσαι εδώ", mAway: "{m}m μακριά", closest: "📍 Πιο κοντά", distance: "Απόσταση: {d}",

  function updateHTMLMarkersPosition() {
    if (!me || window.currentHeading === null) return;
    if (!document.querySelector('#cam')) return;

    var items = [], minDist = Infinity, closestId = null;

    STORIES.forEach(function (s) {
      s.d = distanceMetres(me.lat, me.lon, s.lat, s.lon);
      if (s.d < minDist) { minDist = s.d; closestId = s.id; }
    });

    STORIES.forEach(function (s) {
      var el = $('html-marker-' + s.id);
      if (!el) return;

      var distTxt = t('distance', { d: fmtDist(s.d) });
      var distEl = el.querySelector('.m-dist');
      if (distEl.textContent !== distTxt) distEl.textContent = distTxt;

      var isClosest = s.id === closestId, isLocked = s.d > 100;
      el.classList.toggle('closest', isClosest);
      el.classList.toggle('locked', isLocked);
      el.querySelector('.lock').style.display = isLocked ? 'inline' : 'none';

      var label = st(s).title + ', ' + fmtDist(s.d) + (isLocked ? ', ' + t('locked') : '') + (isClosest ? ', ' + t('closest').replace('📍 ', '') : '');

      it.el.style.top = ty + 'px';
    }
  }

  // --- Αναζήτηση όρων στον browser (Wikidata, Getty)· δεν χρειάζεται κλειδί ή server ---
  var WD_API = 'https://www.wikidata.org/w/api.php';
  var KIND_NAMES = ['person', 'place', 'event', 'object', 'material', 'concept'];
  var WD_EVENT_CLASSES = { Q1190554: 1, Q1656682: 1, Q198: 1, Q178561: 1, Q13418847: 1, Q350604: 1 };

  async function wdSearch(q, lang, limit) {
    var r = await fetch(WD_API + '?action=wbsearchentities&format=json&origin=*&limit=' + limit +
      '&language=' + encodeURIComponent(lang) + '&uselang=' + encodeURIComponent(lang) + '&search=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('Wikidata ' + r.status);
    var d = await r.json();
    return (d.search || []).map(function (x) {
      return { vocabulary: 'wikidata', id: x.id, uri: 'https://www.wikidata.org/entity/' + x.id, label: x.label || x.id, description: x.description || '' };
    });
  }

  // Εικάζει το είδος από τα δεδομένα του Wikidata: P31=Q5 πρόσωπο, P625 τόπος, γνωστές κλάσεις γεγονότος.
  async function wdKinds(ids) {
    var out = {};
    for (var i = 0; i < ids.length; i += 50) {
      try {
        var r = await fetch(WD_API + '?action=wbgetentities&format=json&origin=*&props=claims&ids=' + ids.slice(i, i + 50).join('|'));
        if (!r.ok) continue;
        var d = await r.json();
        Object.keys(d.entities || {}).forEach(function (id) {
          var c = d.entities[id].claims || {};
          var p31 = (c.P31 || []).map(function (x) { return x.mainsnak && x.mainsnak.datavalue && x.mainsnak.datavalue.value && x.mainsnak.datavalue.value.id; });
          out[id] = p31.indexOf('Q5') >= 0 ? 'person' : c.P625 ? 'place' : p31.some(function (x) { return WD_EVENT_CLASSES[x]; }) ? 'event' : 'concept';
        });
      } catch (e) { /* χωρίς είδος -> 'concept' */ }
    }
    return out;
  }

  async function gettySearch(scheme, term) {
    var clean = term.replace(/["'\\]/g, ' ').trim();
    if (!clean) return [];
    var q = 'SELECT ?s ?l WHERE { ?s luc:term "' + clean + '"; skos:inScheme ' + scheme + ': ; a gvp:Subject ; gvp:prefLabelGVP [xl:literalForm ?l] } LIMIT 3';
    var r = await fetch('https://vocab.getty.edu/sparql.json?query=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('Getty ' + r.status);
    var d = await r.json();
    var kind = scheme === 'tgn' ? 'place' : scheme === 'ulan' ? 'person' : 'concept';
    return ((d.results || {}).bindings || []).map(function (b) { return { vocabulary: scheme, uri: b.s.value, label: b.l.value, description: '', kind: kind }; });
  }

  async function searchTerms(q, lang) {
    var quiet = function (p) { return p.catch(function () { return []; }); };
    var jobs = [quiet(wdSearch(q, lang, 4))];
    if (lang !== 'en') jobs.push(quiet(wdSearch(q, 'en', 3)));
    ['aat', 'tgn', 'ulan'].forEach(function (sc) { jobs.push(quiet(gettySearch(sc, q))); });
    var all = (await Promise.all(jobs)).reduce(function (a, b) { return a.concat(b); }, []);
    var seen = {};
    all = all.filter(function (c) { if (seen[c.uri]) return false; seen[c.uri] = 1; return true; });
    var kinds = await wdKinds(all.filter(function (c) { return c.id; }).map(function (c) { return c.id; }));
    all.forEach(function (c) { if (!c.kind) c.kind = kinds[c.id] || 'concept'; });
    return all;
  }

  // Φράσεις που μοιάζουν με ονόματα (κεφαλαία)· μονές λέξεις στην αρχή πρότασης αγνοούνται.
  function nameCandidates(text) {
    var re = /\p{Lu}[\p{L}\u0300-\u036f'’-]*(?:\s+\p{Lu}[\p{L}\u0300-\u036f'’-]*)*/gu, out = [], m;
    while ((m = re.exec(text))) {
      var w = m[0];
      if (w.length < 3) continue;
      var atStart = /(^|[.!?;·]\s+)$/.test(text.slice(0, m.index)), multi = w.indexOf(' ') >= 0;
      if (!multi && atStart) continue;
      out.push(w);
      // Η πρώτη λέξη μιας πρότασης είναι κεφαλαία χωρίς να είναι όνομα (π.χ. "Στη Μυτιλήνη")· δοκίμασε και χωρίς αυτήν.
      if (multi && atStart && w.slice(w.indexOf(' ') + 1).length >= 3) out.push(w.slice(w.indexOf(' ') + 1));
    }
    return out;
  }

  async function saveTranscript(m, lang, segs) {

      { onConflict: 'media_id' }).select('id').single();

  async function autoSuggest(m, lang, segs, onProgress) {
    var phrases = {}, order = [];
    segs.forEach(function (g) {
      nameCandidates(g.text).forEach(function (ph) {
        if (!phrases[ph]) { phrases[ph] = []; order.push(ph); }
        if (phrases[ph].indexOf(g) < 0) phrases[ph].push(g);
      });
    });
    order = order.slice(0, 40);
    var found = {}, done = 0;
    for (var i = 0; i < order.length; i += 4) {
      await Promise.all(order.slice(i, i + 4).map(function (ph) {
        return wdSearch(ph, lang, 2).catch(function () { return []; }).then(function (r) { found[ph] = r; onProgress(++done, order.length); });
      }));
    }
    var ids = [];
    order.forEach(function (ph) { found[ph].forEach(function (c) { ids.push(c.id); }); });
    var kinds = await wdKinds(ids.filter(function (x, k) { return ids.indexOf(x) === k; }));
    var rows = [], seen = {};
    order.forEach(function (ph) {
      found[ph].forEach(function (c) {
        phrases[ph].forEach(function (g) {
          var key = c.uri + '|' + g.idx;
          if (seen[key]) return;
          seen[key] = 1;
          rows.push({ media_id: m.id, segment_idx: g.idx, start_s: g.start_s, end_s: g.end_s, mention: ph, kind: kinds[c.id] || 'concept',
            vocabulary: 'wikidata', term_uri: c.uri, label: c.label.slice(0, 200), description: c.description.slice(0, 300), status: 'suggested', source: 'auto' });
        });
      });
    });
    if (rows.length) { var ins = await sb.from('annotations').insert(rows); if (ins.error) throw ins.error; }
    return rows.length;
  }

  // --- Μορφή απομαγνητοφώνησης: μία γραμμή ανά τμήμα, προαιρετικά "[λλ:δδ-λλ:δδ] κείμενο" ---
  function fmtStamp(sec) { return mmss(sec); }
  function segmentsToText(segs) {
    return segs.map(function (g) { return '[' + fmtStamp(g.start_s) + '-' + fmtStamp(g.end_s) + '] ' + g.text; }).join('\n');
  }
  function stampToSec(x) { var p = x.split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; }
  function textToSegments(text) {
    var out = [];
    text.split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var m = line.match(/^\[(\d+(?::\d{2}){1,2})(?:\s*-\s*(\d+(?::\d{2}){1,2}))?\]\s*(.*)$/);
      if (m) out.push({ start_s: stampToSec(m[1]), end_s: m[2] ? stampToSec(m[2]) : null, text: m[3].trim() });
      else out.push({ start_s: null, end_s: null, text: line });
    });
    var t0 = 0;
    out.forEach(function (g, i) {
      if (g.start_s === null) g.start_s = t0;
      if (g.end_s === null) { var nx = out[i + 1]; g.end_s = nx && nx.start_s !== null && nx.start_s >= g.start_s ? nx.start_s : g.start_s; }
      t0 = g.end_s;
    });
    return out.filter(function (g) { return g.text; });
  }
  // .srt / .vtt -> γραμμές "[λλ:δδ-λλ:δδ] κείμενο"· σκέτο κείμενο μένει όπως είναι
  function parseSubtitleFile(raw) {
    var blocks = raw.replace(/\r/g, '').replace(/^WEBVTT[^\n]*\n/, '').split(/\n{2,}/), lines = [];
    blocks.forEach(function (b) {
      var m = b.match(/(\d+:)?(\d{2}):(\d{2})[.,]\d+\s*-->\s*(\d+:)?(\d{2}):(\d{2})[.,]\d+[^\n]*\n([\s\S]*)/);
      if (!m) { if (b.trim() && !/^\d+$/.test(b.trim())) lines.push(b.trim().replace(/\n/g, ' ')); return; }
      var a = (parseInt(m[1] || '0', 10) * 3600) + parseInt(m[2], 10) * 60 + parseInt(m[3], 10);
      var z = (parseInt(m[4] || '0', 10) * 3600) + parseInt(m[5], 10) * 60 + parseInt(m[6], 10);
      var txt = m[7].replace(/<[^>]+>/g, '').replace(/\n/g, ' ').trim();
      if (txt) lines.push('[' + fmtStamp(a) + '-' + fmtStamp(z) + '] ' + txt);
    });
    return lines.join('\n');
  }

  // --- Whisper στη συσκευή (transformers.js)· το αρχείο δεν φεύγει από τον browser ---
  // Ταχύτητα/ποιότητα: tiny (γρήγορο), base, small (καλύτερο). Με WebGPU τρέχει στην κάρτα γραφικών.
  var WHISPER_MODELS = { fast: 'Xenova/whisper-tiny', balanced: 'Xenova/whisper-base', best: 'Xenova/whisper-small' };
  var QUALITY_KEY = 'wm_whisper_quality';
  var whisperPipes = {}, tfModule = null;
  function loadTf() {
    if (!tfModule) tfModule = import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3').catch(function (e) { tfModule = null; throw e; });
    return tfModule;
  }
  var WHISPER_LANG = { el: 'greek', en: 'english', fr: 'french', it: 'italian' };

  function savedQuality() {
    try { var q = localStorage.getItem(QUALITY_KEY); if (WHISPER_MODELS[q]) return q; } catch (e) {}
    return 'balanced';
  }
  async function hasWebGPU() {
    try { return !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch (e) { return false; }
  }

  async function loadWhisper(quality, device, onProgress) {
    var key = quality + ':' + device;
    if (whisperPipes[key]) return whisperPipes[key];
    var tf = await loadTf();
    var opts = device === 'webgpu'
      ? { device: 'webgpu', dtype: { encoder_model: 'fp32', decoder_model_merged: 'q4' } }
      : { dtype: 'q8' };
    opts.progress_callback = function (e) { if (e && e.status === 'progress' && typeof e.progress === 'number') onProgress(Math.round(e.progress)); };
    var pipe = await tf.pipeline('automatic-speech-recognition', WHISPER_MODELS[quality], opts);
    whisperPipes[key] = pipe;
    return pipe;
  }

  async function decodeAudio16k(url) {
    var buf = await (await fetch(url)).arrayBuffer();
    var AC = window.AudioContext || window.webkitAudioContext, ac = new AC({ sampleRate: 16000 }), ab;
    try { ab = await ac.decodeAudioData(buf); } catch (e) { throw new Error(t('annDecodeErr')); } finally { try { ac.close(); } catch (e) {} }
    var a = ab.getChannelData(0);
    if (ab.numberOfChannels < 2) return a;
    var b = ab.getChannelData(1), mono = new Float32Array(a.length);
    for (var i = 0; i < a.length; i++) mono[i] = (a[i] + b[i]) / 2;
    return mono;
  }

  async function fnErrorMessage(err) {
    try { if (err && err.context && err.context.json) { var j = await err.context.json(); if (j && j.error) return j.error; } } catch (e) {}
    if (err && /FunctionsFetchError|Failed to send/i.test((err.name || '') + ' ' + (err.message || ''))) return t('annServerMissing');
    return (err && err.message) || String(err);
  }

  async function serverTranscribe(mediaId, lang) {

  async function whisperTranscribe(url, lang, quality, onStatus) {
    var audio = await decodeAudio16k(url);
    async function run(device) {
      var pipe = await loadWhisper(quality, device, function (p) { onStatus(t('annWhisperLoad', { p: p })); });
      onStatus(t(device === 'webgpu' ? 'annWhisperRunGpu' : 'annWhisperRun'));
      return pipe(audio, { language: WHISPER_LANG[lang] || 'english', task: 'transcribe', return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 });
    }
    var res;
    if (await hasWebGPU()) {
      try { res = await run('webgpu'); }
      catch (e) { onStatus(t('annWhisperFallback')); res = await run('wasm'); }
    } else { res = await run('wasm'); }
    var chunks = (res.chunks || []).filter(function (c) { return c.text && c.text.trim(); });
    if (!chunks.length && res.text && res.text.trim()) return [{ start_s: 0, end_s: 0, text: res.text.trim() }];
    return chunks.map(function (c) { return { start_s: c.timestamp[0] || 0, end_s: c.timestamp[1] == null ? (c.timestamp[0] || 0) : c.timestamp[1], text: c.text.trim() }; });

  // --- Εικόνες: σύνδεση με όρους της ιστορίας, προαιρετική περιοχή, προτάσεις CLIP στη συσκευή ---
  var clipPipe = null;

  async function enLabels(terms) {
    var out = {}, ids = [];
    terms.forEach(function (tm) {
      if (tm.vocabulary === 'wikidata') ids.push(tm.term_uri.split('/').pop()); else out[tm.term_uri] = tm.label;
    });
    for (var i = 0; i < ids.length; i += 50) {
      try {
        var r = await fetch(WD_API + '?action=wbgetentities&format=json&origin=*&props=labels&languages=en&ids=' + ids.slice(i, i + 50).join('|'));
        if (!r.ok) continue;
        var d = await r.json();
        Object.keys(d.entities || {}).forEach(function (id) {
          var l = d.entities[id].labels && d.entities[id].labels.en;
          if (l) out['https://www.wikidata.org/entity/' + id] = l.value;
        });
      } catch (e) { /* θα χρησιμοποιηθεί η υπάρχουσα ετικέτα */ }
    }
    return out;
  }

  // Συγκρίνει την εικόνα με τους όρους (CLIP, zero-shot) και προτείνει όσους ταιριάζουν πιθανότατα.
  async function clipSuggest(m, terms, existing, onStatus) {
    var cands = terms.filter(function (tm) { return !existing.some(function (a) { return a.term_uri === tm.term_uri; }); });
    if (!cands.length) return 0;
    var tf = await loadTf();
    if (!clipPipe) {
      clipPipe = await tf.pipeline('zero-shot-image-classification', 'Xenova/clip-vit-base-patch32', {
        progress_callback: function (e) { if (e && e.status === 'progress' && typeof e.progress === 'number') onStatus(t('imgClipLoad', { p: Math.round(e.progress) })); }
      });
    }
    onStatus(t('imgClipRun'));
    var en = await enLabels(cands);
    var labels = cands.map(function (tm) { return en[tm.term_uri] || tm.label; });
    var distract = ['something unrelated', 'a blurry or dark photo'];
    var out = await clipPipe(m.url, labels.concat(distract));
    var score = {};
    out.forEach(function (o) { if (!(o.label in score)) score[o.label] = o.score; });
    var bestDistract = Math.max.apply(null, distract.map(function (d) { return score[d] || 0; }));
    var picks = cands.map(function (tm, i) { return { tm: tm, score: score[labels[i]] || 0 }; })
      .filter(function (x) { return x.score >= 0.3 && x.score > bestDistract; })
      .sort(function (a, b) { return b.score - a.score; }).slice(0, 3);
    if (!picks.length) return 0;
    var rows = picks.map(function (x) {
      return { media_id: m.id, mention: x.tm.label, kind: x.tm.kind, vocabulary: x.tm.vocabulary, term_uri: x.tm.term_uri, label: x.tm.label,
        description: x.tm.description || '', status: 'suggested', source: 'clip' };
    });
    var ins = await sb.from('annotations').insert(rows);
    if (ins.error) throw ins.error;
    return rows.length;
  }

  var ANN_COLS = 'id,media_id,segment_idx,start_s,end_s,mention,kind,vocabulary,term_uri,label,description,status,source,region_x,region_y,region_w,region_h';

  // --- Εξαγωγή JSON-LD (HDT ontology + CIDOC-CRM + Web Annotation) ---
  // Το HDTO v0.1 δεν δημοσιεύει ακόμη επίσημο namespace· ορίστε WM_CONFIG.HDT_NS όταν υπάρξει.
  var KIND_CLASS = { person: 'crm:E21_Person', place: 'crm:E53_Place', event: 'crm:E5_Event', object: 'crm:E70_Thing', material: 'crm:E57_Materials', concept: 'crm:E55_Type' };

  function buildJsonLd(s, k) {
    var sid = 'urn:walkingmemory:story:' + s.dbId;
    var entity = sid + '#heritage-entity', twin = sid + '#digital-twin', narrative = sid + '#narrative';
    var graph = [];
    var narr = { '@id': narrative, '@type': 'nont:Narrative', 'hdt:HP10_tells_about': [], 'crm:P67_refers_to': [] };
    var ent = {
      '@id': entity, '@type': 'hdt:HC1_Heritage_Entity', 'rdfs:label': st(s).title,
      'crm:P168_place_is_defined_by': { '@type': 'crm:E94_Space_Primitive', '@value': 'POINT(' + s.lon + ' ' + s.lat + ')' },
      'hdt:HP1_has_digital_twin': { '@id': twin }, 'hdt:HP2_has_story': { '@id': narrative }
    };
    graph.push(ent, { '@id': twin, '@type': 'hdt:HC2_Heritage_Digital_Twin', 'crm:P67_refers_to': { '@id': entity } }, narr);

    var repById = {};
    s.media.forEach(function (m) {
      if (!m.id) return;
      var rep = { '@id': m.url, '@type': m.kind === 'audio' ? 'hdt:HC5_Digital_Representation' : 'hdt:HC7_Digital_Visual_Object', 'hdt:HP22_represents': { '@id': entity } };
      if (m.kind === 'image') rep['hdt:HP9_is_visual_representation_of'] = { '@id': entity };
      repById[m.id] = rep;
      graph.push(rep);
      if (m.kind === 'image') return;
      var tr = k.transcripts.filter(function (x) { return x.media_id === m.id && x.status === 'done'; })[0];
      var narration = { '@id': sid + '#narration-' + m.id, '@type': 'nont:Narration', 'hdt:HP4_narrates': { '@id': narrative }, 'crm:P165_incorporates': { '@id': m.url } };
      if (tr) {
        var doc = sid + '#transcript-' + m.id;
        narration['hdt:HP8_is_narrated_in_document'] = { '@id': doc };
        graph.push({ '@id': doc, '@type': ['hdt:HC6_Digital_Document', 'crm:E31_Document'], 'hdt:HP11_documents': { '@id': entity }, 'dcterms:language': tr.language, 'rdf:value': tr.text });
      }
      graph.push(narration);
    });

    k.annotations.forEach(function (a) {
      var m = s.media.filter(function (x) { return x.id === a.media_id; })[0];
      if (!m) return;
      var term = { '@id': a.term_uri, '@type': KIND_CLASS[a.kind] || 'crm:E1_CRM_Entity', 'skos:prefLabel': a.label, 'skos:inScheme': { '@id': VOCAB_SCHEME[a.vocabulary] } };
      graph.push(term);
      if (m.kind === 'image') {
        var irep = repById[m.id];
        (irep['crm:P67_refers_to'] = irep['crm:P67_refers_to'] || []).push({ '@id': a.term_uri });
        var pct = function (v) { return +(v * 100).toFixed(2); };
        graph.push({
          '@id': sid + '#annotation-' + a.id, '@type': 'oa:Annotation', 'oa:motivation': { '@id': 'oa:tagging' },
          'oa:hasBody': { '@id': a.term_uri },
          'oa:hasTarget': hasRegion(a) ? {
            'oa:hasSource': { '@id': m.url },
            'oa:hasSelector': { '@type': 'oa:FragmentSelector', 'dcterms:conformsTo': { '@id': 'http://www.w3.org/TR/media-frags/' },
              'rdf:value': 'xywh=percent:' + pct(a.region_x) + ',' + pct(a.region_y) + ',' + pct(a.region_w) + ',' + pct(a.region_h) }
          } : { 'oa:hasSource': { '@id': m.url } }
        });
        return;
      }
      narr[a.kind === 'event' ? 'hdt:HP10_tells_about' : 'crm:P67_refers_to'].push({ '@id': a.term_uri });
      graph.push({
        '@id': sid + '#annotation-' + a.id, '@type': 'oa:Annotation', 'oa:motivation': { '@id': 'oa:tagging' },
        'oa:hasBody': { '@id': a.term_uri },
        'oa:hasTarget': a.end_s > a.start_s ? {
          'oa:hasSource': { '@id': m.url },
          'oa:hasSelector': { '@type': 'oa:FragmentSelector', 'dcterms:conformsTo': { '@id': 'http://www.w3.org/TR/media-frags/' }, 'rdf:value': 't=' + a.start_s + ',' + a.end_s }
        } : { 'oa:hasSource': { '@id': m.url } }
      });
    });
    (k.links || []).forEach(function (l) {
      var im = mediaById(s, l.image_media_id), av = mediaById(s, l.av_media_id);
      if (!im || !av) return;
      graph.push({
        '@id': sid + '#link-' + l.id, '@type': 'oa:Annotation', 'oa:motivation': { '@id': 'oa:linking' },
        'oa:hasBody': { '@id': im.url },
        'oa:hasTarget': { 'oa:hasSource': { '@id': av.url },
          'oa:hasSelector': { '@type': 'oa:FragmentSelector', 'dcterms:conformsTo': { '@id': 'http://www.w3.org/TR/media-frags/' }, 'rdf:value': 't=' + l.start_s + ',' + l.end_s } }
      });
    });
    if (!narr['hdt:HP10_tells_about'].length) delete narr['hdt:HP10_tells_about'];
    if (!narr['crm:P67_refers_to'].length) delete narr['crm:P67_refers_to'];

    return {
      '@context': {
        crm: 'http://www.cidoc-crm.org/cidoc-crm/', hdt: CFG.HDT_NS || 'urn:echoes:hdto:', nont: 'https://dlnarratives.eu/ontology/',
        oa: 'http://www.w3.org/ns/oa#', skos: 'http://www.w3.org/2004/02/skos/core#', dcterms: 'http://purl.org/dc/terms/',
        rdfs: 'http://www.w3.org/2000/01/rdf-schema#', rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#'
      },
      '@graph': graph
    };
  }

  function waitForFiniteDuration(media) {
    return new Promise(function (resolve) {
      if (isFinite(media.duration) && media.duration > 0) { resolve(); return; }
      var done = false;
      function finish(force) {
        if (done) return;
        if (!force && !isFinite(media.duration)) return;
        done = true;
        media.removeEventListener('durationchange', onEv);
        media.removeEventListener('timeupdate', onEv);
        try { media.currentTime = 0; } catch (e) {}
        resolve();
      }
      function onEv() { finish(false); }
      media.addEventListener('durationchange', onEv);
      media.addEventListener('timeupdate', onEv);
      try { media.currentTime = 1e7; } catch (e) {}
      setTimeout(function () { finish(true); }, 3000);
    });
  }

  function inRanges(ranges, tm, key) {
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      if ((!key || r[key]) && tm >= r.s && tm < r.e) return true;

  function pickInterval(d) {

  // --- Θόλωμα (με υποστήριξη iOS) ---
  var _filterSupported = null;
  function supportsCanvasFilter() {
    if (_filterSupported !== null) return _filterSupported;
    try {
      var c = document.createElement('canvas'); c.width = 5; c.height = 5;
      var x = c.getContext('2d');
      if (!('filter' in x)) return (_filterSupported = false);
      x.fillStyle = '#000'; x.fillRect(0, 0, 5, 5);
      x.filter = 'blur(2px)';
      x.fillStyle = '#fff'; x.fillRect(2, 2, 1, 1);
      _filterSupported = x.getImageData(1, 2, 1, 1).data[0] > 0;
    } catch (e) { _filterSupported = false; }
    return _filterSupported;
  }

  function buildBlurSource(src, dst) {
    var w = src.width, h = src.height;
    dst.width = w; dst.height = h;
    var dctx = dst.getContext('2d');
    if (supportsCanvasFilter()) {
      dctx.filter = 'blur(16px)'; dctx.drawImage(src, 0, 0); dctx.filter = 'none';
      return;
    }
    var target = Math.max(8, Math.round(w / 20));
    var steps = [], cur = src, cw = w, ch = h;
    while (cw / 2 >= target) {
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(cw / 2)); c.height = Math.max(1, Math.round(ch / 2));
      var cc = c.getContext('2d');
      cc.imageSmoothingEnabled = true; cc.imageSmoothingQuality = 'high';
      cc.drawImage(cur, 0, 0, c.width, c.height);
      steps.push(c); cur = c; cw = c.width; ch = c.height;
    }
    for (var i = steps.length - 2; i >= 0; i--) {
      var up = steps[i], uc = up.getContext('2d');
      uc.imageSmoothingEnabled = true; uc.imageSmoothingQuality = 'high';
      uc.clearRect(0, 0, up.width, up.height);
      uc.drawImage(cur, 0, 0, up.width, up.height);
      cur = up;
    }
    dctx.imageSmoothingEnabled = true; dctx.imageSmoothingQuality = 'high';
    dctx.drawImage(cur, 0, 0, w, h);
  }

  function blurDot(tctx, src, x, y, r) {
    tctx.save();
    tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI * 2); tctx.clip();
    tctx.drawImage(src, 0, 0);
    tctx.restore();
  }

  function paintStrokes(tctx, src, strokes, w, h) {
    strokes.forEach(function (g) { g.forEach(function (p) { blurDot(tctx, src, p.x * w, p.y * h, p.r * w); }); });
  }

  function redrawImage() {
    if (!imgObj) return;
    ctx.drawImage(imgObj, 0, 0, canvas.width, canvas.height);
    paintStrokes(ctx, blurSrc, imgStrokes, canvas.width, canvas.height);
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error(t('errImage'))); };
      im.src = url;
    });
  }

  async function renderImageFinal(file, strokes) {
    var im = await loadImage(file);
    var k = Math.min(1, MAX_IMAGE_W / im.width);
    var c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    var cctx = c.getContext('2d', { alpha: false });
    cctx.drawImage(im, 0, 0, c.width, c.height);
    if (strokes && strokes.length) {
      var bs = document.createElement('canvas');
      buildBlurSource(c, bs);
      paintStrokes(cctx, bs, strokes, c.width, c.height);

    return await new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.82); });
  }

  function updateSliderAria(el, media) {

    el.setAttribute('aria-valuemax', d.toFixed(1));

  function sliderKeys(media, e) {
    var d = media.duration;
    if (!isFinite(d) || d <= 0) return;
    var step = e.shiftKey ? 5 : 1, nt = null;
    switch (e.key) {
      case 'ArrowRight': case 'ArrowUp': nt = media.currentTime + step; break;
      case 'ArrowLeft': case 'ArrowDown': nt = media.currentTime - step; break;
      case 'PageUp': nt = media.currentTime + 10; break;
      case 'PageDown': nt = media.currentTime - 10; break;
      case 'Home': nt = 0; break;
      case 'End': nt = d; break;
      case ' ': case 'Enter':
        e.preventDefault();
        if (media.paused) media.play(); else media.pause();
        return;
      default: return;
    }
    e.preventDefault();
    media.currentTime = Math.max(0, Math.min(d, nt));

  // --- Timeline βίντεο ---
  function drawTicks(gctx, width, height, duration, topOffset, labelY) {
    var interval = pickInterval(duration);
    gctx.fillStyle = 'rgba(242, 237, 228, 0.9)';
    gctx.font = '11px monospace';
    gctx.textBaseline = 'top';
    for (var tt = 0; tt <= duration; tt += interval) {
      var x = (tt / duration) * width;
      gctx.textAlign = x < 10 ? 'left' : (x > width - 15 ? 'right' : 'center');
      gctx.fillText(tt + 's', x, labelY);
      gctx.fillStyle = 'rgba(242, 237, 228, 0.15)';
      gctx.fillRect(x, topOffset, 1, height - topOffset);
      gctx.fillStyle = 'rgba(242, 237, 228, 0.9)';
    }
  }

  function updateVideoTimeline() {
    cachedVideoRanges = readVideoRanges();
    applyVideoFx();

    var timeline = $('videoTimeline');
    timeline.innerHTML = '';
    var duration = $('videoPreview').duration;
    if (!isFinite(duration) || duration <= 0) return;

    var gc = $('videoGridCanvas'), gctx = gc.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = gc.getBoundingClientRect();
    var width = rect.width || gc.parentElement.clientWidth || 300, height = rect.height || 60;
    gc.width = width * dpr; gc.height = height * dpr;
    gctx.scale(dpr, dpr);
    gctx.clearRect(0, 0, width, height);
    var topOffset = 18;
    drawTicks(gctx, width, height, duration, topOffset, 4);

    cachedVideoRanges.forEach(function (r) {
      var leftPct = Math.max(0, Math.min(100, (r.s / duration) * 100));
      var widthPct = Math.max(0, Math.min(100 - leftPct, ((r.e - r.s) / duration) * 100));
      ['blur', 'mute'].forEach(function (kind) {
        if (!r[kind]) return;
        var b = document.createElement('div');
        b.className = 'timeline-block ' + kind;

  function drawWaveform(buffer) {
    var wc = $('audioWaveCanvas'), wctx = wc.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = wc.getBoundingClientRect();
    var width = rect.width || wc.parentElement.clientWidth || 300, height = rect.height || 90;
    wc.width = width * dpr; wc.height = height * dpr;
    wctx.scale(dpr, dpr);
    wctx.clearRect(0, 0, width, height);

    var topOffset = 16, waveH = height - topOffset;
    wctx.fillStyle = 'rgba(124, 202, 235, 0.25)';
    wctx.fillRect(0, topOffset + waveH / 2 - 1, width, 2);
    wctx.fillStyle = '#7CCAEB';

    var data = buffer.getChannelData(0);
    var step = Math.ceil(data.length / width), amp = waveH / 2;
    for (var i = 0; i < width; i++) {
      var min = 1, max = -1, start = i * step, end = Math.min(start + step, data.length);
      for (var j = start; j < end; j++) { var d = data[j]; if (d < min) min = d; if (d > max) max = d; }
      var y1 = topOffset + (1 + min) * amp, y2 = topOffset + (1 + max) * amp;
      wctx.fillRect(i, y1, 1, Math.max(1, y2 - y1));
    }
    if (isFinite(buffer.duration) && buffer.duration > 0) drawTicks(wctx, width, height, buffer.duration, topOffset - 2, 2);
  }

  $('recordAudioBtn').onclick = async function () {
    try {
      recordingStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      audioChunks = []; recCancelled = false;

      var mimeType = '';
      ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].some(function (ty) {
        if (MediaRecorder.isTypeSupported(ty)) { mimeType = ty; return true; }
        return false;
      });

      mediaRecorder = new MediaRecorder(recordingStream, mimeType ? { mimeType: mimeType } : {});
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = function () {
        if (recordingStream) { recordingStream.getTracks().forEach(function (tr) { tr.stop(); }); recordingStream = null; }
        if (recCancelled) return;
        var finalMime = mediaRecorder.mimeType || 'audio/mp4';
        var ext = finalMime.includes('webm') ? 'webm' : (finalMime.includes('ogg') ? 'ogg' : 'm4a');
        var fileName = t('recordingFile') + '_' + new Date().toISOString().slice(0, 10) + '.' + ext;
        var recordedFile = new File([new Blob(audioChunks, { type: finalMime })], fileName, { type: finalMime });
        closeDialog('recorderModal', true);
        window.currentEditIndex = -1;
        loadFileIntoEditor(recordedFile, null);
      };

      mediaRecorder.start(250);
      recSeconds = 0;
      $('recStatusTimer').textContent = '00:00';
      openDialog('recorderModal');
      recTimerInterval = setInterval(function () {
        recSeconds++;
        $('recStatusTimer').textContent = String(Math.floor(recSeconds / 60)).padStart(2, '0') + ':' + String(recSeconds % 60).padStart(2, '0');
      }, 1000);
    } catch (err) {
      alert(t('micError') + (err.message || err));

  };

    try { $('videoPreview').pause(); $('audioPreview').pause(); } catch (e) {}

    resetPreviewFx();

    if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);

    var kind = getKind(file);

    if (kind === 'image') {
      $('imageEditor').style.display = 'block';

      imgObj = null;

        imgObj = im;
        var k = Math.min(1, MAX_IMAGE_W / im.width);
        canvas.width = Math.round(im.width * k);
        canvas.height = Math.round(im.height * k);
        ctx.drawImage(im, 0, 0, canvas.width, canvas.height);
        buildBlurSource(canvas, blurSrc);
        redrawImage();
      };
      im.src = currentObjectURL;
      openDialog('editorSheet', canvas);
    }
    else if (kind === 'video') {
      $('videoEditor').style.display = 'block';

          vidLoading = false;
          renderVideoTime();

            savedMeta.ranges.forEach(function (r) { addVideoRangeRow(r.s, r.e, r.mute, r.blur); });
          } else {

          updateVideoTimeline();

    else {

  // --- Πινέλο θολώματος (αφή/ποντίκι) ---
  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cX = (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX;
    var cY = (e.touches && e.touches.length) ? e.touches[0].clientY : e.clientY;
    return { x: (cX - rect.left) * canvas.width / rect.width, y: (cY - rect.top) * canvas.height / rect.height };
  }

  function brushR() { return Math.max(BRUSH_MIN, canvas.width * BRUSH_FRAC); }

  function addStrokePoint(pos) {
    var w = canvas.width, h = canvas.height, r = brushR();
    var last = curStroke.length ? curStroke[curStroke.length - 1] : null;
    var pts = [];
    if (last) {
      var lx = last.x * w, ly = last.y * h;
      var n = Math.floor(Math.hypot(pos.x - lx, pos.y - ly) / (r / 2));
      for (var i = 1; i <= n; i++) pts.push({ x: lx + (pos.x - lx) * i / (n + 1), y: ly + (pos.y - ly) * i / (n + 1) });
    }
    pts.push(pos);
    pts.forEach(function (p) {
      curStroke.push({ x: p.x / w, y: p.y / h, r: r / w });
      blurDot(ctx, blurSrc, p.x, p.y, r);
    });
  }

  function handleDrawStart(e) {
    if (!imgObj) return;
    e.preventDefault();
    isDrawing = true;
    curStroke = [];
    imgStrokes.push(curStroke);
    addStrokePoint(getCanvasPos(e));
  }
  function handleDrawMove(e) { if (!isDrawing) return; e.preventDefault(); addStrokePoint(getCanvasPos(e)); }
  function handleDrawEnd() { isDrawing = false; curStroke = null; }

  canvas.addEventListener('touchstart', handleDrawStart, { passive: false });
  canvas.addEventListener('touchmove', handleDrawMove, { passive: false });
  canvas.addEventListener('touchend', handleDrawEnd);
  canvas.addEventListener('touchcancel', handleDrawEnd);
  canvas.addEventListener('mousedown', handleDrawStart);
  canvas.addEventListener('mousemove', handleDrawMove);
  canvas.addEventListener('mouseup', handleDrawEnd);
  canvas.addEventListener('mouseleave', handleDrawEnd);

  // --- Πινέλο με πληκτρολόγιο (WCAG 2.1.1) ---
  function placeKbCursor() {
    var cur = $('kbCursor');
    var cw = canvas.clientWidth, chh = canvas.clientHeight;
    if (!cw || !canvas.width) return;
    var d = (brushR() / canvas.width) * cw * 2;
    cur.style.width = d + 'px';
    cur.style.height = d + 'px';
    cur.style.left = (canvas.offsetLeft + kbPos.x * cw) + 'px';
    cur.style.top = (canvas.offsetTop + kbPos.y * chh) + 'px';
  }

  canvas.addEventListener('focus', function () {
    if (canvas.matches(':focus-visible')) { $('kbCursor').style.display = 'block'; placeKbCursor(); }
  });
  canvas.addEventListener('blur', function () { $('kbCursor').style.display = 'none'; });

  canvas.addEventListener('keydown', function (e) {
    if (!imgObj) return;
    var step = e.shiftKey ? 0.1 : 0.02, handled = true;
    switch (e.key) {
      case 'ArrowLeft': kbPos.x = Math.max(0, kbPos.x - step); break;
      case 'ArrowRight': kbPos.x = Math.min(1, kbPos.x + step); break;
      case 'ArrowUp': kbPos.y = Math.max(0, kbPos.y - step); break;
      case 'ArrowDown': kbPos.y = Math.min(1, kbPos.y + step); break;
      case 'Enter': case ' ':
        curStroke = [];
        imgStrokes.push(curStroke);
        addStrokePoint({ x: kbPos.x * canvas.width, y: kbPos.y * canvas.height });
        curStroke = null;
        break;
      default: handled = false;
    }
    if (handled) {
      e.preventDefault();
      $('kbCursor').style.display = 'block';
      placeKbCursor();
    }
  });
