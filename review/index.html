<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Walking Memory · Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  :root {
    --petrol: #186078; --petrol-deep: #0E3F50; --sky: #249CCC; --sky-soft: #E7F4FA; --amber: #E0904F; --amber-text: #9A5413;
    --ink: #12303B; --muted: #4B6470; --line: #D3E3EA; --line-strong: #6F8D99; --mist: #F2F7F9; --danger: #B3261E; --ok: #2E7D32;
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--mist); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; border: 0; border-radius: 999px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 24px; background: var(--petrol); color: #fff; }
  header h1 { margin: 0; font-size: 22px; font-style: italic; flex: 1 1 auto; }
  header select, header button, header a.hbtn { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 0; font-weight: 700; color: var(--petrol); background: #fff; text-decoration: none; display: inline-flex; align-items: center; }
  header a.hbtn { background: rgba(255,255,255,.15); color: #fff; }
  #userName { font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .login { max-width: 460px; margin: 40px auto; }
  .login label { display: block; font-weight: 600; color: var(--petrol); margin: 10px 0 4px; }
  .login input { width: 100%; padding: 10px 12px; border: 2px solid var(--line-strong); border-radius: 10px; }
  h2 { margin: 0 0 6px; color: var(--petrol); font-size: 22px; font-style: italic; }
  h3 { margin: 16px 0 6px; font-size: 18px; color: var(--petrol); font-style: italic; }
  .lead, .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .err { color: var(--danger); font-weight: 600; }
  .btn { background: var(--petrol); color: #fff; font-weight: 700; padding: 10px 20px; min-height: 44px; }
  .btn-ok { background: var(--ok); color: #fff; font-weight: 700; padding: 10px 22px; min-height: 48px; font-size: 17px; }
  .btn-sec { background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); font-weight: 700; padding: 8px 18px; min-height: 44px; }
  .btn-x { background: none; color: var(--danger); font-weight: 700; padding: 4px 10px; min-height: 32px; text-decoration: underline; }
  .btn:disabled, .btn-ok:disabled { opacity: .55; cursor: default; }

  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
  .layout > * { min-width: 0; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } main { padding: 14px 12px 50px; } header { padding: 10px 12px; } }
  .queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .queue button { width: 100%; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: #fff; padding: 10px 14px; color: var(--ink); }
  .queue button[aria-current="true"] { border: 2px solid var(--amber); background: #FFF8F1; }
  .queue b { display: block; color: var(--petrol); font-style: italic; }
  .queue span { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 15px; padding: 6px 0; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .meta a { color: var(--petrol); font-weight: 600; }
  .progress { font-weight: 700; color: var(--amber-text); font-size: 14px; margin: 0 0 6px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .tile { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; border-radius: 14px; overflow: hidden; background: #fff; border: 2px solid var(--line); color: var(--ink); min-height: 190px; }
  .tile:hover { border-color: var(--sky); }
  .tile.seen { border-color: var(--ok); }
  .tile .th { height: 120px; background: var(--sky-soft); display: flex; align-items: center; justify-content: center; font-size: 42px; }
  .tile .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .tx { padding: 8px 10px 10px; display: grid; gap: 2px; }
  .tile .tx b { font-size: 14px; color: var(--petrol); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .tx span { font-size: 12px; color: var(--muted); }
  .tile .no { position: absolute; top: 8px; left: 8px; background: rgba(14,63,80,.85); color: #fff; font-weight: 700; font-size: 13px; border-radius: 999px; min-width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .tile .badges { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .tile .badges span { background: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 2px 8px; color: var(--petrol); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .tile .badges .ok { color: var(--ok); }

  .comments { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .comments li { border-left: 4px solid var(--sky); background: var(--sky-soft); border-radius: 8px; padding: 8px 12px; }
  .comments .c-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .comments .c-meta button.frag { background: #fff; color: var(--petrol); border: 1px solid var(--line-strong); font-size: 12px; font-weight: 700; padding: 1px 8px; }
  .comments p { margin: 4px 0 0; white-space: pre-wrap; }
  .add { display: grid; gap: 8px; margin-top: 10px; }
  .add label { font-weight: 600; color: var(--petrol); }
  .add textarea { width: 100%; padding: 10px 12px; border: 2px solid var(--line-strong); border-radius: 10px; resize: vertical; }
  .add select { justify-self: stretch; width: 100%; text-overflow: ellipsis; padding: 8px 12px; border: 2px solid var(--line-strong); border-radius: 999px; background: #fff; color: var(--petrol); font-weight: 700; max-width: 100%; }
  .finish { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  dialog { width: min(760px, calc(100% - 20px)); max-height: calc(100% - 20px); border: 0; border-radius: 18px; padding: 18px 20px; color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(14,63,80,.55); }
  .fd-media img, .fd-media video { width: 100%; max-height: 52vh; object-fit: contain; background: #000; border-radius: 12px; display: block; }
  .fd-media audio { width: 100%; }
  dl.w4 { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 14px 0; }
  dl.w4 dt { font-weight: 700; color: var(--petrol); }
  dl.w4 dd { margin: 0; }
  dl.w4 dd.none { color: var(--muted); font-style: italic; }
  .fd-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 14px; }
  .edit { display: grid; gap: 6px; margin: 12px 0; padding: 14px 16px; border: 2px solid var(--sky); border-radius: 14px; background: #F7FBFD; }
  .edit label, .edit .lbl { font-weight: 600; color: var(--petrol); margin-top: 6px; }
  .edit input { width: 100%; padding: 9px 12px; border: 2px solid var(--line-strong); border-radius: 10px; background: #fff; color: var(--ink); }
  .edit .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .edit .note { margin: 0; }
  .edit-btn { margin: 0 0 12px; }
  .pk { display: grid; gap: 6px; }
  .pk-search { display: flex; flex-wrap: wrap; gap: 8px; }
  .pk-search input { flex: 1 1 180px; min-width: 0; }
  .pk-results { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .pk-results button { width: 100%; text-align: left; border-radius: 10px; background: #fff; border: 1px solid var(--line); padding: 6px 10px; color: var(--ink); font-size: 14px; }
  .pk-results .none { color: var(--muted); font-size: 14px; }
  .pk-map { height: 240px; border-radius: 12px; border: 1px solid var(--line); }
  .pk-foot { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 14px; color: var(--muted); }
  .pk-foot .btn-sec { min-height: 36px; padding: 4px 14px; font-size: 14px; }
  #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--petrol-deep); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 30; max-width: calc(100% - 24px); }
  #status.bad { background: var(--danger); }
</style>
</head>
<body>
<header>
  <h1 data-i="title"></h1>
  <a class="hbtn" href="../upload/" data-i="toUpload"></a>
  <select id="lang" aria-label="Language"><option value="el">EL</option><option value="en">EN</option><option value="fr">FR</option><option value="it">IT</option></select>
  <span id="userName"></span>
  <button id="logout" type="button" hidden data-i="logout"></button>
</header>
<main>
  <section id="loginView" class="card login" hidden>
    <h2 data-i="login"></h2>
    <p class="note" data-i="loginHint"></p>
    <form id="loginForm" novalidate>
      <label for="email" data-i="email"></label><input id="email" type="email" autocomplete="email" required>
      <label for="pass" data-i="password"></label><input id="pass" type="password" autocomplete="current-password" required>
      <p id="loginErr" class="err" role="alert"></p>
      <button class="btn" type="submit" data-i="login" style="margin-top:12px"></button>
    </form>
  </section>
  <div id="app" class="layout" hidden>
    <section class="card" aria-labelledby="hQueue">
      <h2 id="hQueue"></h2>
      <p class="lead" data-i="queueLead"></p>
      <p id="loadInfo" class="note" role="status"></p>
      <ul id="queue" class="queue"></ul>
    </section>
    <section class="card" aria-labelledby="sTitle" id="storyPane">
      <div id="noStory"><p class="empty" data-i="pickStory"></p></div>
      <div id="story" hidden>
        <h2 id="sTitle" tabindex="-1"></h2>
        <div id="sMeta" class="meta"></div>
        <button type="button" class="btn-sec edit-btn" id="sEditBtn" data-i="editStory"></button>
        <form id="sEdit" class="edit" hidden novalidate>
          <p class="note" data-i="editNote"></p>
          <label for="sTitleIn" data-i="storyTitleL"></label>
          <input id="sTitleIn" type="text" maxlength="120" autocomplete="off" required>
          <span class="lbl" id="sLocL" data-i="storyLocL"></span>
          <p class="note" data-i="mapHint"></p>
          <div id="sPk" class="pk" role="group" aria-labelledby="sLocL"></div>
          <div class="row"><button type="submit" class="btn" data-i="save"></button> <button type="button" class="btn-sec" id="sEditCancel" data-i="cancel"></button> <span id="sEditErr" class="err" role="alert"></span></div>
        </form>
        <p class="lead" data-i="storyLead"></p>
        <h3 id="hFrags"></h3>
        <p id="seenInfo" class="progress" aria-live="polite"></p>
        <div id="tiles" class="tiles"></div>
        <h3 id="hComments"></h3>
        <ul id="comments" class="comments"></ul>
        <div class="add">
          <label for="cBody" data-i="addLabel"></label>
          <select id="cAbout" aria-label="About"></select>
          <textarea id="cBody" rows="3" maxlength="4000"></textarea>
          <div><button type="button" class="btn" id="cAdd" data-i="addBtn"></button> <span id="cErr" class="err" role="alert"></span></div>
        </div>
        <div class="finish">
          <button type="button" class="btn-ok" id="sendBtn" data-i="sendBtn"></button>
          <span class="note" data-i="sendHint" style="margin:0"></span>
        </div>
      </div>
    </section>
  </div>
</main>

<!-- one fragment -->
<dialog id="fragDlg" aria-labelledby="fdTitle">
  <h2 id="fdTitle"></h2>
  <div id="fdMedia" class="fd-media"></div>
  <dl id="fdW4" class="w4"></dl>
  <button type="button" class="btn-sec edit-btn" id="fdEditBtn" data-i="editFrag"></button>
  <form id="fdEdit" class="edit" hidden novalidate>
    <p class="note" data-i="editNote"></p>
    <label for="fTitleIn" data-i="fTitle"></label><input id="fTitleIn" type="text" maxlength="120" autocomplete="off">
    <label for="fWhoIn" data-i="fWho"></label><input id="fWhoIn" type="text" maxlength="200" autocomplete="off">
    <label for="fWhatIn" data-i="fWhat"></label><input id="fWhatIn" type="text" maxlength="200" autocomplete="off">
    <label for="fPlaceIn" data-i="fWhere"></label><input id="fPlaceIn" type="text" maxlength="200" autocomplete="off">
    <span class="lbl" id="fPointL" data-i="fPoint"></span>
    <p class="note" data-i="mapHint"></p>
    <div id="fPk" class="pk" role="group" aria-labelledby="fPointL"></div>
    <label for="fWhenIn" data-i="fWhen"></label><input id="fWhenIn" type="text" maxlength="120" autocomplete="off">
    <label for="fDateIn" data-i="fRecorded"></label><input id="fDateIn" type="date">
    <div class="row"><button type="submit" class="btn" data-i="save"></button> <button type="button" class="btn-sec" id="fdEditCancel" data-i="cancel"></button> <span id="fdEditErr" class="err" role="alert"></span></div>
  </form>
  <ul id="fdComments" class="comments"></ul>
  <div class="add">
    <label for="fdBody" data-i="fragCommentLabel"></label>
    <textarea id="fdBody" rows="2" maxlength="4000"></textarea>
    <div><button type="button" class="btn" id="fdAdd" data-i="addBtn"></button> <span id="fdErr" class="err" role="alert"></span></div>
  </div>
  <div class="fd-nav">
    <span><button type="button" class="btn-sec" id="fdPrev" data-i="prev"></button> <button type="button" class="btn-sec" id="fdNext" data-i="next"></button></span>
    <button type="button" class="btn" id="fdClose" data-i="close"></button>
  </div>
</dialog>
<div id="status" role="status" hidden></div>

  }
  function renderFragComments() { var m = D.cur.story_media[fi]; renderComments($('fdComments'), commentsFor(m.id), false); }
  function stopMedia() { $('fdMedia').querySelectorAll('audio, video').forEach(function (m) { m.pause(); m.removeAttribute('src'); m.load(); }); }
  $('fdAdd').onclick = function () { addComment(D.cur.story_media[fi].id, $('fdBody'), $('fdErr'), this); };
  $('fdPrev').onclick = function () { openFrag(fi - 1); };
  $('fdNext').onclick = function () { openFrag(fi + 1); };
  $('fdClose').onclick = function () { if (fragDirty() && !window.confirm(t('discardQ'))) return; $('fragDlg').close(); };
  $('fragDlg').addEventListener('cancel', function (ev) { if (fragDirty() && !window.confirm(t('discardQ'))) ev.preventDefault(); });
  $('fragDlg').addEventListener('close', function () {
    closeFragEdit();
    stopMedia();
    var b = $('tiles').children[fi]; if (b) b.focus();
  });

  // ---- corrections while the story waits for review (the database refuses them after "Send to annotation") ----
  function editErr(e) {
    var m = errText(e) + ' ' + ((e && e.code) || '');
    if (/permission denied|schema cache|does not exist/i.test(m)) return t('needSql');
    if (/row-level security|42501|waits for review/i.test(m)) return t('gone');
    return t('saveErr', { e: errText(e) });
  }
  // A small map with place search: click or drag the pin to set the point; "required" hides "Remove the point"
  function makePicker(box, required) {
    var P = { lat: null, lon: null, map: null, mk: null, onPick: null };
    var bar = el('div', 'pk-search'), q = el('input'), go = el('button', 'btn-sec'), ul = el('ul', 'pk-results'), mapDiv = el('div', 'pk-map');
    var foot = el('div', 'pk-foot'), info = el('span'), rm = el('button', 'btn-sec');
    q.type = 'search'; q.autocomplete = 'off'; go.type = 'button'; rm.type = 'button';
    bar.appendChild(q); bar.appendChild(go); foot.appendChild(info); if (!required) foot.appendChild(rm);
    box.innerHTML = ''; box.appendChild(bar); box.appendChild(ul); box.appendChild(mapDiv); box.appendChild(foot);
    function label() {
      q.placeholder = t('searchPh'); q.setAttribute('aria-label', t('searchPh')); go.textContent = t('searchBtn'); rm.textContent = t('removePoint');
      info.textContent = P.lat == null ? t('noPoint') : t('pointAt', { p: P.lat.toFixed(5) + ', ' + P.lon.toFixed(5) });
      rm.hidden = P.lat == null;
    }
    function set(la, lo, center) {
      P.lat = la == null ? null : +la; P.lon = lo == null ? null : +lo;
      if (P.map) {
        if (P.lat == null) { if (P.mk) { P.map.removeLayer(P.mk); P.mk = null; } }
        else {
          if (!P.mk) { P.mk = L.marker([P.lat, P.lon], { draggable: true }).addTo(P.map); P.mk.on('dragend', function () { var c = P.mk.getLatLng(); set(c.lat, c.lng); }); }
          else P.mk.setLatLng([P.lat, P.lon]);
          if (center) P.map.setView([P.lat, P.lon], Math.max(P.map.getZoom(), 16));
        }
      }
      label();
    }
    async function search() {
      var text = q.value.trim(); ul.innerHTML = ''; if (!text) return;
      try {
        var r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=' + encodeURIComponent(LANG) + '&q=' + encodeURIComponent(text));
        if (!r.ok) throw new Error(r.status);
        var d = await r.json();
        if (!d.length) { ul.appendChild(el('li', 'none', t('placeNone'))); return; }
        d.forEach(function (x) {
          var li = el('li'), b = el('button', null, x.display_name); b.type = 'button';
          b.onclick = function () { ul.innerHTML = ''; set(+x.lat, +x.lon, true); if (P.onPick) P.onPick(x); };
          li.appendChild(b); ul.appendChild(li);
        });
      } catch (e) { ul.appendChild(el('li', 'none', t('placeErr', { e: e.message || e }))); }
    }
    go.onclick = search;
    q.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); search(); } });
    rm.onclick = function () { set(null, null); };
    // open(lat, lon, search text, centre when there is no point)
    P.open = function (la, lo, text, around) {
      q.value = text || ''; ul.innerHTML = '';
      if (window.L && !P.map) {
        P.map = L.map(mapDiv);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(P.map);
        P.map.on('click', function (ev) { set(ev.latlng.lat, ev.latlng.lng); });
      }
      mapDiv.hidden = !P.map;
      if (P.map) { if (P.mk) { P.map.removeLayer(P.mk); P.mk = null; } var c = la != null ? [la, lo] : around; P.map.setView(c, la != null ? 16 : 14); }
      set(la, lo);
      if (P.map) setTimeout(function () { P.map.invalidateSize(); }, 60);
    };
    P.label = label;
    return P;
  }

  // story title and location
  var sPk = null, sEditFor = null;
  function closeStoryEdit() { sEditFor = null; $('sEdit').hidden = true; $('sEditBtn').hidden = false; }
  $('sEditBtn').onclick = function () {
    var s = D.cur; if (!s) return;
    sEditFor = s.id; $('sEdit').hidden = false; $('sEditBtn').hidden = true; $('sEditErr').textContent = '';
    $('sTitleIn').value = s.title;
    if (!sPk) sPk = makePicker($('sPk'), true);
    sPk.open(s.lat, s.lon, '', [s.lat, s.lon]);
    $('sTitleIn').focus();
  };
  $('sEditCancel').onclick = function () { closeStoryEdit(); $('sEditBtn').focus(); };
  $('sEdit').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var s = D.cur, err = $('sEditErr'), title = $('sTitleIn').value.trim().slice(0, 120), patch = {};
    err.textContent = '';
    if (!title) { err.textContent = t('needTitle'); $('sTitleIn').focus(); return; }
    if (title !== s.title) patch.title = title;
    if (sPk.lat !== +s.lat || sPk.lon !== +s.lon) { patch.lat = sPk.lat; patch.lon = sPk.lon; }
    if (!Object.keys(patch).length) { closeStoryEdit(); $('sEditBtn').focus(); return; }
    var btn = this.querySelector('[type=submit]'); btn.disabled = true;
    var r = await sb.from('stories').update(patch).eq('id', s.id).eq('status', 'pending').select('id');
    btn.disabled = false;
    if (r.error) { err.textContent = editErr(r.error); return; }
    if (!r.data || !r.data.length) { closeStoryEdit(); say(t('gone'), true); await load(); return; }
    Object.assign(s, patch); closeStoryEdit(); renderAll(); say(t('saved')); $('sEditBtn').focus();
  });

  // one fragment's details
  var fPk = null, fEditing = false, fStart = '';
  var FFIELDS = [['title', 'fTitleIn'], ['about', 'fWhoIn'], ['what', 'fWhatIn'], ['place_name', 'fPlaceIn'], ['period', 'fWhenIn'], ['recorded_at', 'fDateIn']];
  function fragForm() {
    var v = {};
    FFIELDS.forEach(function (f) { v[f[0]] = $(f[1]).value.trim() || null; });
    v.lat = fPk ? fPk.lat : null; v.lon = fPk ? fPk.lon : null;
    return v;
  }
  function fragDirty() { return fEditing && JSON.stringify(fragForm()) !== fStart; }
  function closeFragEdit() {
    if (!fEditing) return;
    fEditing = false; $('fdEdit').hidden = true; $('fdW4').hidden = false; $('fdEditBtn').hidden = false;
    if (D.cur) { $('fdPrev').disabled = fi === 0; $('fdNext').disabled = fi === D.cur.story_media.length - 1; }
  }
  $('fdEditBtn').onclick = function () {
    var s = D.cur, m = s.story_media[fi];
    fEditing = true; $('fdEdit').hidden = false; $('fdW4').hidden = true; $('fdEditBtn').hidden = true; $('fdEditErr').textContent = '';
    FFIELDS.forEach(function (f) { $(f[1]).value = m[f[0]] || ''; });
    if (!fPk) {
      fPk = makePicker($('fPk'), false);
      fPk.onPick = function (x) { if (!$('fPlaceIn').value.trim()) $('fPlaceIn').value = String(x.name || x.display_name || '').split(',')[0].slice(0, 200); };
    }
    fPk.open(m.lat, m.lon, m.place_name || '', [s.lat, s.lon]);
    $('fdPrev').disabled = $('fdNext').disabled = true;   // save or cancel first
    fStart = JSON.stringify(fragForm());
    $('fTitleIn').focus();
  };
  $('fdEditCancel').onclick = function () { closeFragEdit(); $('fdEditBtn').focus(); };
  $('fdEdit').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var m = D.cur.story_media[fi], v = fragForm(), patch = {}, err = $('fdEditErr');
    err.textContent = '';
    Object.keys(v).forEach(function (k) {
      var old = m[k] == null ? null : (k === 'lat' || k === 'lon') ? +m[k] : String(m[k]);
      if (v[k] !== old) patch[k] = v[k];
    });
    if ('lat' in patch || 'lon' in patch) { patch.lat = v.lat; patch.lon = v.lon; }
    if (!Object.keys(patch).length) { closeFragEdit(); $('fdEditBtn').focus(); return; }
    var btn = this.querySelector('[type=submit]'); btn.disabled = true;
    var r = await sb.from('story_media').update(patch).eq('id', m.id).select('id');
    btn.disabled = false;
    if (r.error) { err.textContent = editErr(r.error); return; }
    if (!r.data || !r.data.length) { err.textContent = t('gone'); return; }
    Object.assign(m, patch); closeFragEdit(); renderFragInfo(); renderStory(); say(t('saved')); $('fdEditBtn').focus();
  });

  // ---- finish: send to annotation ----
  $('sendBtn').onclick = async function () {
    var s = D.cur; if (!s) return;
    var seen = D.seen[s.id] || {}, unseen = s.story_media.filter(function (m) { return !seen[m.id]; }).length;
    if (!window.confirm(unseen ? t('sendQUnseen', { n: unseen, t: s.title }) : t('sendQ', { t: s.title }))) return;
    var b = this; b.disabled = true;
    var r = await sb.from('stories').update({ status: 'draft' }).eq('id', s.id).eq('status', 'pending').select('id');
    b.disabled = false;
    if (r.error) { say(/status|check|schema cache/i.test(errText(r.error)) ? t('needSql') : t('saveErr', { e: errText(r.error) }), true); return; }
    if (!r.data || !r.data.length) { say(t('gone'), true); await load(); return; }
    D.stories = D.stories.filter(function (x) { return x.id !== s.id; }); D.cur = null; D.comments = [];
    renderAll(); say(t('sent', { t: s.title }));
  };

  applyLang();
  if (!sb) { $('loginView').hidden = false; $('loginErr').textContent = 'Supabase is not configured (config.js).'; return; }
  sb.auth.onAuthStateChange(function (_e, session) { setTimeout(function () { onSession(session); }, 0); });   // as on the validation page (no database call inside the callback)
})();
</script>
</body>
