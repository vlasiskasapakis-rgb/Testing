<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Walking Memory · Facilitator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  :root {
    --petrol: #186078; --petrol-deep: #0E3F50; --sky: #249CCC; --sky-soft: #E7F4FA; --amber: #E0904F; --amber-text: #9A5413; --amber-soft: #FFF3E8;
    --ink: #12303B; --muted: #4B6470; --line: #D3E3EA; --line-strong: #6F8D99; --mist: #F2F7F9; --danger: #B3261E; --ok: #2E7D32; --ok-soft: #E8F5E9;
    --grey: #8A979D; --grey-soft: #EEF1F2;
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--mist); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: 0; border-radius: 999px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  a { color: var(--petrol); }
  header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 24px; background: var(--petrol); color: #fff; }
  header.top h1 { margin: 0; font-size: 21px; font-style: italic; flex: 1 1 auto; }
  header.top h1 small { font-style: normal; font-weight: 600; font-size: 15px; opacity: .9; }
  header.top nav { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; order: 5; }
  header.top nav a { color: #fff; text-decoration: none; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.12); }
  header.top nav a[aria-current="page"] { background: #fff; color: var(--petrol); }
  header.top select, header.top button { min-height: 36px; padding: 5px 14px; border-radius: 999px; border: 0; font-weight: 700; color: var(--petrol); background: #fff; }
  #userName { font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 70px; }
  @media (max-width: 700px) { main { padding: 14px 12px 60px; } header.top { padding: 10px 12px; position: static; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; min-width: 0; }
  .login { max-width: 460px; margin: 40px auto; }
  h2 { margin: 0 0 6px; color: var(--petrol); font-size: 23px; font-style: italic; }
  h3 { margin: 16px 0 8px; font-size: 18px; color: var(--petrol); font-style: italic; }
  .lead, .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .err { color: var(--danger); font-weight: 600; }
  .okmsg { color: var(--ok); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row.between { justify-content: space-between; }
  .btn { background: var(--petrol); color: #fff; font-weight: 700; padding: 9px 20px; min-height: 44px; }
  .btn-ok { background: var(--ok); color: #fff; font-weight: 700; padding: 10px 22px; min-height: 48px; font-size: 17px; }
  .btn-sec { background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); font-weight: 700; padding: 7px 16px; min-height: 42px; }
  .btn-sm { min-height: 34px; padding: 4px 12px; font-size: 14px; }
  .btn-danger { background: #fff; color: var(--danger); border: 2px solid var(--danger); font-weight: 700; padding: 7px 16px; min-height: 42px; }
  .btn-link { background: none; color: var(--petrol); font-weight: 700; text-decoration: underline; padding: 4px 6px; min-height: 32px; border-radius: 6px; }
  button:disabled { opacity: .5; cursor: default; }
  label, .lbl { font-weight: 600; color: var(--petrol); }
  .field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin-bottom: 12px; min-width: 0; }
  select { max-width: 100%; min-width: 0; text-overflow: ellipsis; }
  .field input[type=text], .field input[type=date], .field input[type=search], .field select, .field textarea, input.inp, select.inp {
    width: 100%; padding: 9px 12px; border: 2px solid var(--line-strong); border-radius: 10px; background: #fff; }
  .field textarea { resize: vertical; }
  .req::after { content: " *"; color: var(--danger); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  fieldset { border: 0; padding: 0; margin: 0 0 12px; min-width: 0; }
  legend { font-weight: 600; color: var(--petrol); padding: 0; margin-bottom: 4px; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .choice label { font-weight: 400; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
  .chip { display: inline-block; border-radius: 999px; font-size: 13px; font-weight: 700; padding: 2px 10px; background: var(--grey-soft); color: var(--muted); white-space: nowrap; }
  .st-draft { background: var(--grey-soft); color: #44535A; }
  .st-community_validation { background: var(--amber-soft); color: var(--amber-text); }
  .st-ready_for_annotation, .st-submitted, .st-returned { background: var(--sky-soft); color: var(--petrol); }
  .st-published, .st-active { background: var(--ok-soft); color: var(--ok); }
  .st-withdrawn { background: #FDECEA; color: var(--danger); }
  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.tbl th { text-align: left; color: var(--muted); font-size: 13px; font-weight: 700; border-bottom: 2px solid var(--line); padding: 6px 8px; white-space: nowrap; }
  table.tbl td { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; }
  table.tbl tr.click { cursor: pointer; }
  table.tbl tr.click:hover td { background: var(--sky-soft); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 12px; }
  .filters .field { margin: 0; min-width: 150px; flex: 1 1 150px; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }

  /* map picker */
  .pk { display: grid; gap: 6px; min-width: 0; }
  .pk-modes { display: flex; gap: 6px; flex-wrap: wrap; }
  .pk-modes button[aria-pressed="true"] { background: var(--petrol); color: #fff; border-color: var(--petrol); }
  .pk-search { display: flex; flex-wrap: wrap; gap: 8px; }
  .pk-search input { flex: 1 1 180px; min-width: 0; padding: 8px 12px; border: 2px solid var(--line-strong); border-radius: 10px; }
  .pk-results { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .pk-results button { width: 100%; text-align: left; border-radius: 10px; background: #fff; border: 1px solid var(--line); padding: 6px 10px; font-size: 14px; }
  .pk-results .none { color: var(--muted); font-size: 14px; }
  .pk-map { height: 280px; border-radius: 12px; border: 1px solid var(--line); }
  .pk-foot { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 14px; color: var(--muted); }

  /* who chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; border: 2px solid var(--line-strong); border-radius: 10px; background: #fff; }
  .chips span.c { display: inline-flex; align-items: center; gap: 4px; background: var(--sky-soft); color: var(--petrol); font-weight: 600; border-radius: 999px; padding: 2px 4px 2px 10px; }
  .chips span.c button { background: none; color: var(--petrol); font-weight: 700; padding: 0 6px; min-height: 24px; }
  .chips input { flex: 1 1 140px; min-width: 100px; border: 0; padding: 4px; outline: none; }

  /* story editor */
  .story-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  .story-head h2 { margin: 0; }
  .lockbar { background: var(--amber-soft); border: 1px solid #F1C9A5; color: var(--amber-text); border-radius: 12px; padding: 10px 14px; font-weight: 600; margin-bottom: 14px; }
  .drop { border: 3px dashed var(--line-strong); border-radius: 16px; padding: 22px; text-align: center; background: var(--mist); }
  .drop.over { border-color: var(--sky); background: var(--sky-soft); }
  .drop p { margin: 0 0 10px; }
  .queue-up { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 14px; }
  .frags { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
  .frag { border: 2px solid var(--line); border-radius: 14px; background: #fff; min-width: 0; }
  .frag.dragging { opacity: .5; }
  .frag.drop-before { border-top: 4px solid var(--sky); }
  .frag-top { display: grid; grid-template-columns: auto 120px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; }
  @media (max-width: 700px) { .frag-top { grid-template-columns: auto 84px minmax(0, 1fr); } .frag-top .frag-acts { grid-column: 1 / -1; } }
  .handle { cursor: grab; font-size: 20px; color: var(--muted); background: none; padding: 2px 6px; min-height: 36px; border-radius: 8px; }
  .thumb { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; background: var(--sky-soft); display: flex; align-items: center; justify-content: center; font-size: 34px; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { width: 100%; height: 100%; display: block; }
  .frag-sum b { display: block; color: var(--petrol); font-size: 16px; overflow-wrap: anywhere; }
  .frag-sum b.missing { color: var(--danger); }
  .frag-sum span { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .frag-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .frag-body { border-top: 1px solid var(--line); padding: 12px 14px 4px; }
  .frag-body audio, .frag-body video, .frag-body img.full { width: 100%; max-height: 360px; border-radius: 10px; background: #000; display: block; margin-bottom: 12px; object-fit: contain; }
  .frag-body audio { background: none; }
  .fixed { font-size: 14px; color: var(--muted); background: var(--mist); border-radius: 8px; padding: 6px 10px; }
  .meta-line { font-size: 12px; color: var(--muted); margin: 0 0 10px; overflow-wrap: anywhere; }
  .src { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
  .src select { padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; font-size: 13px; }
  .checklist { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 4px; }
  .checklist li::before { content: "✗ "; color: var(--danger); font-weight: 700; }
  .checklist li.done::before { content: "✓ "; color: var(--ok); }
  .same { font-size: 14px; }

  /* consents */
  .agree { display: grid; gap: 8px; }
  .agree label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-weight: 400; color: var(--ink); }
  .agree label input { margin-top: 4px; width: 18px; height: 18px; }
  .agree small { display: block; color: var(--muted); }
  .code-big { display: block; font-size: clamp(30px, 8vw, 46px); font-weight: 700; letter-spacing: 3px; color: var(--petrol-deep); background: var(--sky-soft); border-radius: 14px; padding: 14px 18px; text-align: center; margin: 8px 0; }
  td.code { font-weight: 700; letter-spacing: 1px; white-space: nowrap; }

  /* community validation list */
  .cclist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cccard { display: grid; gap: 4px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--ink); font-size: 15px; }
  .cccard:hover { border-color: var(--sky); }
  .cccard b { color: var(--petrol); font-size: 17px; overflow-wrap: anywhere; }
  .cccard span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  /* community validation: one story, large (projector or big screen) */
  body.present { background: #10262F; }
  body.present header.top, body.present main { display: none; }
  #vQuilt { min-height: 100vh; color: #fff; background: #10262F; padding: 16px 22px 40px; font-size: 18px; }
  #vQuilt .qbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
  #vQuilt .qbar h1 { margin: 0; font-size: 24px; font-style: italic; flex: 1 1 auto; }
  #vQuilt .qbar button, #vQuilt .qbar select { min-height: 42px; padding: 6px 16px; border-radius: 999px; font-weight: 700; background: #fff; color: var(--petrol-deep); border: 0; }
  #vQuilt .qbar .ghost { background: rgba(255,255,255,.14); color: #fff; }
  .qstory { background: #173845; border-radius: 18px; padding: 16px 20px; margin-bottom: 16px; }
  .qstory h2 { color: #fff; font-size: 30px; margin: 0 0 4px; }
  .qstory .q { color: #CFE6EE; font-size: 18px; margin: 0 0 8px; }
  .quilt { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .patch { background: #FBF8F2; color: var(--ink); border-radius: 16px; padding: 12px; border: 6px solid var(--amber); position: relative; outline: 2px dashed rgba(0,0,0,.18); outline-offset: -12px; min-width: 0; }
  .patch .pno { position: absolute; top: 10px; left: 10px; background: rgba(14,63,80,.85); color: #fff; font-weight: 700; border-radius: 999px; min-width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 17px; z-index: 2; }
  .patch .pmedia { border-radius: 10px; overflow: hidden; background: #DDE7EA; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; font-size: 56px; position: relative; }
  .patch .pmedia img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .patch .pmedia svg { width: 100%; height: 70%; }
  .patch .play { position: absolute; bottom: 10px; right: 10px; background: var(--petrol); color: #fff; font-weight: 700; min-height: 46px; padding: 6px 18px; font-size: 17px; }
  .patch h3 { margin: 10px 0 6px; color: var(--petrol-deep); font-size: 21px; font-style: italic; overflow-wrap: anywhere; }
  .patch dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; margin: 0 0 10px; font-size: 17px; align-items: start; }
  .patch dt { font-weight: 700; color: var(--petrol); }
  .patch dd { margin: 0; overflow-wrap: anywhere; }
  .patch dd.none { color: #8A979D; font-style: italic; }
  .patch .pfoot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .patch .pfoot button { flex: 1 1 auto; min-height: 44px; }
  .qfoot { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.2); }
  .qfoot p { margin: 0; flex: 1 1 320px; color: #CFE6EE; font-size: 16px; }
  .qfoot .btn-ok { min-height: 56px; font-size: 19px; padding: 10px 26px; }
  #vQuilt .err { color: #FFB4AB; }

  dialog { width: min(760px, calc(100% - 20px)); max-height: calc(100% - 20px); border: 0; border-radius: 18px; padding: 18px 20px; color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(14,63,80,.55); }
  dialog h2 { margin-bottom: 12px; }
  .dlg-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .dup { background: var(--amber-soft); border: 2px solid var(--amber); border-radius: 12px; padding: 10px 14px; margin-top: 10px; }
  .dup ul { margin: 6px 0; padding-left: 20px; }
  .lightbox img { width: 100%; max-height: 80vh; object-fit: contain; display: block; background: #000; border-radius: 10px; }
  #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--petrol-deep); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 60; max-width: calc(100% - 24px); }
  #status.bad { background: var(--danger); }
</style>
</head>
<body>
<header class="top">
  <h1><span data-i="appTitle"></span> <small id="siteName"></small></h1>
  <select id="lang" aria-label="Language"><option value="el">EL</option><option value="en">EN</option><option value="fr">FR</option><option value="it">IT</option></select>
  <span id="userName"></span>
  <button id="logout" type="button" hidden data-i="logout"></button>
  <nav id="nav" hidden aria-label="Sections">
    <a href="#consents" data-v="consents" data-i="navConsents"></a>
    <a href="#stories" data-v="stories" data-i="navStories"></a>
    <a href="#community" data-v="community" data-i="navCommunity"></a>
  </nav>
</header>
<main>
  <section id="vLogin" class="card login" hidden>
    <h2 data-i="login"></h2>
    <p class="note" data-i="loginHint"></p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email" data-i="email"></label><input id="email" class="inp" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pass" data-i="password"></label><input id="pass" class="inp" type="password" autocomplete="current-password" required></div>
      <p id="loginErr" class="err" role="alert"></p>
      <button class="btn" type="submit" data-i="login"></button>
    </form>
  </section>

  <section id="vNoSite" class="card" hidden>
    <h2 data-i="noSiteTitle"></h2>
    <p data-i="noSiteText"></p>
    <p id="adminLink" hidden><a href="../admin/" data-i="toAdmin"></a></p>
  </section>

  <!-- consents: a code written on the printed form, the licence, what the narrator agreed to -->
  <section id="vConsents" hidden>
    <div class="card">
      <div class="row between"><h2 data-i="consentsTitle"></h2><button type="button" class="btn" id="newConsentBtn" data-i="newConsent"></button></div>
      <p class="lead" data-i="consentsLead"></p>
      <div class="filters">
        <div class="field"><label for="cSearch" data-i="searchCode"></label><input id="cSearch" type="search" autocomplete="off"></div>
      </div>
      <p id="cInfo" class="note" role="status"></p>
      <div class="tbl-wrap"><table class="tbl" id="cTable">
        <thead><tr><th data-i="colCode"></th><th data-i="colLicence"></th><th data-i="colCreated"></th><th data-i="colStories"></th><th data-i="colStatus"></th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </section>

  <!-- stories -->
  <section id="vStories" hidden>
    <div class="card">
      <div class="row between"><h2 data-i="storiesTitle"></h2><a class="btn" href="#story/new" data-i="newStory" style="text-decoration:none;display:inline-flex;align-items:center"></a></div>
      <p class="lead" data-i="storiesLead"></p>
      <div class="filters">
        <div class="field"><label for="sSearch" data-i="searchTitle"></label><input id="sSearch" type="search" autocomplete="off"></div>
        <div class="field"><label for="sFilter" data-i="colStatus"></label><select id="sFilter"></select></div>
      </div>
      <p id="sInfo" class="note" role="status"></p>
      <div class="tbl-wrap"><table class="tbl" id="sTable">
        <thead><tr><th data-i="colTitle"></th><th data-i="colWhy"></th><th data-i="colConsent"></th><th data-i="colFragments"></th><th data-i="colSource"></th><th data-i="colStatus"></th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </section>

  <!-- one story: details + fragments -->
  <section id="vStory" hidden>
    <p><a href="#stories" data-i="backToStories"></a></p>
    <div class="card">
      <div class="story-head"><h2 id="stTitleH"></h2><span id="stStatus" class="chip"></span><span id="stSource" class="chip"></span></div>
      <div id="stLock" class="lockbar" hidden></div>
      <form id="stForm" novalidate>
        <div class="field">
          <label for="stConsent" class="req" data-i="fConsent"></label>
          <div class="row"><select id="stConsent" class="inp" style="flex:1 1 260px;width:auto"></select><button type="button" class="btn-sec" id="stNewConsent" data-i="newConsentShort"></button></div>
          <span id="stConsentInfo" class="note" style="margin:0"></span>
        </div>
        <div class="field"><label for="stTitle" class="req" data-i="fTitle"></label><input id="stTitle" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="stTheme" class="req" data-i="fTheme"></label><input id="stTheme" type="text" maxlength="500" autocomplete="off" data-i-ph="themePh" aria-describedby="stThemeHint"><span id="stThemeHint" class="note" data-i="themeHint" style="margin:0"></span></div>
        <div class="grid2">
          <div class="field"><label for="stLanguage" class="req" data-i="fLanguage"></label><select id="stLanguage"></select></div>
        </div>
        <fieldset>
          <legend class="req" data-i="fSensitive"></legend>
          <div class="choice"><label><input type="radio" name="stSens" value="no"> <span data-i="no"></span></label><label><input type="radio" name="stSens" value="yes"> <span data-i="yes"></span></label></div>
        </fieldset>
        <div class="field">
          <span class="lbl req" id="stLocL" data-i="fLocation"></span>
          <p class="note" data-i="locHint" style="margin:0"></p>
          <div id="stPk" class="pk" role="group" aria-labelledby="stLocL"></div>
        </div>
        <p id="stSame" class="same" hidden></p>
        <p id="stErr" class="err" role="alert"></p>
        <div class="row"><button type="submit" class="btn" id="stSave"></button><span id="stSaved" class="okmsg" role="status"></span></div>
      </form>
    </div>

    <div class="card" id="fragCard" hidden>
      <h2 id="fragH"></h2>
      <p class="lead" data-i="fragLead"></p>
      <div id="drop" class="drop">
        <p data-i="dropText"></p>
        <label class="btn" for="fileIn" style="display:inline-flex;align-items:center;cursor:pointer;color:#fff" data-i="chooseFiles"></label>

        <p class="note" id="dropTypes" style="margin:10px 0 0"></p>
        <ul id="upQueue" class="queue-up" aria-live="polite"></ul>
      </div>
      <ol id="frags" class="frags"></ol>
      <h3 data-i="readyTitle"></h3>
      <ul id="checklist" class="checklist"></ul>
      <div class="row">
        <button type="button" class="btn-ok" id="readyBtn" data-i="readyBtn"></button>
        <a class="btn" id="openCommunity" data-i="openWithCommunity" hidden style="text-decoration:none;display:inline-flex;align-items:center"></a>
        <button type="button" class="btn-sec" id="backDraftBtn" data-i="backToDraft" hidden></button>
        <span id="readyErr" class="err" role="alert"></span>
      </div>
    </div>
    <div class="card" id="withdrawCard" hidden>
      <h3 data-i="withdrawTitle" style="margin-top:0"></h3>
      <p class="note" data-i="withdrawStoryLead"></p>
      <button type="button" class="btn-danger" id="withdrawBtn" data-i="withdrawStory"></button>
    </div>
  </section>

  <!-- community validation: the stories the community has not validated yet -->
  <section id="vCommunity" hidden>
    <div class="card">
      <h2 data-i="communityTitle"></h2>
      <p class="lead" data-i="communityLead"></p>
      <p id="ccInfo" class="note" role="status"></p>
      <div id="ccList" class="cclist"></div>
    </div>
  </section>
</main>

<!-- one story with the community (large, for a projector or a big screen) -->
<section id="vQuilt" hidden aria-labelledby="qStoryTitle">
  <div class="qbar">
    <h1 id="qTitle" data-i="communityTitle"></h1>
    <button type="button" id="qFull" class="ghost" data-i="fullscreen"></button>
    <button type="button" id="qEditStory" class="ghost" data-i="correctStory"></button>
    <button type="button" id="qExit" data-i="exitPresent"></button>
  </div>
  <div class="qstory">
    <h2 id="qStoryTitle" tabindex="-1"></h2>
    <p class="q" id="qQuestion"></p>
    <p class="q" id="qMeta" style="font-size:15px"></p>
  </div>
  <div id="quilt" class="quilt"></div>
  <div class="qfoot">
    <p id="qFootNote" data-i="validateHint"></p>
    <button type="button" id="qValidate" class="btn-ok" data-i="validatedBtn"></button>
    <span id="qErr" class="err" role="alert"></span>
  </div>
</section>

<!-- new consent: what the narrator agreed to, the licence; the database makes the code -->
<dialog id="dlgConsent" aria-labelledby="dcTitle">
  <h2 id="dcTitle" data-i="newConsentTitle"></h2>
  <div id="dcForm">
    <p class="note" data-i="newConsentLead"></p>
    <fieldset><legend class="req" data-i="agreeLegend"></legend><div id="dcAgree" class="agree"></div></fieldset>
    <fieldset><legend class="req" data-i="fLicence"></legend><div id="dcLic" class="agree"></div></fieldset>
    <p id="dcErr" class="err" role="alert"></p>
    <div class="dlg-foot"><button type="button" class="btn-sec" id="dcCancel" data-i="cancel"></button><button type="button" class="btn" id="dcSave" data-i="createCode"></button></div>
  </div>
  <div id="dcDone" hidden>
    <p data-i="codeIntro"></p>
    <output id="dcCode" class="code-big" aria-live="polite"></output>
    <p id="dcCodeLic" class="note"></p>
    <div class="dlg-foot"><button type="button" class="btn-sec" id="dcCopy" data-i="copyCode"></button><button type="button" class="btn" id="dcClose" data-i="done"></button></div>
  </div>
</dialog>

<!-- one consent -->
<dialog id="dlgConsentView" aria-labelledby="cvTitle">
  <h2 id="cvTitle"></h2>
  <dl id="cvList" style="display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 12px"></dl>
  <h3 data-i="consentStories"></h3>
  <ul id="cvStories"></ul>
  <p id="cvErr" class="err" role="alert"></p>
  <div class="dlg-foot"><button type="button" class="btn-sec" id="cvCopy" data-i="copyCode"></button><button type="button" class="btn-danger" id="cvWithdraw" data-i="withdrawConsent"></button><button type="button" class="btn" id="cvClose" data-i="close"></button></div>
</dialog>

<!-- map for a fragment's "where" / a consent's place -->
<dialog id="dlgMap" aria-labelledby="dmTitle">
  <h2 id="dmTitle"></h2>
  <p class="note" data-i="locHint"></p>
  <div id="dmPk" class="pk"></div>
  <div class="dlg-foot"><button type="button" class="btn-sec" id="dmCancel" data-i="cancel"></button><button type="button" class="btn" id="dmUse" data-i="useThis"></button></div>
</dialog>

<!-- community validation: correct a fragment or the story -->
<dialog id="dlgField" aria-labelledby="dfTitle">
  <h2 id="dfTitle"></h2>
  <div id="dfBody"></div>
  <p id="dfErr" class="err" role="alert"></p>
  <div class="dlg-foot"><button type="button" class="btn-sec" id="dfCancel" data-i="cancel"></button><button type="button" class="btn" id="dfSave" data-i="save"></button></div>
</dialog>

<!-- community validation: a comment on a fragment -->
<dialog id="dlgNote" aria-labelledby="dnTitle">
  <h2 id="dnTitle" data-i="noteTitle"></h2>
  <p class="note" id="dnLead"></p>
  <div class="field"><label for="dnText" data-i="noteLabel"></label><textarea id="dnText" rows="4" maxlength="2000"></textarea></div>
  <p id="dnErr" class="err" role="alert"></p>
  <div class="dlg-foot"><button type="button" class="btn-sec" id="dnCancel" data-i="cancel"></button><button type="button" class="btn" id="dnSave" data-i="saveNote"></button></div>
</dialog>

<dialog id="dlgImage" class="lightbox" aria-label="Photo">
  <img id="diImg" alt="">

</dialog>

      if (kind === 'image') { var bmp = await createImageBitmap(file); return await canvasThumb(bmp, bmp.width, bmp.height); }
      if (kind === 'video') {
        return await new Promise(function (res) {
          var v = document.createElement('video'), url = URL.createObjectURL(file), done = false;
          function fin(b) { if (done) return; done = true; URL.revokeObjectURL(url); res(b); }
          v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
          v.onloadedmetadata = function () { v.currentTime = Math.min(1, (v.duration || 2) / 2); };
          v.onseeked = function () { canvasThumb(v, v.videoWidth, v.videoHeight).then(fin, function () { fin(null); }); };
          v.onerror = function () { fin(null); }; setTimeout(function () { fin(null); }, 15000);

  }
  async function waveform(buf) {

      for (var i = 0; i < n; i++) { var p = 0; for (var j = i * step, e = Math.min(ch.length, j + step); j < e; j += 4) { var a = Math.abs(ch[j]); if (a > p) p = a; } peaks.push(p); if (p > max) max = p; }
      if (ac.close) ac.close();
      return { peaks: peaks.map(function (p) { return max ? Math.round(p / max * 1000) / 1000 : 0; }), duration: ab.duration };
    } catch (e) { return null; }
  }
  async function addFiles(fileList) {
    if (!S.story || !S.editable) return;
    var files = Array.prototype.slice.call(fileList), q = $('upQueue');
    for (var i = 0; i < files.length; i++) {
      var f = files[i], ext = (f.name.split('.').pop() || '').toLowerCase(), ty = TYPES[ext];
      var li = el('li', null, t('upChecking', { f: f.name })); q.appendChild(li);
      if (!ty) { li.textContent = t('upBadType', { f: f.name }); li.className = 'err'; continue; }
      if (f.size > MAX_MB * 1048576) { li.textContent = t('upTooBig', { f: f.name, mb: MAX_MB }); li.className = 'err'; continue; }
      try {
        var buf = await f.arrayBuffer(), sum = await sha256(buf), id = crypto.randomUUID ? crypto.randomUUID() : sum.slice(0, 32);
        var base = user.id + '/' + S.story.id + '/' + id, path = base + '.' + (ext === 'jpeg' ? 'jpg' : ext === 'tif' ? 'tiff' : ext);
        var extra = {}, thumbPath = null;
        if (ty[0] === 'audio') { var w = await waveform(buf); if (w) { extra.waveform = w.peaks; extra.duration_s = Math.round(w.duration * 10) / 10; } }
        else { var tb = await makeThumb(f, ty[0]); if (tb) { thumbPath = base + '_thumb.jpg'; extra.thumb = tb; } }
        li.textContent = t('upUploading', { f: f.name });
        var up = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || ty[1], upsert: false });
        if (up.error) throw up.error;
        if (extra.thumb) { var ut = await sb.storage.from(BUCKET).upload(thumbPath, extra.thumb, { contentType: 'image/jpeg', upsert: false }); if (ut.error) thumbPath = null; }
        var row = { story_id: S.story.id, kind: ty[0], path: path, position: S.frags.length, mime: f.type || ty[1], original_name: f.name.slice(0, 255), sha256: sum,
                    recorded_at: recordedFrom(f), thumb_path: thumbPath, waveform: extra.waveform || null, duration_s: extra.duration_s || null };
        var r = await sb.from('story_media').insert(row).select(MCOLS).single();
        if (r.error) { sb.storage.from(BUCKET).remove([path].concat(thumbPath ? [thumbPath] : [])); throw r.error; }
        S.frags.push(r.data); li.textContent = t('upDone', { f: f.name }); li.className = 'okmsg';
        renderFrags(); renderReady();
      } catch (e) { li.textContent = t('upErr', { f: f.name, e: niceErr(e) }); li.className = 'err'; }
    }
  }

  // ready for community validation: a consent, at least one audio fragment, every fragment titled
  function readiness() {
    var c = S.consents.filter(function (x) { return S.story && x.id === S.story.consent_id; })[0];
    return { consent: !!(c && c.status === 'active'), audio: S.frags.some(function (m) { return m.kind === 'audio'; }),

  }

    var st = S.story.status;
    $('readyBtn').hidden = st !== 'draft' || !S.editable;
    $('readyBtn').disabled = !(r.consent && r.audio && r.titles);
    $('backDraftBtn').hidden = st !== 'community_validation' || !S.editable;
    $('openCommunity').hidden = st !== 'community_validation' || !S.editable;

  async function setStatus(next, btn) {

  $('backDraftBtn').onclick = function () { setStatus('draft', this); };
  $('withdrawBtn').onclick = async function () {

    var r = await sb.from('stories').update({ status: 'withdrawn' }).eq('id', S.story.id).select('id');

    S.formStart = storyFormState(); S.cards = [];
    say(t('withdrawn')); location.hash = '#stories';
  };

  // =====================================================================================================================
  // COMMUNITY VALIDATION: the site's stories the community has not validated yet. The facilitator opens one on a big screen,

    var r = await sb.from('stories').select('id,title,theme,source,updated_at,consents(code),story_media(id,kind)').eq('site_id', CTX.site.id)

    (r.data || []).forEach(function (s) {
      var a = el('a', 'cccard'); a.href = '#community/' + s.id; a.style.textDecoration = 'none';
      a.appendChild(el('b', null, s.title));
      a.appendChild(el('span', null, t('fTheme') + ': ' + (s.theme || '—')));

      a.appendChild(el('span', null, Object.keys(n).map(function (k) { return KIND_ICON[k] + ' ' + n[k]; }).join('  ') + ' · ' + t('src_' + s.source) + (s.consents ? ' · ' + s.consents.code : '')));

  }

  var Q = { s: null, notes: {}, playing: null };
  function leavePresent() {
    if (!document.body.classList.contains('present')) return;
    document.body.classList.remove('present'); $('vQuilt').hidden = true; stopPlaying();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
  }
  async function enterPresent(id) {
    showOnly(null); document.body.classList.add('present'); $('vQuilt').hidden = false;
    $('quilt').innerHTML = ''; $('qErr').textContent = ''; $('qStoryTitle').textContent = t('loading'); $('qQuestion').textContent = ''; $('qMeta').textContent = '';
    var r = await sb.from('stories').select('id,title,theme,status,language,sensitive,consent_id,consents(code,license),story_media(' + MCOLS + ')').eq('id', id).maybeSingle();
    if (r.error || !r.data) { $('qStoryTitle').textContent = r.error ? t('loadErr', { e: niceErr(r.error) }) : '—'; return; }
    Q.s = r.data; Q.s.story_media = (Q.s.story_media || []).slice().sort(function (a, b) { return a.position - b.position; });
    var ids = Q.s.story_media.map(function (m) { return m.id; }); Q.notes = {};
    if (ids.length) { var n = await sb.from('fragment_notes').select('media_id,body').in('media_id', ids); (n.data || []).forEach(function (x) { Q.notes[x.media_id] = x.body; }); }
    renderQuilt();
  }
  function renderQuilt() {
    stopPlaying();
    var s = Q.s, qb = $('quilt'); qb.innerHTML = ''; if (!s) return;
    var open = s.status === 'community_validation';
    $('qStoryTitle').textContent = s.title;
    $('qQuestion').textContent = t('fTheme') + ': ' + (s.theme || '—');
    var lang = CTX.languages.filter(function (l) { return l.code === s.language; })[0];
    $('qMeta').textContent = [s.consents ? t('fConsent') + ' ' + s.consents.code + ' · ' + licName(s.consents.license) : '', lang ? lang.label : '', s.sensitive ? '⚠ ' + t('fSensitive') : ''].filter(Boolean).join(' · ');
    $('qEditStory').hidden = !open; $('qValidate').hidden = !open; $('qFootNote').textContent = open ? t('validateHint') : t('lockStatus', { s: t('s_' + s.status) });

  }
  function patchEl(s, m, i, open) {

  }
  function stopPlaying() { if (Q.playing) { Q.playing.el.pause(); Q.playing.el.remove(); if (Q.playing.btn) Q.playing.btn.textContent = t('play'); Q.playing = null; } }
  function togglePlay(m, btn, box) {

  $('qExit').onclick = function () { location.hash = '#community'; };
  $('qFull').onclick = function () { var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(function () {}); };
  $('diClose').onclick = function () { $('dlgImage').close(); };
  $('qValidate').onclick = async function () {
    var s = Q.s; if (!s || !window.confirm(t('validateQ', { t: s.title }))) return;

    var r = await sb.from('stories').update({ status: 'ready_for_annotation' }).eq('id', s.id).select('id,status').single();
    b.disabled = false;
    if (r.error) { $('qErr').textContent = t('saveErr', { e: niceErr(r.error) }); return; }
    say(t('validatedDone', { t: s.title })); location.hash = '#community';

  // correct a fragment (title, who, where, when) or the story (title, why)
  var DF = null;
  function openFieldEdit(m) {
    DF = { m: m }; $('dfTitle').textContent = t('correctFrag', { n: Q.s.story_media.indexOf(m) + 1 });
    var b = $('dfBody'); b.innerHTML = ''; $('dfErr').textContent = '';

    DF.place = el('input', 'inp'); DF.place.type = 'text'; DF.place.maxLength = 200; DF.place.value = m.place_name || ''; field('fWhere', DF.place, 'dfP');
    var pkBox = el('div', 'pk'); b.appendChild(pkBox); DF.pk = makePicker(pkBox, { area: true });

      var lb2 = el('label'), r = el('input'); r.type = 'radio'; r.name = 'dfKind'; r.value = k[0]; r.checked = (m.when_kind || '') === k[0];
      lb2.appendChild(r); lb2.appendChild(document.createTextNode(' ' + t(k[1]))); ch.appendChild(lb2); DF.kind[k[0]] = r;
    });
    fs.appendChild(ch);
    DF.date = el('input', 'inp'); DF.date.type = 'date'; DF.date.value = m.when_date || ''; DF.date.setAttribute('aria-label', t('whenExact'));

    function vis() { var k = dfKind(); DF.date.hidden = k !== 'exact'; DF.approx.hidden = k !== 'approx'; }
    Object.keys(DF.kind).forEach(function (k) { DF.kind[k].onchange = vis; }); vis(); b.appendChild(fs);
    $('dlgField').showModal();
    setTimeout(function () { DF.pk.open({ lat: m.lat, lon: m.lon, area: m.area }, m.place_name || '', null); DF.title.focus(); }, 30);
  }
  function openStoryEdit() {
    var s = Q.s; DF = { story: true }; $('dfTitle').textContent = t('correctStory');
    var b = $('dfBody'); b.innerHTML = ''; $('dfErr').textContent = '';
    [['fTitle', 'title', 120, 'dfST'], ['fTheme', 'theme', 500, 'dfSW']].forEach(function (x) {
      var f = el('div', 'field'), lb = el('label', 'req', t(x[0])), inp = el('input', 'inp'); inp.type = 'text'; inp.maxLength = x[2]; inp.id = x[3]; inp.value = s[x[1]] || ''; lb.htmlFor = x[3];

    });
    $('dlgField').showModal(); DF.title.focus();
  }
  $('qEditStory').onclick = openStoryEdit;
  function dfKind() { var k = ''; Object.keys(DF.kind).forEach(function (x) { if (DF.kind[x].checked) k = x; }); return k; }
  $('dfCancel').onclick = function () { $('dlgField').close(); };
  $('dfSave').onclick = async function () {
    var b = this, r, patch;
    if (DF.story) {
      patch = { title: DF.title.value.trim().slice(0, 120), theme: DF.theme.value.trim().slice(0, 500) };
      if (!patch.title || !patch.theme) { $('dfErr').textContent = t(!patch.title ? 'needTitle' : 'needTheme'); return; }
      b.disabled = true; r = await sb.from('stories').update(patch).eq('id', Q.s.id).select('id'); b.disabled = false;
      if (r.error || !r.data || !r.data.length) { $('dfErr').textContent = t('saveErr', { e: r.error ? niceErr(r.error) : '—' }); return; }
      Object.assign(Q.s, patch); $('dlgField').close(); renderQuilt(); say(t('saved')); return;
    }
    var m = DF.m, k = dfKind();
    if (!DF.title.value.trim()) { $('dfErr').textContent = t('titleMissing'); DF.title.focus(); return; }
    if (k === 'exact' && !DF.date.value) { $('dfErr').textContent = t('whenExact') + '?'; return; }
    if (k === 'approx' && !DF.approx.value.trim()) { $('dfErr').textContent = t('whenApprox') + '?'; return; }
    if (DF.pk.incomplete()) { $('dfErr').textContent = t('areaNeed', { n: DF.pk.verts.length }); return; }
    var g = DF.pk.get() || { lat: null, lon: null, area: null }, who = DF.chips.get();
    patch = { title: DF.title.value.trim(), who: who.length ? who : null, place_name: DF.place.value.trim() || null, lat: g.lat, lon: g.lon, area: g.area,
              when_kind: k || null, when_date: k === 'exact' ? DF.date.value : null, period: k === 'approx' ? DF.approx.value.trim() : null };
    b.disabled = true; r = await sb.from('story_media').update(patch).eq('id', m.id).select('id'); b.disabled = false;
    if (r.error || !r.data || !r.data.length) { $('dfErr').textContent = t('saveErr', { e: r.error ? niceErr(r.error) : '—' }); return; }
    Object.assign(m, patch); $('dlgField').close(); renderQuilt(); say(t('saved'));
  };
  // a comment on a fragment (what the community said): added to the fragment's comment, kept for the annotators
  var DN = null;
  function openNote(m) {
    DN = m; $('dnText').value = ''; $('dnErr').textContent = '';
    $('dnLead').textContent = t('noteLead');
    $('dlgNote').showModal(); $('dnText').focus();
  }
  $('dnCancel').onclick = function () { $('dlgNote').close(); };
  $('dnSave').onclick = async function () {
    var txt = $('dnText').value.trim(); if (!txt) { $('dnErr').textContent = t('noteLabel') + '?'; return; }
    var line = '[' + today() + '] ' + txt.slice(0, 2000), body = ((Q.notes[DN.id] ? Q.notes[DN.id] + '\n' : '') + line).slice(-8000);
    var b = this; b.disabled = true;
    var r = await sb.from('fragment_notes').upsert({ media_id: DN.id, body: body });
    b.disabled = false;
    if (r.error) { $('dnErr').textContent = t('saveErr', { e: niceErr(r.error) }); return; }
    Q.notes[DN.id] = body; $('dlgNote').close(); say(t('noteSaved'));
  };

  // ---------- start ----------
  $('lang').onchange = function () {
    LANG = this.value; try { localStorage.setItem('dm_lang', LANG); } catch (e) {} applyLang();
    if (!user || !CTX.site) return;
    if (!$('vStory').hidden) { if (!storyDirty()) { renderStoryForm(); if (S.story) { renderFrags(); renderReady(); } } }
    else if (document.body.classList.contains('present')) renderQuilt();
    else route();
  };
  applyLang();
  if (!sb) { $('vLogin').hidden = false; $('loginErr').textContent = 'Supabase is not configured (config.js).'; return; }
  sb.auth.onAuthStateChange(function (_e, session) { setTimeout(function () { onSession(session); }, 0); });
})();
