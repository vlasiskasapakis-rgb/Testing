<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Walking Memory · Story links</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  :root {
    --petrol: #186078; --petrol-deep: #0E3F50; --sky: #249CCC; --sky-soft: #E7F4FA; --amber: #E0904F; --amber-text: #9A5413;
    --ink: #12303B; --muted: #4B6470; --line: #D3E3EA; --line-strong: #6F8D99; --mist: #F2F7F9; --danger: #B3261E;
    --wire: #186078; --wire-sel: #E0904F;
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
    --box-w: 250px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--mist); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
  body { display: flex; flex-direction: column; }
  button, input, select { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; border: 0; border-radius: 999px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: var(--petrol); color: #fff; flex: none; }
  header h1 { margin: 0; font-size: 22px; font-style: italic; flex: 1 1 auto; }
  header select, header button, header a.hbtn { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 0; font-weight: 700; color: var(--petrol); background: #fff; text-decoration: none; display: inline-flex; align-items: center; }
  header a.hbtn { background: rgba(255,255,255,.15); color: #fff; }
  #userName { font-weight: 600; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .login { max-width: 420px; margin: 40px auto; }
  .login h2 { margin: 0 0 6px; color: var(--petrol); font-style: italic; }
  .login label { display: block; font-weight: 600; color: var(--petrol); margin: 10px 0 4px; }
  .login input { width: 100%; padding: 10px 12px; border: 2px solid var(--line-strong); border-radius: 10px; }
  .btn { background: var(--petrol); color: #fff; font-weight: 700; padding: 10px 20px; min-height: 44px; }
  .btn-sec { background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); font-weight: 700; padding: 6px 14px; min-height: 38px; }
  .btn-danger { background: #fff; color: var(--danger); border: 2px solid var(--danger); font-weight: 700; padding: 6px 14px; min-height: 38px; }
  .btn-sm { padding: 3px 10px; min-height: 30px; font-size: 13px; }
  .err { color: var(--danger); font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; }
  code { background: var(--mist); padding: 1px 5px; border-radius: 4px; }

  /* ---------- layout ---------- */
  .app { flex: 1 1 auto; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  .side { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .side-sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .side h2 { margin: 0 0 8px; font-size: 17px; color: var(--petrol); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .side select, .side input[type=search] { width: 100%; min-height: 38px; padding: 6px 10px; border: 2px solid var(--line-strong); border-radius: 10px; background: #fff; }
  .side .row select { flex: 1 1 140px; width: auto; }
  .stories { flex: 1 1 auto; min-height: 200px; display: flex; flex-direction: column; }
  #storyList { list-style: none; margin: 8px 0 0; padding: 0; overflow: auto; flex: 1 1 auto; }
  #storyList li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: #fff; cursor: grab; }
  #storyList li.on { background: var(--sky-soft); }
  #storyList .st-t { flex: 1 1 auto; min-width: 0; }
  #storyList .st-t b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #storyList .st-t span { font-size: 12px; color: var(--muted); }
  .chip-draft { color: var(--amber-text); font-weight: 700; } .chip-pub { color: var(--petrol); font-weight: 700; }
  #linkList { margin: 6px 0 0; padding-left: 0; list-style: none; font-size: 14px; }
  #linkList li { padding: 5px 0; border-top: 1px solid var(--line); }
  #linkList li .lk { display: block; }
  #linkList li .lb { color: var(--muted); font-style: italic; }
  #linkList li .row { margin-top: 3px; }
  #orderLine { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .walk-box { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--mist); }
  .walk-chk { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--petrol); }
  .walk-chk input { width: 20px; height: 20px; }
  .walk-state { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .walk-state b { color: var(--petrol); font-size: 14px; }
  .walk-state b.sub { color: #1565C0; } .walk-state b.ret { color: var(--danger); } .walk-state b.ok { color: #2E7D32; }
  .walk-ret { margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: #FDECEA; border-left: 4px solid var(--danger); font-size: 13px; white-space: pre-wrap; }
  #walkDesc { width: 100%; margin-top: 6px; padding: 6px 8px; border: 2px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 14px; resize: vertical; }
  .walk-box .note { margin: 4px 0 0; font-size: 12px; }
  details.fold > summary { cursor: pointer; font-weight: 700; color: var(--petrol); font-size: 17px; }

  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar .zoom { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
  #saveStatus { margin-left: auto; font-size: 14px; color: var(--muted); }
  #saveStatus.bad { color: var(--danger); font-weight: 600; }
  .canvas { position: relative; flex: 1 1 auto; overflow: hidden; cursor: grab; touch-action: none;
    background-color: var(--mist); background-image: radial-gradient(#c5d6de 1.2px, transparent 1.2px); background-size: 24px 24px; }
  .canvas.panning { cursor: grabbing; }
  .layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .wires { position: absolute; left: -5000px; top: -5000px; width: 20000px; height: 20000px; overflow: visible; pointer-events: none; }
  .wires .w { fill: none; stroke: var(--wire); stroke-width: 2.5; }
  .wires .w.sel { stroke: var(--wire-sel); stroke-width: 3.5; }
  .wires .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
  .wires .lbl-bg { fill: #fff; stroke: var(--line-strong); stroke-width: 1; }
  .wires .lbl { font-size: 13px; fill: var(--ink); font-family: var(--font); }
  .wires .temp { fill: none; stroke: var(--wire-sel); stroke-width: 2.5; stroke-dasharray: 6 5; }
  .empty-hint { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 460px; text-align: center; color: var(--muted); background: rgba(255,255,255,.85); border-radius: 14px; padding: 16px 20px; pointer-events: none; }

  /* ---------- story boxes ---------- */
  .sbox { position: absolute; width: var(--box-w); background: #fff; border: 2px solid var(--line-strong); border-radius: 14px; box-shadow: 0 2px 10px rgba(14,63,80,.12); cursor: default; }
  .sbox:focus-visible, .sbox.flash { outline: 3px solid var(--amber); outline-offset: 2px; }
  .sbox.draft { border-style: dashed; }
  .sbox.target { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(224,144,79,.35); }
  .sbox-head { display: flex; align-items: flex-start; gap: 8px; padding: 10px 10px 8px 12px; cursor: move; user-select: none; }
  .sbox-head .ord { flex: none; min-width: 26px; height: 26px; border-radius: 13px; background: var(--petrol); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .sbox-head .tt { flex: 1 1 auto; min-width: 0; }
  .sbox-head .tt b { display: block; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .sbox-head .tt span { font-size: 12px; color: var(--muted); }
  .sbox-head .x { flex: none; width: 28px; height: 28px; padding: 0; background: var(--mist); color: var(--muted); font-size: 18px; line-height: 1; }
  .sbox-head .x:hover { background: #fde8e7; color: var(--danger); }
  .sbox-det { border-top: 1px solid var(--line); padding: 6px 12px; font-size: 13px; }
  .sbox-det > summary { cursor: pointer; font-weight: 700; color: var(--petrol); }
  .sbox-det .thumb { display: block; width: 100%; max-height: 130px; object-fit: cover; border-radius: 8px; margin: 6px 0; background: var(--mist); }
  .sbox-det ul { margin: 6px 0; padding-left: 0; list-style: none; }
  .sbox-det li { padding: 3px 0; border-top: 1px dashed var(--line); }
  .sbox-det li .d { display: block; color: var(--muted); }
  .sbox-det .kv { margin: 3px 0; color: var(--muted); }
  .sbox-det a { color: var(--petrol); font-weight: 700; }
  .sbox-foot { border-top: 1px solid var(--line); padding: 6px 10px 8px; }
  .sbox-foot select { width: 100%; min-height: 30px; font-size: 13px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 2px 6px; }
  .port { position: absolute; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--petrol); }
  .port.out { right: -11px; cursor: crosshair; }
  .port.out:hover { background: var(--amber); border-color: var(--amber); }
  .port.in { left: -11px; pointer-events: none; border-color: var(--line-strong); }

  .wire-menu { display: inline-flex; align-items: center; gap: 6px; background: #FFF4EA; border: 1px solid var(--amber); border-radius: 999px; padding: 3px 4px 3px 12px; }
  .wire-menu #wmText { font-size: 14px; font-weight: 600; color: var(--amber-text); max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1 data-i="title"></h1>
  <a class="hbtn" href="../annotate/" data-i="toAnnotate"></a>
  <select id="lang" aria-label="Language"><option value="el">EL</option><option value="en">EN</option><option value="fr">FR</option><option value="it">IT</option></select>
  <span id="userName"></span>
  <button id="logout" type="button" hidden data-i="logout"></button>
</header>

<section id="loginView" class="card login" hidden>
  <h2 data-i="login"></h2>
  <p class="note" data-i="loginHint"></p>
  <form id="loginForm" novalidate>
    <label for="email" data-i="email"></label><input id="email" type="email" autocomplete="email" required>
    <label for="pass" data-i="password"></label><input id="pass" type="password" autocomplete="current-password" required>
    <p id="loginErr" class="err" role="alert"></p>
    <button class="btn" type="submit" data-i="login" style="margin-top:12px"></button>
  </form>
</section>
<section id="noAccess" class="card login" hidden><p class="err" data-i="noAccess"></p></section>

<div id="app" class="app" hidden>
  <aside class="side" aria-label="Boards and stories">
    <div class="side-sec">
      <h2 id="hBoards" data-i="boards"></h2>
      <div class="row">
        <select id="boardSel" aria-labelledby="hBoards"></select>
        <button id="boardNew" type="button" class="btn-sec btn-sm" data-i="newBoard"></button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="boardRename" type="button" class="btn-sec btn-sm" data-i="rename"></button>
        <button id="boardDelete" type="button" class="btn-danger btn-sm" data-i="deleteBoard"></button>
      </div>
      <div id="walkBox" class="walk-box">
        <div class="walk-state"><b id="walkState"></b><button id="walkAct" type="button" class="btn-sec btn-sm"></button></div>
        <div id="walkRet" class="walk-ret" hidden></div>
        <label for="walkDesc" class="sr-only" data-i="walkDescLbl"></label>
        <textarea id="walkDesc" rows="2" maxlength="1000" data-i-ph="walkDescPh"></textarea>
        <p class="note" data-i="walkNote"></p>
      </div>
    </div>
    <div class="side-sec stories">
      <h2 id="hStories" data-i="stories"></h2>
      <p class="note" data-i="storiesHint" style="margin:0 0 6px"></p>
      <input id="search" type="search" data-i-ph="search" aria-labelledby="hStories">
      <div class="row" style="margin-top:6px">
        <select id="filter" aria-label="Filter"><option value="all"></option><option value="draft"></option><option value="published"></option><option value="off"></option></select>
      </div>
      <ul id="storyList"></ul>
    </div>
    <details id="linksFold" class="side-sec fold" open>
      <summary id="linksHead"></summary>
      <p id="orderLine"></p>
      <ol id="linkList"></ol>
    </details>
  </aside>
  <section class="stage">
    <div class="toolbar">
      <button id="zoomOut" type="button" class="btn-sec btn-sm" data-i-label="zoomOut">−</button>
      <span id="zoomVal" class="zoom" aria-live="polite"></span>
      <button id="zoomIn" type="button" class="btn-sec btn-sm" data-i-label="zoomIn">+</button>
      <button id="fitBtn" type="button" class="btn-sec btn-sm" data-i="fit"></button>
      <button id="tidyBtn" type="button" class="btn-sec btn-sm" data-i="tidy"></button>
      <span id="howTo" class="note" data-i="howTo"></span>
      <span id="wireMenu" class="wire-menu" role="group" hidden>
        <span id="wmText"></span>
        <button id="wmLabel" type="button" class="btn-sec btn-sm" data-i="label"></button>
        <button id="wmReverse" type="button" class="btn-sec btn-sm" data-i="reverse"></button>
        <button id="wmDelete" type="button" class="btn-danger btn-sm" data-i="removeLink"></button>
      </span>
      <span id="saveStatus" role="status"></span>
    </div>
    <div id="canvas" class="canvas" aria-label="Board">
      <div id="layer" class="layer">
        <svg id="wires" class="wires" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#186078"/></marker>
            <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0904F"/></marker>
          </defs>
          <g id="wireG" transform="translate(5000,5000)"></g>
          <path id="tempWire" class="temp" transform="translate(5000,5000)" d="" />
        </svg>
        <div id="boxes"></div>
      </div>
      <div id="emptyHint" class="empty-hint" hidden></div>
    </div>
  </section>
</div>

    ids.filter(function (id) { return linked.indexOf(id) < 0; }).forEach(function (id, i) { items[id].x = 40 + (i % 5) * (BOX_W + 140); items[id].y = (linked.length ? maxY + 40 : 40) + Math.floor(i / 5) * 190; });

    var rows = ids.map(function (id) { return { board_id: boardId, story_id: id, x: Math.round(items[id].x), y: Math.round(items[id].y) }; });
    var r = await write(sb.from('story_board_items').upsert(rows, { onConflict: 'board_id,story_id' }));
    if (!r.error) touchBoard();
  };

  function renderAll() {
    renderBoards();
    var o = computeOrder();
    renderBoxes(o.ord); renderWires(); renderList(); renderLinkList(o);
    var hint = $('emptyHint');
    if (!BOARDS.length) { hint.hidden = false; hint.textContent = t('noBoards'); }
    else if (!Object.keys(items).length) { hint.hidden = false; hint.textContent = t('emptyBoard'); }
    else hint.hidden = true;
    $('tidyBtn').disabled = $('fitBtn').disabled = !Object.keys(items).length;
  }

  applyLang(); applyView();
  if (!sb) { showView('login'); $('loginErr').textContent = 'Supabase is not configured (config.js).'; return; }
  sb.auth.onAuthStateChange(function (_e, session) { setTimeout(function () { onSession(session); }, 0); });
})();
</script>
</body>
</html>
