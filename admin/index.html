<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Walking Memory · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  :root {
    --petrol: #186078; --petrol-deep: #0E3F50; --sky: #249CCC; --sky-soft: #E7F4FA; --amber-text: #9A5413;
    --ink: #12303B; --muted: #4B6470; --line: #D3E3EA; --line-strong: #6F8D99; --mist: #F2F7F9; --danger: #B3261E; --ok: #2E7D32;
    --font: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--mist); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: 0; border-radius: 999px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  header { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 24px; background: var(--petrol); color: #fff; }
  header h1 { margin: 0; font-size: 21px; font-style: italic; flex: 1 1 auto; }
  header select, header button { min-height: 36px; padding: 5px 14px; border-radius: 999px; border: 0; font-weight: 700; color: var(--petrol); background: #fff; }
  header nav { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; order: 5; }
  header nav a { color: #fff; text-decoration: none; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.12); }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 70px; }
  @media (max-width: 700px) { main { padding: 14px 12px 60px; } header { padding: 10px 12px; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; min-width: 0; }
  .login { max-width: 460px; margin: 40px auto; }
  h2 { margin: 0 0 6px; color: var(--petrol); font-size: 22px; font-style: italic; }
  .lead, .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .err { color: var(--danger); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .btn { background: var(--petrol); color: #fff; font-weight: 700; padding: 8px 18px; min-height: 42px; }
  .btn-sec { background: #fff; color: var(--petrol); border: 2px solid var(--line-strong); font-weight: 700; padding: 6px 14px; min-height: 38px; }
  .btn-danger { background: #fff; color: var(--danger); border: 2px solid var(--danger); font-weight: 700; padding: 6px 14px; min-height: 38px; }
  .btn-sm { min-height: 32px; padding: 3px 12px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: default; }
  label { font-weight: 600; color: var(--petrol); }
  input.inp, select.inp { padding: 8px 10px; border: 2px solid var(--line-strong); border-radius: 10px; background: #fff; min-width: 0; max-width: 100%; }
  .field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin-bottom: 10px; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; color: var(--muted); font-size: 13px; border-bottom: 2px solid var(--line); padding: 6px 8px; white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: middle; }
  td input.inp, td select.inp { width: 100%; }
  .who { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .who .site { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--mist); }
  .who .site.none { border-style: dashed; }
  .who h3 { margin: 0 0 6px; color: var(--petrol); font-size: 18px; font-style: italic; }
  .who h4 { margin: 8px 0 2px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .who ul { margin: 0; padding-left: 18px; }
  .who li { overflow-wrap: anywhere; }
  .who .n { color: var(--muted); font-size: 13px; }
  pre.json { margin: 0; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; background: var(--mist); border-radius: 8px; padding: 6px 8px; }
  details summary { cursor: pointer; color: var(--petrol); font-weight: 600; }
  .chip { display: inline-block; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 8px; background: var(--sky-soft); color: var(--petrol); }
  #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--petrol-deep); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 60; max-width: calc(100% - 24px); }
  #status.bad { background: var(--danger); }
</style>
</head>
<body>
<header>
  <h1 data-i="title"></h1>
  <select id="lang" aria-label="Language"><option value="el">EL</option><option value="en">EN</option><option value="fr">FR</option><option value="it">IT</option></select>
  <span id="userName"></span>
  <button id="logout" type="button" hidden data-i="logout"></button>
  <nav id="nav" hidden aria-label="Sections">
    <a href="#who" data-i="navOverview"></a><a href="#accounts" data-i="navAccounts"></a><a href="#sites" data-i="navSites"></a>
    <a href="#languages" data-i="navLanguages"></a><a href="#audit" data-i="navAudit"></a>
  </nav>
</header>
<main>
  <section id="vLogin" class="card login" hidden>
    <h2 data-i="login"></h2>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email" data-i="email"></label><input id="email" class="inp" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pass" data-i="password"></label><input id="pass" class="inp" type="password" autocomplete="current-password" required></div>
      <p id="loginErr" class="err" role="alert"></p>
      <button class="btn" type="submit" data-i="login"></button>
    </form>
  </section>
  <section id="vNoAdmin" class="card" hidden><h2 data-i="noAdmin"></h2><p data-i="noAdminText"></p></section>

  <div id="vApp" hidden>
    <section class="card" id="who">
      <h2 data-i="overviewTitle"></h2>
      <p class="lead" data-i="overviewLead"></p>
      <div id="whoList" class="who"></div>
    </section>

    <section class="card" id="accounts">
      <h2 data-i="accountsTitle"></h2>
      <p class="lead" data-i="accountsLead"></p>
      <div class="tbl-wrap"><table id="accTable"><thead><tr><th data-i="colEmail"></th><th data-i="colRole"></th><th data-i="site"></th><th data-i="colAdmin"></th><th data-i="colLast"></th><th></th></tr></thead><tbody></tbody></table></div>
    </section>

    <section class="card" id="sites">
      <h2 data-i="sitesTitle"></h2>
      <p class="lead" data-i="sitesLead"></p>
      <div class="tbl-wrap"><table id="siteTable"><thead><tr><th data-i="colName"></th><th data-i="colPeople"></th><th></th></tr></thead><tbody></tbody></table></div>
      <form id="siteForm" class="row" style="margin-top:12px" novalidate>
        <label for="newSite" data-i="newSite"></label><input id="newSite" class="inp" type="text" maxlength="120" autocomplete="off" style="flex:1 1 220px">
        <button type="submit" class="btn" data-i="add"></button>
      </form>
    </section>

    <section class="card" id="languages">
      <h2 data-i="languagesTitle"></h2>
      <p class="lead" data-i="languagesLead"></p>
      <div class="tbl-wrap"><table id="langTable"><thead><tr><th data-i="colCode"></th><th data-i="colLabel"></th><th data-i="colOrder"></th><th></th></tr></thead><tbody></tbody></table></div>
      <form id="langForm" class="row" style="margin-top:12px" novalidate>
        <input id="lCode" class="inp" type="text" maxlength="40" autocomplete="off" style="width:150px" aria-label="Code">
        <input id="lLabel" class="inp" type="text" maxlength="120" autocomplete="off" style="flex:1 1 220px" aria-label="Label">
        <button type="submit" class="btn" data-i="add"></button>
      </form>
      <p id="lErr" class="err" role="alert"></p>
    </section>

    <section class="card" id="audit">
      <h2 data-i="auditTitle"></h2>
      <p class="lead" data-i="auditLead"></p>
      <div class="row" style="margin-bottom:10px">
        <select id="aEntity" class="inp" aria-label="Entity"></select>
        <select id="aAction" class="inp" aria-label="Action"></select>
        <button type="button" class="btn-sec" id="aLoad" data-i="refresh"></button>
      </div>
      <div class="tbl-wrap"><table id="auditTable"><thead><tr><th data-i="colWhen"></th><th data-i="colWho"></th><th data-i="colWhat"></th><th data-i="colChanges"></th></tr></thead><tbody></tbody></table></div>
    </section>
  </div>
</main>
<div id="status" role="status" hidden></div>

    for (var i = 0; i < p.length; i++) { var c = String(p[i]).slice(0, 2).toLowerCase(); if (I18N[c]) return c; }
    return 'el';
  })();
  function t(k, v) { var s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; if (v) Object.keys(v).forEach(function (x) { s = s.split('{' + x + '}').join(v[x]); }); return s; }
  function applyLang() { document.documentElement.lang = LANG; $('lang').value = LANG; document.title = t('title'); document.querySelectorAll('[data-i]').forEach(function (e) { e.textContent = t(e.getAttribute('data-i')); }); }
  var CFG = window.WM_CONFIG || {}, sb = null;
  try { if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); } catch (e) { sb = null; }
  function el(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
  function opt(v, label) { var o = document.createElement('option'); o.value = v; o.textContent = label; return o; }
  function errText(e) { return (e && (e.message || e.details)) || String(e); }
  function niceErr(e) { return /schema cache|does not exist|could not find/i.test(errText(e)) ? t('needSql') : errText(e); }
  var timer = null;
  function say(msg, bad) { var s = $('status'); s.textContent = msg; s.className = bad ? 'bad' : ''; s.hidden = false; clearTimeout(timer); timer = setTimeout(function () { s.hidden = true; }, 4500); }
  function when(d) { return d ? new Date(d).toLocaleString(LANG) : '—'; }

  var user = null, loadedFor = null, A = { sites: [], users: [], langs: [] };
  $('loginForm').addEventListener('submit', async function (ev) {
    ev.preventDefault(); $('loginErr').textContent = '';
    var r = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
    if (r.error) $('loginErr').textContent = t('loginFail', { e: errText(r.error) });
  });
  $('logout').onclick = function () { if (sb) sb.auth.signOut(); };
  async function onSession(session) {

    $('userName').textContent = user ? (user.email || '') : ''; $('logout').hidden = !user;
    $('vLogin').hidden = !!user; $('vNoAdmin').hidden = true; $('vApp').hidden = true; $('nav').hidden = true;
    if (!user) return;
    var p = await sb.from('profiles').select('is_admin').eq('user_id', user.id).maybeSingle();

    $('vApp').hidden = false; $('nav').hidden = false;
    await loadAll();
  }
  async function loadAll() {
    var r = await Promise.all([sb.from('sites').select('id,name').order('name'), sb.rpc('admin_users'), sb.from('story_languages').select('code,label,position').order('position').order('label'),
                               sb.from('stories').select('user_id,status').neq('status', 'withdrawn'),
                               sb.from('testimonies').select('user_id,status').neq('status', 'withdrawn')]);
    A.counts = {}; (r[3].data || []).forEach(function (x) { A.counts[x.user_id] = (A.counts[x.user_id] || 0) + 1; });
    A.tcounts = {}; (r[4].data || []).forEach(function (x) { A.tcounts[x.user_id] = (A.tcounts[x.user_id] || 0) + 1; });
    if (r[0].error) { say(t('loadErr', { e: niceErr(r[0].error) }), true); return; }
    A.sites = r[0].data || []; A.users = r[1].data || []; A.langs = r[2].data || [];
    if (r[1].error) say(t('loadErr', { e: niceErr(r[1].error) }), true);
    renderWho(); renderSites(); renderLangs(); renderUsers(); renderAuditFilters(); loadAudit();
  }

  // ---- sites ----
  function renderSites() {
    var tb = $('siteTable').tBodies[0]; tb.innerHTML = '';
    A.sites.forEach(function (s) {
      var tr = el('tr'); tr.appendChild(el('td', null, s.name));
      tr.appendChild(el('td', null, String(A.users.filter(function (u) { return u.site_id === s.id; }).length)));
      var td = el('td'), rn = el('button', 'btn-sec btn-sm', t('rename')), dl = el('button', 'btn-danger btn-sm', t('del')); rn.type = dl.type = 'button';
      rn.onclick = async function () { var n = window.prompt(t('renameQ'), s.name); if (!n || !n.trim()) return; var r = await sb.from('sites').update({ name: n.trim().slice(0, 120) }).eq('id', s.id).select('id'); if (r.error) { say(t('saveErr', { e: niceErr(r.error) }), true); return; } s.name = n.trim(); renderSites(); renderWho(); renderUsers(); say(t('saved')); };
      dl.onclick = async function () { if (!window.confirm(t('delSiteQ', { s: s.name }))) return; var r = await sb.from('sites').delete().eq('id', s.id).select('id'); if (r.error) { say(t('saveErr', { e: niceErr(r.error) }), true); return; } A.sites = A.sites.filter(function (x) { return x.id !== s.id; }); renderSites(); renderWho(); renderUsers(); };
      td.appendChild(rn); td.appendChild(document.createTextNode(' ')); td.appendChild(dl); tr.appendChild(td); tb.appendChild(tr);
    });
  }
  $('siteForm').addEventListener('submit', async function (ev) {
    ev.preventDefault(); var n = $('newSite').value.trim(); if (!n) { $('newSite').focus(); return; }
    var r = await sb.from('sites').insert({ name: n.slice(0, 120) }).select('id,name').single();
    if (r.error) { say(t('saveErr', { e: niceErr(r.error) }), true); return; }
    A.sites.push(r.data); A.sites.sort(function (a, b) { return a.name.localeCompare(b.name); }); $('newSite').value = '';
    renderSites(); renderWho(); renderUsers(); say(t('saved'));
  });

  // ---- who works on which pilot site (and how many stories each has uploaded) ----
  function renderWho() {
    var box = $('whoList'); box.innerHTML = '';
    function person(u) {
      var li = el('li'); li.appendChild(document.createTextNode(u.email + (u.name && u.name !== u.email.split('@')[0] ? ' (' + u.name + ')' : '')));
      if (u.role === 'facilitator') {
        var nt = A.tcounts[u.user_id] || 0, ns = A.counts[u.user_id] || 0;
        li.appendChild(el('span', 'n', ' · ' + (nt === 1 ? t('testimony1') : t('testimoniesN', { n: nt })) + ' · ' + (ns === 1 ? t('story1') : t('storiesN', { n: ns }))));
      }
      return li;
    }
    function group(title, users, cls) {
      var c = el('div', 'site' + (cls ? ' ' + cls : '')); c.appendChild(el('h3', null, title));
      [['facilitator', 'facilitatorsLabel'], ['annotator', 'annotatorsLabel']].forEach(function (r) {
        var list = users.filter(function (u) { return u.role === r[0]; });
        c.appendChild(el('h4', null, t(r[1])));
        if (!list.length) { c.appendChild(el('p', 'note', '—')).style.margin = '0'; return; }
        var ul = el('ul'); list.forEach(function (u) { ul.appendChild(person(u)); }); c.appendChild(ul);
      });
      box.appendChild(c);
    }
    A.sites.forEach(function (s) { group(s.name, A.users.filter(function (u) { return u.site_id === s.id; })); });
    var none = A.users.filter(function (u) { return !u.site_id; });
    if (none.length) group(t('noSiteGroup'), none, 'none');
    if (!A.sites.length && !none.length) box.appendChild(el('p', 'note', t('noSites')));
  }

  // ---- languages ----
  function renderLangs() {
    var tb = $('langTable').tBodies[0]; tb.innerHTML = '';
    A.langs.forEach(function (l) {
      var tr = el('tr'); tr.appendChild(el('td', null, l.code));
      var td1 = el('td'), lab = el('input', 'inp'); lab.type = 'text'; lab.maxLength = 120; lab.value = l.label; lab.setAttribute('aria-label', t('colLabel') + ' ' + l.code); td1.appendChild(lab); tr.appendChild(td1);
      var td2 = el('td'), pos = el('input', 'inp'); pos.type = 'number'; pos.min = 0; pos.max = 999; pos.value = l.position; pos.style.width = '80px'; pos.setAttribute('aria-label', t('colOrder') + ' ' + l.code); td2.appendChild(pos); tr.appendChild(td2);
      var td = el('td'), sv = el('button', 'btn-sec btn-sm', t('save')), dl = el('button', 'btn-danger btn-sm', t('del')); sv.type = dl.type = 'button';
      sv.onclick = async function () { var r = await sb.from('story_languages').update({ label: lab.value.trim() || l.label, position: +pos.value || 0 }).eq('code', l.code).select('code'); if (r.error) { say(t('saveErr', { e: niceErr(r.error) }), true); return; } l.label = lab.value.trim() || l.label; l.position = +pos.value || 0; say(t('saved')); };
      dl.onclick = async function () { var r = await sb.from('story_languages').delete().eq('code', l.code).select('code'); if (r.error) { say(t('saveErr', { e: niceErr(r.error) }), true); return; } A.langs = A.langs.filter(function (x) { return x !== l; }); renderLangs(); };
      td.appendChild(sv); td.appendChild(document.createTextNode(' ')); td.appendChild(dl); tr.appendChild(td); tb.appendChild(tr);
    });
    $('lCode').placeholder = t('colCode'); $('lLabel').placeholder = t('colLabel');
  }
  $('langForm').addEventListener('submit', async function (ev) {
    ev.preventDefault(); $('lErr').textContent = '';
    var c = $('lCode').value.trim().toLowerCase(), l = $('lLabel').value.trim();
    if (!/^[a-z0-9-]{2,40}$/.test(c)) { $('lErr').textContent = t('badCode'); $('lCode').focus(); return; }
    if (!l) { $('lErr').textContent = t('needLabel'); $('lLabel').focus(); return; }
    var r = await sb.from('story_languages').insert({ code: c, label: l, position: (A.langs.length ? Math.max.apply(null, A.langs.map(function (x) { return x.position; })) : 0) + 1 }).select('code,label,position').single();
    if (r.error) { $('lErr').textContent = t('saveErr', { e: niceErr(r.error) }); return; }
    A.langs.push(r.data); $('lCode').value = ''; $('lLabel').value = ''; renderLangs(); say(t('saved'));
  });

  // ---- accounts ----
  function renderUsers() {
    var tb = $('accTable').tBodies[0]; tb.innerHTML = '';
    A.users.forEach(function (u) {
      var tr = el('tr'), td0 = el('td'); td0.appendChild(el('div', null, u.email)); td0.appendChild(el('div', 'note', u.name)).style.margin = '0'; tr.appendChild(td0);
      var td1 = el('td'), role = el('select', 'inp'); ['facilitator', 'annotator'].forEach(function (r) { role.appendChild(opt(r, t('role_' + r))); }); role.value = u.role || 'facilitator'; role.setAttribute('aria-label', t('colRole') + ' ' + u.email); td1.appendChild(role); tr.appendChild(td1);
      var td2 = el('td'), site = el('select', 'inp'); site.appendChild(opt('', t('noSite'))); A.sites.forEach(function (s) { site.appendChild(opt(s.id, s.name)); }); site.value = u.site_id || ''; site.setAttribute('aria-label', t('site') + ' ' + u.email); td2.appendChild(site); tr.appendChild(td2);
      var td4 = el('td'), adm = el('input'); adm.type = 'checkbox'; adm.checked = !!u.is_admin; adm.setAttribute('aria-label', t('colAdmin') + ' ' + u.email); td4.appendChild(adm); tr.appendChild(td4);
      tr.appendChild(el('td', null, when(u.last_sign_in_at)));
      var td5 = el('td'), sv = el('button', 'btn btn-sm', t('save')); sv.type = 'button';
      sv.onclick = async function () {
        if (role.value === 'facilitator' && !site.value) { say(t('needSiteFac'), true); site.focus(); return; }
        sv.disabled = true;
        var r = await sb.rpc('admin_set_user', { p_user: u.user_id, p_role: role.value, p_site: site.value || null, p_validator: false, p_admin: adm.checked });
        sv.disabled = false;
        if (r.error) { say(t('saveErr', { e: niceErr(r.error) }), true); return; }
        u.role = role.value; u.site_id = site.value || null; u.is_validator = false; u.is_admin = adm.checked; renderSites(); renderWho(); say(t('saved'));
      };
      td5.appendChild(sv); tr.appendChild(td5); tb.appendChild(tr);
    });
  }

  // ---- audit log ----
  var ENTITIES = ['testimonies', 'stories', 'story_media', 'fragment_notes', 'sites', 'story_languages', 'profiles'];
  function renderAuditFilters() {
    var e = $('aEntity'), cur = e.value; e.innerHTML = ''; e.appendChild(opt('', t('allEntities'))); ENTITIES.forEach(function (x) { e.appendChild(opt(x, x)); }); e.value = cur;
    var a = $('aAction'), ca = a.value; a.innerHTML = ''; a.appendChild(opt('', t('allActions'))); ['insert', 'update', 'delete'].forEach(function (x) { a.appendChild(opt(x, t('a_' + x))); }); a.value = ca;
  }
  async function loadAudit() {
    var q = sb.from('audit_log').select('id,at,user_id,entity,entity_id,action,previous,changes').order('at', { ascending: false }).limit(200);
    if ($('aEntity').value) q = q.eq('entity', $('aEntity').value);
    if ($('aAction').value) q = q.eq('action', $('aAction').value);
    var r = await q, tb = $('auditTable').tBodies[0]; tb.innerHTML = '';
    if (r.error) { var tr0 = el('tr'), td0 = el('td', 'err', t('loadErr', { e: niceErr(r.error) })); td0.colSpan = 4; tr0.appendChild(td0); tb.appendChild(tr0); return; }
    var names = {}; A.users.forEach(function (u) { names[u.user_id] = u.email; });
    (r.data || []).forEach(function (x) {
      var tr = el('tr'); tr.appendChild(el('td', null, when(x.at)));
      tr.appendChild(el('td', null, x.user_id ? (names[x.user_id] || x.user_id) : t('system')));
      var td = el('td'); td.appendChild(el('span', 'chip', x.entity)); td.appendChild(document.createTextNode(' ' + t('a_' + x.action) + ' · ' + (x.entity_id || '').slice(0, 13))); tr.appendChild(td);
      var tc = el('td');
      if (x.changes) tc.appendChild(el('pre', 'json', JSON.stringify(x.changes, null, 1)));
      if (x.previous) { var d = el('details'), s = el('summary', null, t('previous')); d.appendChild(s); d.appendChild(el('pre', 'json', JSON.stringify(x.previous, null, 1))); tc.appendChild(d); }
      tr.appendChild(tc); tb.appendChild(tr);
    });
  }
  $('aLoad').onclick = loadAudit;

  $('lang').onchange = function () { LANG = this.value; try { localStorage.setItem('dm_lang', LANG); } catch (e) {} applyLang(); if (!$('vApp').hidden) { renderWho(); renderSites(); renderLangs(); renderUsers(); renderAuditFilters(); loadAudit(); } };
  applyLang();
  if (!sb) { $('vLogin').hidden = false; $('loginErr').textContent = 'Supabase is not configured (config.js).'; return; }
  sb.auth.onAuthStateChange(function (_e, session) { setTimeout(function () { onSession(session); }, 0); });
})();
</script>
